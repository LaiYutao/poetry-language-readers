</g><g class="text-block"><text y="46" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongUI" font-weight="400" font-size="8" fill="#8b6041" x="418.5 426.5 434.5 470.5 478.5 486.5 516.5 524.5">播放 停止 来源</tspan></text><text y="47" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8.2" fill="#342f2c" x="340.671 343.862 347.962 350.693 354.793 358.432 362.532 364.582 369.143 371.873 374.152 376.43 379.621 383.26 387.36">Jürgen Fritsche</tspan></text><text y="48" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10" fill="#8b6041" x="46 52.67 59.892 63.222 70.443 76.552 83.222 85.722 94.613 101.835 108.505 111.835 119.057 121.557 128.227 131.557 137.665 144.887 150.995 153.495 156.273 158.773 163.773">RAINER MARIA RILKE / 13</tspan></text><text y="84" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="19" fill="#342f2c" x="46 59.721 69.221 75.548 80.298 89.798 98.231 113.01 117.76 128.327 137.827 152.606 167.385 175.818 182.145 188.472 196.905 206.405 214.838">Vor dem Sommerregen</tspan></text></g><g class="verse"><text y="138.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 76.738 82.788 86.818 89.843 95.893 101.263 110.675 113.7 120.429 126.479 135.891 145.303 150.674 154.703 158.732 164.103 170.153 175.523">Vor dem Sommerregen</tspan></text><text y="177.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 76.738 82.788 86.818 89.843 95.213 98.575 104.625 114.037 119.407 122.769 125.794 129.156 133.865 137.226 140.251 145.622 151.672 156.381 159.406 164.776 168.138 171.5 176.87 186.282 189.307 198.045 202.075 208.125 214.175 217.2 220.562 229.973 232.998 239.728 245.098 249.128">Auf einmal ist aus allem Grün im Park</tspan></text><text y="206.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 77.412 82.782 88.832 91.857 100.596 105.966 109.328 115.378 118.403 124.453 127.815 133.185 139.235 142.597 145.622 154.36 159.731 164.44 167.465 170.49 175.86 179.222 185.272 188.297 195.688 199.05 207.788 213.159 217.867 220.892 223.917 227.947 233.997 238.026 241.388 247.438 252.809 258.859 264.909 274.32 283.732 289.103 295.153">man weiß nicht was, ein Etwas, fortgenommen;</tspan></text><text y="235.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 77.412 82.782 88.832 91.857 95.887 101.937 107.987 111.348 114.71 117.735 121.097 127.147 133.197 136.222 142.272 147.643 153.693 159.063 163.093 166.118 171.488 177.538 180.563 186.613 189.975 195.345 198.37 205.1 210.47 216.52 221.229 224.591 229.962 233.991 237.016 243.066 249.116 258.528 267.94 273.31">man fühlt ihn näher an die Fenster kommen</tspan></text><text y="264.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 74.05 80.1 86.15 89.175 93.884 99.254 105.304 114.043 119.413 122.775 128.825 133.534 138.904 148.316 151.341 156.05 161.42 164.782 170.832 173.857 176.882 180.912 186.962 191.671 195.032 200.403 206.453 212.503 215.865 221.915 224.94 230.99 237.04 241.069 244.094 250.144 256.194 262.244 265.269 269.978 273.34 278.71 282.74">und schweigsam sein. Inständig nur und stark</tspan></text><text y="314.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 73.371 77.4 80.762 86.812 92.862 96.223 99.248 104.619 110.669 115.378 118.403 124.453 129.823 139.235 142.26 150.998 156.369 162.419 168.469 171.831 177.201 180.226 186.276 191.647 195.676 198.701 206.772 212.142 218.192 223.563 229.613 235.663 239.692 245.063 248.425 252.454 257.825 261.854">ertönt aus dem Gehölz der Regenpfeifer,</tspan></text><text y="343.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 77.412 82.782 88.832 91.857 97.907 103.278 109.328 115.378 118.74 121.765 127.135 133.185 136.21 141.581 144.943 150.993 156.363 162.413 165.438 174.176 177.538 182.909 186.938 192.988 199.038 205.088 214.5 220.55 225.259">man denkt an einen Hieronymus:</tspan></text><text y="372.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 72.709 78.759 81.784 86.493 91.863 97.913 101.943 104.968 109.676 113.038 118.409 121.771 127.821 131.182 134.207 137.569 141.598 147.648 153.019 159.069 165.119 168.144 175.535 178.897 184.947 189.656 195.026 204.438 210.488 215.859 219.22 222.582 225.607 231.657 237.707 243.757 246.782 254.173 257.535 261.565 266.935">so sehr steigt irgend Einsamkeit und Eifer</tspan></text><text y="401.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 73.371 79.421 84.129 87.154 93.204 96.566 101.937 106.646 112.016 116.046 119.07 124.441 127.803 133.853 139.223 145.273 148.298 155.028 158.39 161.751 171.163 180.575 185.945 188.97 y="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="212.904 220.504">下午</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="228.104">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="230.635">复</tspan></text><text y="619.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="7" fill="#6f7c7b" x="48 51.5">14</tspan></text><text y="632.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="68">在</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="75.6 78.131 80.242 84.042 86.573">(in) </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="90.973 98.573">它们</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="106.173">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="108.704 116.304">与 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="120.704 128.304 133.09 140.69">人 自己</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="148.29">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="150.821 158.421">宾 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="172.423 180.023 187.623 197 204.6">害怕 作为</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="212.2 214.731 218.105 221.062 223.593">(as) </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="227.993 235.593">孩子</tspan></text><text y="662.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">白话译文</tspan></text><text y="685.35" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8 540.9">一下子，公园所有的绿色中——不知是什么——有某个东西被取走了；人感到公园朝窗边更近地走来，沉默无声。</tspan></text><text y="700.65" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">唯有鸻鸟从林丛里恳切而响亮地鸣叫；人想到一位耶罗尼穆斯：孤独与热忱如此强烈地从这唯一的声音升起，骤</tspan></text><text y="715.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7">雨将应允这声音。</tspan></text><text y="739.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9">大厅的墙壁带着壁上的画远离了我们，仿佛不准听到我们所说的话。</tspan></text><text y="762.55" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5">褪色的壁纸映着一些下午那不确定的光，在那些下午，人还是孩子时曾感到害怕。</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 66 70 72.664 74.664 78.664 82.215 88.438 90.438 94.887 98.887 105.109 111.332 114.883 117.547 120.211 123.762 127.762 131.312">13 / Vor dem Sommerregen</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#8b6041" x="540.276 544.776">28</tspan></text></g></svg><button class="hotspot" data-action="play" data-poem="13" style="left:67.02778%;top:4.03853%;width:7.89550%;height:2.13805%" aria-label="播放或暂停第13首" title="播放或暂停第13首"></button><button class="hotspot" data-action="stop" data-poem="13" style="left:75.76323%;top:4.03853%;width:7.22354%;height:2.13805%" aria-label="停止第13首" title="停止第13首"></button><a class="hotspot" href="https://www.youtube.com/watch?v=psF20WW2Kbg" target="_blank" rel="noopener noreferrer" style="left:83.99471%;top:4.03853%;width:8.23148%;height:2.13805%" aria-label="查看原录音与朗读者" title="查看原录音与朗读者"></a>
