500.5 510.6 520.7 530.8">它们留给你（实在难以理清）你的生命，惴惴、巨大而正在成熟，以致它时而受限，时而有所领会，交替在你之</tspan></text><text y="683.55" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8">中成为石头与星辰。</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 66 70 73.551 77.551">05 / Abend</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#8b6041" x="540.276 544.776">13</tspan></text></g></svg><button class="hotspot" data-action="play" data-poem="5" style="left:67.02778%;top:4.03853%;width:7.89550%;height:2.13805%" aria-label="播放或暂停第5首" title="播放或暂停第5首"></button><button class="hotspot" data-action="stop" data-poem="5" style="left:75.76323%;top:4.03853%;width:7.22354%;height:2.13805%" aria-label="停止第5首" title="停止第5首"></button><a class="hotspot" href="https://www.youtube.com/watch?v=mkLd_vFMzVA" target="_blank" rel="noopener noreferrer" style="left:83.99471%;top:4.03853%;width:8.23148%;height:2.13805%" aria-label="查看原录音与朗读者" title="查看原录音与朗读者"></a>
