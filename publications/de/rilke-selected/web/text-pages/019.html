span font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="68 75.6">我们</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="83.2">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="85.731 93.331">主 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="97.731 105.331 109.731">是 这</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="117.331">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="119.862 127.462">主 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="131.862 139.462 147.062 154.662 162.262">他的所属者</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="169.862">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="172.393">复</tspan></text><text y="237.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="7" fill="#6f7c7b" x="51.5">3</tspan></text><text y="250.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="80.922 88.522 96.122 103.722 129.325">笑着的 口</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="136.925">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="139.456">属</tspan></text><text y="266.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="7" fill="#6f7c7b" x="51.5">4</tspan></text><text y="279.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font- 82748e" x="94.792 102.392">主 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="106.792 114.392 121.992 129.592 133.992 141.592">不定式 哭泣</tspan></text><text y="324.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="7" fill="#6f7c7b" x="51.5">6</tspan></text><text y="337.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="74.026 81.626 89.226 93.626">正中 在</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="101.226 103.757 105.868 109.668 112.199">(in) </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="116.599 124.199">我们</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="131.799">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="134.33">与</tspan></text><text y="367.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">白话译文</tspan></text><text y="390.35" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1">死亡很大。我们是它的人，带着笑。正当我们以为自己处在生命中央，它竟敢在我们之中哭泣。</tspan></text><text y="414.05" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight= 3.503 207.631"> meinen im Leben</tspan></text><text y="503.85" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 80.9 89.2 97.5 105.8 114.1 122.4 130.7 139 147.3 155.6 163.9">意为把自己看作置身生命之中。</tspan></text><text y="527.05" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">重点句法</tspan></text><text y="550.15" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6 59.25 62.195 67.495 72.2 78.095 82.8 88.695 94.59 99.295 105.19 107.84 117.845 123.74 129.635 135.531">01 lachenden Munds</tspan></text><text y="567.65" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 231.729 241.829 251.929 256.09 266.19 270.119 280.219 290.319 300.419 310.519 314.68 324.78 334.88 344.98 355.08 365.18 375.28 385.38 395.48 405.58">带形容词的属格短语表达伴随状态，可译“笑着”或“带着笑口”，不是一个新的主语。</tspan></text><text y="591.45" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6 59.25 63.955">02 er</tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="68.66 79.26 89.86">的回指</tspan></text><text y="608.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 50.483"
