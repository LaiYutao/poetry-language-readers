" fill="#342f2c" x="96.556 105.856">… </tspan><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#342f2c" x="160.856 169.634 174.284 178.411 183.061 187.189 192.361 194.686 197.27 199.595 206.829 211.479 216.651 221.823">Morgen / Haupt</tspan></text><text y="160.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 80.9 89.2 97.5 105.8 114.1 122.4 130.7 139 147.3 155.6 163.9 172.2 180.5 188.8 197.1 205.4 213.7 222 230.3 238.6 246.9 255.2 263.5">开篇用春晨透过未长叶的枝丛，比拟头像中无遮挡的光辉。</tspan></text><text y="181.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#8b6041" x="82.428 89.928 97.428 104.928">关系主语</tspan></text><text y="188.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#342f2c" x="56 61.172 65.3 69.428 124.428 133.206 138.378 143.55">der Mund</tspan></text><text y="205.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3">末节</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="72.6 76.75 80.434">der</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="83.198 91.498 99.798 108.098 116.398 124.698 132.998 141.298 149.598 157.898">指嘴，不是前行中性的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="166.198 171.734 175.418 179.568 183.252">Beben</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="187.402">。</tspan></text><text y="228.5" xml:space="preserve" style="white-space: -variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">02 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05 101.65">迟到的主语</tspan></text><text y="310.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 53.294 56.1 59.463 64.513">wird </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="67.038">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="77.138 79.663 83.594 86.4 90.883 95.933 98.458 103.508 107.991 111.354 113.879 120.616 125.666 129.596 134.079 139.129 144.179 148.662 152.025 154.831 159.314 164.364 166.889 171.939 176.422 181.472 185.955"> sich der Rosengarten heben</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="191.005">中</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="201.105 207.842 212.892 216.822 221.305 226.355 231.405 235.888 239.251 242.057 246.54">Rosengarten</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="251.59 261.69 271.79 281.89 291.99 302.09 312.19">是主语；前面的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="322.29 329.584 334.634 339.684 344.167 349.217 354.267 357.63 362.113 367.163">Augenbraun</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="372.213">受</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="382.313 386.796 391.846">aus</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="395.777 405.877 415.977">支配。</tspan></text><text y="334.2" xml:space="preserve" style="w
