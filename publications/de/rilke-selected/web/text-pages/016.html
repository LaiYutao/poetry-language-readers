an><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="163.422 165.728 169.412 173.096 177.246 180.93">lachen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="185.08">。</tspan></text><text y="228.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">重点句法</tspan></text><text y="251.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">01 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85">跨行不是换主语</tspan></text><text y="269.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4">反复出现的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="96.5 106.033 110.516">Wer</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="113.879 123.979 134.079 144.179 154.279 164.379 174.479 184.579 194.679 204.779 214.879 224.979 235.079 245.179 255.279 265.379 275.479 285.579 295.679 305.779 315.879 325.979 336.079 340.008 350.108 354.269 364.369 374.469 384.569">引出泛指的人；第三行仍说这个人，不能另补一个“我”作主语。</tspan></text><text y="292.9" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">02 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85">不同的介词关系</tspan></text><text y="310.4" xml:space="
