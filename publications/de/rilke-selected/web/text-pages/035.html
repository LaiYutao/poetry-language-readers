</g><g class="text-block"><text y="47" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.5" fill="#8b6041" x="532.276 540.776">续页</tspan></text><text y="48" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10" fill="#8b6041" x="46 52.67 59.892 63.222 70.443 76.552 83.222 85.722 94.613 101.835 108.505 111.835 119.057 121.557 128.227 131.557 137.665 144.887 150.995 153.495 156.273 158.773 163.773">RAINER MARIA RILKE / 16</tspan></text><text y="84" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="19" fill="#342f2c" x="46 59.721 68.154 74.481 79.231 92.953 98.231 106.665 116.165 121.443 129.876">Der Dichter</tspan></text></g><g class="text-block"><text y="115.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">重点句法</tspan></text><text y="138.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">01 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45">省略的</tspan><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="91.05 99.88 105.18 109.885 115.78 120.485">machen</tspan></text><text y="156.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 53.294 57.777 61.707 64.232 68.163 73.213 76.019 78.825 81.35 84.156 88.639 93.689 96.214 104.07 106.876 109.682">was soll ich mit </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="112.207 122.307 132.407 142.507 146.436 156.536 166.636 176.736 186.836 196.936 207.036 217.136 227.236 231.397 241.497 251.597 261.697 271.797 281.897">…表示“我该拿……怎么办”，不需为每个</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="291.997 299.853 302.66">mit</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="305.466 315.566 325.666 335.766 345.866 355.966 366.066">短语另添动作。</tspan></text><text y="179.9" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6 59.25 65.145 68.675 74.57 80.466 86.361">02 Stunde</tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="91.066 101.666 112.266">的呼语</tspan></text><text y="197.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 51.05 56.1 58.625 64.242 67.048 72.098 77.148 82.198">du Stunde</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="86.681 96.781 106.881 116.981 127.081 137.181 147.281 157.381 167.481 177.581 187.681 197.781 207.881 217.981">是对时间的直接呼唤；前后两个</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="228.081 233.131">du</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="238.181 248.281 258.381 268.481 278.581 288.681">指同一对象。</tspan></text><text y="221.2" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">03 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05 101.65">给予与消耗</tspan></text><text y="238.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 53.856 56.662 61.145 66.195 68.72 73.77 78.253 83.303">mich gebe</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="87.786">和</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="97.886 102.936 107.419 112.469 116.952 122.002 124.527 132.383 135.189 139.672 144.722 147.247 151.729 156.779">geben mich aus</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="160.71 170.81 180.91 191.01 201.11">互相回应；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="211.21 215.693 220.743 224.673 229.723 234.206 239.256 243.739">ausgeben</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="248.789 258.889 268.989 279.089 289.189 299.289 309.389 319.489">转为耗费，把单词</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="329.589 334.639 339.122 344.172 348.655">geben</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="353.705 363.805 373.905 384.005 394.105 398.034 408.134 418.234 422.395 432.495 442.595 452.695 462.795 472.895 482.995 493.095">始终译作“给予”会丢掉这一转折。</tspan></text><text y="262.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5 98">来源与校对</tspan></text><text y="283.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="46 54.7 63.4">原集第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="72.1 76.45">46</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="80.8 89.5">页；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="98.2 102.55 104.967 107.384 111.734 115.12 117.537 119.954 122.371 126.721 130.583 132.758 139.041 141.458 145.808 148.225 151.611 155.961 160.311 163.208 167.069 170.931 173.106 177.456 180.353 184.703 187.12 193.403 195.82 200.17 202.587 205.004 211.287 215.149 218.046 222.396 228.679 231.096 234.957 239.307 241.725 245.586">https://de.wikisource.org/wiki/Der_Dichter</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="248.483 250.658 259.358 268.058"> 据所列</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="276.758 284.97 287.387 291.737 294.154 297.54 301.89 306.24 309.137 312.998">Wikisource</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="316.86 325.56 334.26 342.96 351.66 360.36 369.06 377.76 386.46 395.16 403.86 412.56 421.26 429.96 438.66 447.36 456.06 464.76 473.46 482.16 490.86 499.56 508.26 516.96 525.66 534.36">校对转录逐字及逐行核对；保留底本历史拼写和分节。未声</tspan></text><text y="296.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="46 54.7 63.4 72.1 80.8 89.5 98.2 106.9 115.6 124.3 133 141.7 150.4 159.1">称逐页独立复核全部扫描影像。</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 66 69.551 72.215 74.215 79.992 82.215 85.766 89.766 91.988 95.539">16 / Der Dichter</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#8b6041" x="540.276 544.776">35</tspan></text></g></svg>
