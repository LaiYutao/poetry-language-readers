;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">重点句法</tspan></text><text y="251.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">01 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05 101.65">命令式串联</tspan></text><text y="269.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 52.169 56.652">Leg</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="61.702">、</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="71.802 74.608 79.091">laß</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="84.141">、</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="94.241 100.978 105.461 108.824 111.63 116.113 121.163">Befiehl</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="123.969">、</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="134.069 139.119 141.925 146.408">gieb</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="151.458">、</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="161.558 166.608 169.972 174.454 179.504 184.554">dränge</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="189.037">、</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="199.137 201.943 206.426 211.476">jage</tspan><tspan font-family="ReaderSongLight"
