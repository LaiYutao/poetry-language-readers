66.852">强化其称谓性，词注保留“一位”，不在原词下注直接替成“上帝”。</tspan></text><text y="221.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5 98">来源与校对</tspan></text><text y="242.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="46 54.7 63.4">原集第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="72.1 76.45">51</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="80.8 89.5">页；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="98.2 102.55 104.967 107.384 111.734 115.12 117.537 119.954 122.371 126.721 130.583 132.758 139.041 141.458 145.808 148.225 151.611 155.961 160.311 163.208 167.069 170.931 173.106 177.456 180.353 184.703 187.12 193.403 195.82 200.17 202.587 205.004 211.287 215.149 218.046 222.396 225.782 228.199 232.549 239.796 244.146 248.496 254.299 256.716 259.133 263.483 267.344 274.592 278.942">https://de.wikisource.org/wiki/Herbst_%28Rilke%29</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="283.292 285.467 294.167 302.867"> 据所列</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="311.567 319.778 322.195 326.545 328.962 332.348 336.698 341.048 343.945 347.807">Wikisource</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="351.668 360.368 369.068 377.768 386.468 395.168 403.868 412.568 421.268 429.968 438.668 447.368 456.068 464.768 473.468 482.168 490.868 499.568 508.268 516.968 525.668 534.368">校对转录逐字及逐行核对；保留底本历史拼写和分</tspan></text><text y="255.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-famil
