 206.092 209.454 214.825 220.875 223.9 226.925 232.975 238.345">Wie soll ich meine Seele halten, daß</tspan></text><text y="206.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 72.709 76.071 81.441 84.466 90.516 93.878 99.248 105.298 108.66 111.685 117.056 123.106 126.131 132.181 137.551 140.913 146.963 152.334 155.359 159.388 165.438 171.488 175.517 178.879 184.25 187.275 198.695 202.057 207.428 210.453 215.162 221.212 224.573 227.935 230.96 234.322 239.692 245.742 248.767 253.476 256.838">sie nicht an deine rührt? Wie soll ich sie</tspan></text><text y="235.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 74.05 77.412 83.462 89.512 94.882 100.932 106.303 112.353 115.378 121.428 127.478 132.848 136.878 139.903 145.953 149.315 154.685 160.735 163.76 169.131 175.181 178.206 183.576 189.626 195.676 201.047 205.076 211.126 214.151 222.889 226.251 232.301 238.351 243.722 249.772">hinheben über dich zu andern Dingen?</tspan></text><text y="264.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 76.738 82.109 88.159 91.184 97.234 102.604 106.634 112.684 118.054 121.079 130.491 136.541 141.912 147.962 151.323 154.348 157.71 163.081 169.131 172.156 176.865 180.226 185.597 188.622 194.672 200.042 203.404 206.429 209.791 213.82 219.87 225.241 231.291 237.341 246.079 251.45">Ach gerne möcht ich sie bei irgendwas</tspan></text><text y="293.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 76.738 82.109 86.138 89.5 95.55 99.579 104.95 111 116.37 125.782 128.807 132.169 141.581 144.606 153.344 159.394 165.444 171.494 176.865 180.226 183.251 189.301 195.351 198.713 204.084 208.113 214.163 218.192 221.554 227.604 233.654 239.025">Verlorenem im Dunkel unterbringen</tspan></text><text y="322.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 73.371 79.421 82.446 87.816 91.178 97.228 102.598 106.628 109.653 113.682 117.712 123.082 132.494 138.544 143.914 149.964 152.989 157.698 161.06 164.422 167.784 171.145 176.516 182.566 185.591 192.32 195.682 201.053 204.415 207.776 213.147 216.172 219.197 225.247 228.609">an einer fremden stillen Stelle, die</tspan></text><text y="351.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 74.05 77.412 82.782 88.832 92.194 95.219 103.957 109.328 112.69 116.051 121.422 125.451 130.16 135.531 141.581 150.319 153.681 159.731 165.781 169.143 172.167 180.906 186.276 192.326 198.376 201.401 207.451 212.822 216.184 222.234 227.604 230.629 238.02 241.382 246.753 250.782 256.153 262.203 265.228 269.936 275.307 281.357 290.095 293.457 299.507 305.557 310.928 316.978">nicht weiterschwingt wenn deine Tiefen schwingen.</tspan></text><text y="380.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 76.738 82.788 88.159 94.209 97.234 102.604 105.966 109.328 114.698 119.407 122.432 131.171 136.541 141.25 144.275 150.325 156.375 161.084 164.109 169.479 175.529 179.559 185.609 191.659 195.688 199.05 202.075 205.1 211.15 214.512 219.882 225.932 228.957 235.007 241.057 247.107 250.132 259.544 262.906 268.276 274.326">Doch alles was uns anrührt, dich und mich,</tspan></text><text y="409.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 74.05 77.412 86.824 96.235 99.597 102.622 108.672 114.722 119.431 122.456 127.826 133.876 138.585 143.956 153.368 162.779 168.15 174.2 177.225 185.963 189.325 194.696 197.72 203.091 206.453 212.503 215.528 223.598 229.648 235.698 241.069 247.119 251.828 255.19 259.219 262.581 267.951 274.001">nimmt uns zusammen wie ein Bogenstrich,</tspan></text><text y="438.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 74.05 79.421 83.45 86.475 91.846 97.896 102.604 105.629 111 119.738 125.109 128.47 131.495 138.225 143.595 146.957 150.319 155.69 161.74 164.765 170.135 173.497 179.547 184.917 187.942 194.672 198.034 201.395 210.807 220.219 225.589 228.614 233.985 237.347 242.717 248.767 252.129">der aus zwei Saiten eine Stimme zieht.</tspan></text><text y="467.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 76.738 82.788 86.818 89.843 98.581 103.951 107.313 112.684 118.734 124.104 128.813 131.838 135.867 141.917 146.626 149.988 154.017 160.067 169.479 174.85 180.9 184.262 187.287 191.995 195.357 201.407 207.457 210.482 219.22 222.582 226.612 229.637 235.687 241.057 245.766 251.816 257.187 263.237 269.287 272.648">Auf welches Instrument sind wir gespannt?</tspan></text><text y="496.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 76.738 82.788 88.838 91.863 100.601 105.972 109.334 114.704 120.754 126.125 130.154 133.179 139.909 145.959 149.321 154.691 158.053 163.423 167.453 170.478 176.528 181.898 185.26 188.285 194.335 200.385 205.094 208.119 211.481 217.531 220.556 226.606 231.976 236.006 239.031 247.769 253.139 259.189 265.239">Und welcher Spieler hat uns in der Hand?</tspan></text><text y="525.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#342f2c" x="68 76.738 79.763 84.472 90.522 96.572 101.943 106.651 109.677 117.068 120.429 125.8 131.85">O süßes Lied.</tspan></text></g><g class="text-block"><text y="115.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5">原文</tspan><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.5" fill="#8b6041" x="77 79.625 83.127"> · </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="85.752 96.252 106.752 117.252">逐词对应</tspan></text><text y="140.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7" fill="#6f7c7b" x="48">题</tspan></text><text y="153.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="84.867 92.467">爱情</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="100.067">|</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="101.589">歌</tspan></text><text y="179.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="7" fill="#6f7c7b" x="51.5">1</tspan></text><text y="192.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="30 8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">黑暗里某个遗失的东西旁，在一个陌生而安静的地方，那里不会随着你的深处振动而继续振动。可是，一切触及</tspan></text><text y="623.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">我们——你和我——的，都把我们收在一起，像一次运弓，从两根弦拉出一个声音。我们绷在哪件乐器上？哪位</tspan></text><text y="639.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7">演奏者把我们握在手中？啊，甜美的歌。</tspan></text><text y="662.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">句法关系</tspan></text><text y="683.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#8b6041" x="83.994 91.494 98.994 106.494 113.994">目的或结果</tspan></text><text y="690.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#342f2c" x="56 61.172 65.822 70.994 133.494 137.114 139.697 143.825 146.15 151.322 153.906 158.034 163.206 166.303">daß sie nicht </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="9.3" fill="#342f2c" x="168.628">…</tspan><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#342f2c" x="177.928 180.253 184.381 189.553 194.725 198.853"> rührt</tspan></text><text y="707.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 80.9 89.2 97.5 105.8 114.1 122.4 130.7 139 147.3 155.6 163.9 172.2 180.5 188.8 197.1 205.4 213.7 222">前问关注如何安置灵魂，使它不触及另一灵魂。</tspan></text><text y="728.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#8b6041" x="82.428 89.928 97.428 104.928">关系主语</tspan></text><text y="735.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#342f2c" x="56 61.172 65.3 69.428 124.428 130.631 135.281 139.931 144.059 149.231 152.85 155.947 160.075 162.659 166.786">der Bogenstrich</tspan></text><text y="752.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="56 60.15 63.834 66.598 68.673 72.357 76.507 79.737 81.812 85.496 91.49 95.174 97.48 99.555 104.171 107.855 110.161 112.467 116.151 120.301">der aus zwei Saiten </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="122.376">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="130.676 132.751 136.435 138.741 142.425 146.575"> zieht</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="148.881 157.181 165.481 173.781 182.081 190.381 198.681">修饰运弓动作。</tspan></text><text y="820.89" xml:space="preserve" s
