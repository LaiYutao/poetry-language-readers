8.3" fill="#6f7c7b" x="80.9 85.05 88.734">der</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="91.498 99.798 108.098 116.398 124.698">指阳性单数</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="132.998 138.992 142.676 146.826">Gang</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="150.976 159.276 167.576 175.876 184.176">，不是复数</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="192.476 197.092 200.776 204.926 207.69 209.996 212.302 214.608">Schritte</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="218.292">。</tspan></text><text y="181.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#8b6041" x="120.416 127.916">停止</tspan></text><text y="188.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#342f2c" x="56 61.172 65.822 69.95 73.047">hört </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="9.3" fill="#342f2c" x="75.372">…</tspan><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#342f2c" x="84.672 86.997 91.647 96.819 99.916 154.916 159.044 164.216 166.541 170.16 174.288 176.872"> auf zu sein</tspan></text><text y="205.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="56 59.684 63.834 66.598 70.748 74.898 77.662 81.346">aufhören</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="85.496 93.796">后接</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="102.096 105.78">zu</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="109.93 118.23 126.53 134.83">不定式，</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="143.13 146.36 150.044 152.35">sein</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="156.5 164.8 173.1 181.4 189.7 198 206.3">指图像的存在。</tspan></text><text y="228.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">重点句法</tspan></text><text y="251.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6 59.25 63.375 69.27 78.1 80.75 83.695 87.82 91.35 94 96.65 101.95 104.895 109.02 111.67 116.97">01 Ihm ist, als ob</tspan></text><text y="269.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 49.363 54.413">Ihm</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="62.269 72.369 82.469 92.569 102.669 112.769">标出感受者；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="122.869 127.352 130.158 134.089 136.614 141.664 146.714">als ob </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="149.239">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="159.339 161.864 166.914 171.397 176.447"> gäbe</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="180.93 191.03 201.13 211.23 221.33 231.43 241.53 251.63 261.73 271.83 281.93 292.03 302.13 312.23 322.33 332.43 342.53 352.63 362.73 372.83 one;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8">二者不是并列主语。</tspan></text><text y="349.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">03 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05">属格跨行</tspan></text><text y="367" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 51.05 55.533 58.896 61.421 68.715 71.521 74.327 78.81 83.86 88.343">der Glieder</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="91.706">是</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="101.806 107.424 110.23 113.036 115.842 118.648">Stille</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="123.131 133.231 143.331 153.431 163.531 173.631 183.731 193.831 203.931 214.031 224.131 234.231 244.331 254.431 264.531">的属格修饰：肢体的寂静，不能把</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="274.631 281.925 284.731 287.537 292.02 297.07 301.553">Glieder</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="304.916 315.016">当作</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="325.116 330.166 335.216 338.579 343.062">durch</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="348.112 358.212 368.312 378.412 388.512 398.612">的直接宾语。</tspan></text><text y="390.8" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><
