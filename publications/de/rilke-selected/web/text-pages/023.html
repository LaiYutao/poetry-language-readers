 fill="#6f7c7b" x="56 60.15 62.456 66.14 68.446 72.13 76.28 79.964">gleichen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="84.114 92.414 100.714 109.014">接与格，</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="117.314 121.464 125.148 131.604 133.679 139.673 143.357 147.507">dem Gang</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="151.657 159.957 168.257 176.557 184.857 193.157">是比较对象。</tspan></text><text y="181.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#8b6041" x="115.763 123.263">省略</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.5" fill="#8b6041" x="130.763 134.513 136.597 139.926 142.01 145.339 149.089">gleicht</tspan></text><text y="188.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#342f2c" x="56 61.172 65.822 69.441 71.766 76.939 80.036 84.163 88.291 93.463 97.591 102.763 163.172 166.791 170.919 173.503 178.675 182.803 190.55 192.875 198.047 200.631 204.759 209.931 213.028 219.744 222.328 226.456 231.628 235.756 239.884 242.468 247.118 250.737 254.356 258.484">das Sterben seinem Sich-Niederlassen</tspan></text><text y="205.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 80.9 89.2 97.5 105.8 114.1 122.4 130.7 139 147.3 155.6 163.9 172.2 180.5">第二节沿用第一节的比较谓语，因此</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="188.8 192.03 195.714 198.02 202.17 205.854">seinem</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="212.31 220.61 228.91 237.21">为与格。</tspan></text><text y="226.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#8b6041" x="115.763 123.263 130.763 138.263">同位说明</tspan></text><text y="233.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#342f2c" x="56 61.172 65.822 69.441 71.766 76.939 80.036 84.163 88.291 93.463 97.591 102.763 157.763 162.936 165.519 169.647 173.266 177.394 181.013 183.338 190.055 192.638 196.766 201.938 205.035 212.782 216.91 222.082 226.21 229.307 233.957 237.576 241.195 245.323 250.495">das Sterben dieses Nichtmehrfassen </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="9.3" fill="#342f2c" x="252.82">…</tspan></text><text y="250.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 80.9 89.2 97.5">同位语延伸至</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="105.8 107.875 111.105 113.411 117.095 121.245"> stehn</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="125.395 133.695 141.995 150.295 158.595 166.895">，核心是主格</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="175.195 177.27 183.264 185.57 189.254 193.404 195.71 202.166 205.85 210 212.764 215.528 219.212 222.442 225.672 229.356"> Nichtmehrfassen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="233.506 241.806 250.106 258.406 261.634 269.934 278.234 286.534 294.834 298.254 306.554 314.854 323.154 331.454 339.754 348.054 356.354">，表示“不再抓住”这一动作／状态；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="364.654 370.648 373.412 377.562 381.712 385.862">Grund </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="387.937 396.237 404.537 412.837 421.137 429.437 437.737 446.037 454.337 462.637 470.937">只是其内部的动作对象。</tspan></text><text y="273.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">重点句法</tspan></text><text y="296.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">01 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05">两个比拟</tspan></text><text y="314.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7">艰难生活对应陆上的步态，死亡对应入水；第二节省略上一节的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="328.8 331.325 336.375 339.181 343.664 346.47 350.953 356.003"> gleicht</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="358.809">，</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="368.909 372.84 377.322 380.129 385.179 389.661 397.517 400.042 405.66 408.466 412.949 417.999 421.362 428.656 431.462 435.945 440.995 445.478 448.841 451.647 456.13 460.061 463.991 468.474 473.524">seinem Sich-Niederlassen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="476.049">因</tspan><tspan font-family="ReaderTimes" font-weight="400" font-siz
