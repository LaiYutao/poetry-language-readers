</g><g class="text-block"><text y="47" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.5" fill="#8b6041" x="532.276 540.776">续页</tspan></text><text y="48" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10" fill="#8b6041" x="46 52.67 59.892 63.222 70.443 76.552 83.222 85.722 94.613 101.835 108.505 111.835 119.057 121.557 128.227 131.557 137.665 144.887 150.995 153.495 156.273 158.773 163.773">RAINER MARIA RILKE / 01</tspan></text><text y="84" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="19" fill="#342f2c" x="46 57.606 62.885 72.385 81.885 90.318 99.818">Eingang</tspan></text></g><g class="text-block"><text y="115.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">重点句法</tspan></text><text y="138.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">01 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05 101.65">无论你是谁</tspan></text><text y="156.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 55.533 60.016 63.379 65.904 70.954 76.004 78.529 83.012 88.062 92.545 97.595 100.12 104.05 108.533 111.339 115.27">Wer du auch seist</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="118.076 128.176 138.276 148.376 158.476 168.576 178.676 188.776 198.876 208.976 219.076 229.176">是让步性的自由关系结构；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="239.276 243.206 247.689 250.495 254.426">seist</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="257.232">为</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="267.332 271.263 275.745 278.552">sein</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="283.602 293.702 303.802 313.902 324.002 334.102 344.202">的第一虚拟式。</tspan></text><text y="179.9" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">02 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05 101.65">省略的主语</tspan></text><text y="197.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 53.294 58.344 63.394 65.919 70.969 75.452 79.382 82.188 84.713 89.763 92.569 97.052 99.577 109.11 113.593 116.399 119.205 121.73 126.78 131.263 139.119 143.602 148.085 153.135">Und hast die Welt gemacht</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="155.941 166.041 176.141 186.241">沿用前文</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="196.341 201.391">du</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="206.441 216.541 226.641 236.741">，不应把</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="246.841 251.891 256.374 260.304">hast</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="263.111 273.211 283.311 293.411 297.339 307.439 317.539 321.701">单译为“拥有”。</tspan></text><text y="221.2" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">03 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05 101.65 112.25">放开的是世界</tspan></text><text y="238.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1">末句</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="66.2 71.25 75.733 78.539 83.589 88.072 90.597 97.891 102.941 107.991 112.474">deine Augen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="117.524 127.624 137.724 147.824">为主语，</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="157.924 161.854 164.66">sie</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="169.143 179.243">承接</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="189.343 194.393 197.199 201.682 204.207 213.74 218.223 221.029">die Welt</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="223.835">；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="233.935 236.741 241.791 245.154 249.637 254.687 257.212 262.829 265.636 270.686">ihren Sinn</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="275.736 285.836 295.936 306.036 316.136 326.236 336.336 346.436 356.536">同样指世界的意义。</tspan></text><text y="262.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="Reade
