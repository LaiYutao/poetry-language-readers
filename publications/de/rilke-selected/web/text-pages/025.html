</g><g class="text-block"><text y="47" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.5" fill="#8b6041" x="532.276 540.776">续页</tspan></text><text y="48" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10" fill="#8b6041" x="46 52.67 59.892 63.222 70.443 76.552 83.222 85.722 94.613 101.835 108.505 111.835 119.057 121.557 128.227 131.557 137.665 144.887 150.995 153.495 156.273 158.773 163.773">RAINER MARIA RILKE / 11</tspan></text><text y="84" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="19" fill="#342f2c" x="46 57.606 62.885 71.318 80.818 89.251 96.645 102.972 114.578 119.857 128.29">Liebes-Lied</tspan></text></g><g class="text-block"><text y="115.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">重点句法</tspan></text><text y="138.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6 59.25 65.145 69.85 72.795 78.69">01 deine</tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="83.395 93.995">省略</tspan><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="104.595 110.49 115.195 119.9 122.845">Seele</tspan></text><text y="156.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 50.483 55.533 58.058 63.108 67.591 70.397 75.447">an deine</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="79.93 90.03">中的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="100.13 105.18 109.663 112.469 117.519">deine</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="122.002 132.102 142.202 152.302 162.402 172.502 176.43 186.53 190.692 200.792 210.892 220.992 224.921 235.021 245.121 255.221 265.321 269.482 279.582 289.682 299.782 309.882 319.982 330.082 340.182 350.282 360.382 370.482 380.582">不是独立的“你”，而是“你的灵魂”；词形承接阴性单数宾格。</tspan></text><text y="179.9" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">02 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85">插入的同位说明</tspan></text><text y="197.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 50.483 53.289 56.095 60.578 64.508 67.033 74.327 78.81 82.741 85.266 90.316 95.366 99.296 101.821 106.304 111.354 114.717 119.767 124.817 128.181">alles was uns anrührt</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="130.987 141.087 151.187">之后的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="161.287 166.337 169.143 173.626 178.676 181.201 186.251 191.301 196.351 198.876 206.732 209.538 214.021">dich und mich</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="219.071 229.171 239.271 249.371">具体说明</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="259.471 264.521 269.571">uns</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="273.502 283.602 293.702 303.802 313.902 324.002 334.102 344.202 354.302 364.402">；白话保留插入位置。</tspan></text><text y="221.2" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">03 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 63.532 74.132 84.732 95.332 105.932 110.257 120.857 131.457">“一个声音”的强调</tspan></text><text y="238.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2">底本将</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="76.3 80.783 83.589 88.639">eine</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="93.122 103.222 113.322 123.422 133.522 143.622 153.722 163.822 173.922 184.022 194.122 204.222 214.322 224.422 234.522 244.622 254.722 264.822 274.922 285.022 295.122 305.222 315.322 325.422 335.522 345.622 355.722 365.822 375.922 386.022 396.122 406.222 416.322 426.422 436.522">作强调排印，强调两弦合成一声；普通逐词文本保留词形，重点说明记录强调。</tspan></text><text y="262.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5 98">来源与校对</tspan></text><text y="283.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="46 54.7 63.4">原集第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="72.1">3</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="76.45 85.15">页；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="93.85 98.2 100.617 103.034 107.384 110.77 113.187 115.604 118.021 122.371 126.233 128.408 134.691 137.108 141.458 143.875 147.261 151.611 155.961 158.858 162.719 166.581 168.756 173.106 176.003 180.353 182.77 189.053 191.47 195.82 198.237 200.654 205.969 208.386 212.247 216.597 220.459 223.844 226.742 232.056 234.473 238.335">https://de.wikisource.org/wiki/Liebes-Lied</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="242.685 244.86 253.56 262.26"> 据所列</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="270.96 279.171 281.588 285.938 288.355 291.741 296.091 300.441 303.338 307.2">Wikisource</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="311.061 319.761 328.461 337.161 345.861 354.561 363.261 371.961 380.661 389.361 398.061 406.761 415.461 424.161 432.861 441.561 450.261 458.961 467.661 476.361 485.061 493.761 502.461 511.161 519.861 528.561 537.261">校对转录逐字及逐行核对；保留底本历史拼写和分节。未声称</tspan></text><text y="296.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="46 54.7 63.4 72.1 80.8 89.5 98.2 106.9 115.6 124.3 133 141.7 150.4">逐页独立复核全部扫描影像。</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 65.109 67.332 70.883 74.883 78.434 81.547 84.211 89.098 91.32 94.871">11 / Liebes-Lied</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#8b6041" x="540.276 544.776">25</tspan></text></g></svg>
