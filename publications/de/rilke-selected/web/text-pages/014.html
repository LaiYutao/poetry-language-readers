</g><g class="text-block"><text y="47" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.5" fill="#8b6041" x="532.276 540.776">续页</tspan></text><text y="48" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10" fill="#8b6041" x="46 52.67 59.892 63.222 70.443 76.552 83.222 85.722 94.613 101.835 108.505 111.835 119.057 121.557 128.227 131.557 137.665 144.887 150.995 153.495 156.273 158.773 163.773">RAINER MARIA RILKE / 05</tspan></text><text y="84" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="19" fill="#342f2c" x="46 59.721 69.221 77.654 87.154">Abend</tspan></text></g><g class="text-block"><text y="115.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">句法关系</tspan></text><text y="136.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#8b6041" x="112.662 120.162 127.662 135.162">共同主语</tspan></text><text y="143.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#342f2c" x="56 61.172 63.756 67.884 70.209 76.412 81.062 86.234 91.406 95.534 99.662 154.662 158.281 162.409 167.581 171.709 174.293 179.465 183.593 188.765 191.09 193.674 195.999 198.583 203.233 206.852 210.471 214.599">die Länder scheiden / lassen</tspan></text><text y="160.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 80.9 89.2 97.5 105.8 114.1 122.4 130.7 139 142.229 150.529 158.829 162.248 170.548 178.848 187.148 195.448 203.748 212.048">两个天地分离，并两次“留下”你或你的生命。</tspan></text><text y="181.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#8b6041" x="80.884 88.384 95.884 103.384">关系宾语</tspan></text><text y="188.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#342f2c" x="56 61.172 63.756 67.884 122.884 130.118 134.245 140.962 145.612 150.784 155.956 160.084">die Gewänder</tspan></text><text y="205.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="56 60.15 62.456 66.14 68.215 70.521 74.671 81.127 83.202 86.886 89.192 93.342 95.417 100.953 104.637 108.787 112.937">die ihm ein Rand </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="115.012">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="123.312 125.387 129.537 133.221 135.527"> hält</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="137.833">中</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="146.133 151.669 155.353 159.503">Rand</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="163.653 171.953 180.253 188.553">为主语，</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="196.853 201.003 203.309">die</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="206.993 215.293 223.593 231.893 240.193 248.493 256.793 265.093">为被托住的衣裳。</tspan></text><text y="228.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">重点句法</tspan></text><text y="251.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6 59.25 65.145 68.09 72.795">01 dich</tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="78.69">与</tspan><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="89.29 95.185 98.13">dir</tspan></text><text y="269.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2">第一次</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="76.3 79.106 83.589 87.519 91.45 95.933 100.983 103.508 108.558 111.364 115.847">lassen dich</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="120.897 130.997 141.097 151.197 161.297 171.397 181.497 191.597 201.697">是把你留下；第二次</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="211.797 214.603 219.086 223.016 226.947 231.43 236.48 239.005 244.055 246.861 250.224 252.749 257.799 262.282 265.088 270.138 272.663 278.833 283.315 288.365 292.848">lassen dir dein Leben</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="297.898">以</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="307.998 313.048 315.854">dir</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="319.218 329.318 339.418 349.518 359.618 369.718">标出承受者、</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="379.818 384.868 389.351 392.157 397.207 399.732 405.901 410.384 415.434 419.917">dein Leben</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="424.967 435.067 445.167 455.267">为宾语。</tspan></text><text y="292.9" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">02 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05 101.65">非限定分词</tspan></text><text y="310.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 51.05 55.533 60.583 65.633 68.996 73.479 78.529">gehörend</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="83.579">、</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="93.679 98.729 103.212 107.142 111.625 116.675 123.969 129.019 132.383 136.865 141.915">beschwörend</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="146.965 157.065 167.165 177.265 187.365 197.465 207.565 217.665">描写被留下的你；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="227.765 232.815 237.298 242.348">bang</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="247.398">、</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="257.498 260.862 263.668 268.151 272.081 276.564 281.614 286.664 291.147 294.51">riesenhaft</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="297.316">、</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="307.416 310.78 315.263 318.069 321.432 325.915 330.965">reifend</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="336.015 346.115 356.215 366.315 376.415 386.515 396.615 406.715 416.815">转而修饰你的生命。</tspan></text><text y="334.2" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">03 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85">双关不强行合并</tspan></text><text y="351.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 51.05 55.533 60.583 63.946 68.429 73.479 77.962">begrenzt</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="80.768">与</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="90.868 95.918 100.401 105.451 108.814 113.297 116.103 119.467 123.95 129">begreifend</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="134.05 144.15 154.25 164.35 174.45 184.55 194.65 204.75 214.85 224.95 228.878 238.978 249.078 253.24 263.34 273.44 283.54 287.469 297.569 307.669 311.83 321.93 332.03 342.13 352.23 362.33 372.43 382.53">形成声音呼应：前者“受限”，后者“领会”；白话分别保留。</tspan></text><text y="375.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6 59.25 65.145 71.04 75.166 80.466 85.766 88.711 91.656 96.36 102.256 104.906 109.61 115.506 118.156 122.86 128.756 132.285 139.94 142.885 147.59 152.295">04 unsäglich zu entwirrn</tspan></text><text y="393" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 50.483 55.533 58.339 65.633 68.439 71.802 75.166">entwirrn</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="80.216">是</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="90.316 94.799 99.849 102.655 109.949 112.755 116.118 119.481 123.964">entwirren</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="129.014 139.114 149.214 159.314 169.414 179.514 189.614 199.714 209.814 219.914 230.014 240.114 250.214 260.314">的诗体缩略，意为解开、理清；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="270.414 275.464 280.514 284.445 288.928 293.978 296.784 299.59 304.073">unsäglich</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="309.123 319.223 329.323 339.423 349.523 359.623 369.723 379.823 389.923 400.023 410.123 420.223 430.323 440.423 450.523 460.623 470.723 474.652 484.752 494.852 504.952 515.052 525.152 535.252">表达不可言说或极深的程度。白话用“实在难以理清”</tspan></text><text y="408.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6">疏通这一压缩插语，保留理清这一动作，且仍指向随后出现的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="318.7 323.75 328.233 331.039 336.089 338.614 344.783 349.266 354.316 358.799">dein Leben</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="363.849 373.949 384.049 394.149 404.249 414.349 424.449 434.549 444.649 448.578 458.678 468.778 472.939 483.039 493.139 503.239">；不把它仅改写为“纠结”的状态。</tspan></text><text y="432" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5 98">来源与校对</tspan></text><text y="453.2" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="46 54.7 63.4">原集第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="72.1 76.45">58</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="80.8 89.5">页；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="98.2 102.55 104.967 107.384 111.734 115.12 117.537 119.954 122.371 126.721 130.583 132.758 139.041 141.458 145.808 148.225 151.611 155.961 160.311 163.208 167.069 170.931 173.106 177.456 180.353 184.703 187.12 193.403 195.82 200.17 202.587 205.004 211.287 215.637 219.499 223.849 228.199 232.549 239.796 244.146 248.496 254.299 256.716 259.133 263.483 267.344 274.592 278.942">https://de.wikisource.org/wiki/Abend_%28Rilke%29</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="283.292 285.467 294.167 302.867"> 据所列</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="311.567 319.778 322.195 326.545 328.962 332.348 336.698 341.048 343.945 347.807">Wikisource</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="351.668 360.368 369.068 377.768 386.468 395.168 403.868 412.568 421.268 429.968 438.668 447.368 456.068 464.768 473.468 482.168 490.868 499.568 508.268 516.968 525.668 534.368">校对转录逐字及逐行核对；保留底本历史拼写和分</tspan></text><text y="466.2" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="46 54.7 63.4 72.1 80.8 89.5 98.2 106.9 115.6 124.3 133 141.7 150.4 159.1 167.8 176.5 185.2 193.9">节。未声称逐页独立复核全部扫描影像。</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 66 70 73.551 77.551">05 / Abend</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#8b6041" x="540.276 544.776">14</tspan></text></g></svg>
