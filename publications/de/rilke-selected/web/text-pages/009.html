" x="80.257 87.857 95.457 103.057 114.115 121.715 129.315 136.915 141.315">无限地 温柔地 在</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="148.915 151.445 153.557 157.357 159.888">(in) </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="164.288 171.888">他的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="179.488">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="182.019 189.619">与 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="197.608 205.208">手中</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="212.808">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="215.339 222.939">复 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="235.098 242.698">托住</tspan></text><text y="517.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">白话译文</tspan></text><text y="540.35" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9">叶子落下，从远方似的落下，仿佛天空中遥远的花园正在枯萎；它们带着否定的手势落下。</tspan></text><text y="563.65" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248">在夜里，沉重的大地从所有星辰之间落入孤独。</tspan></text><text y="586.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3">我们全都在坠落。那只手正在坠落。再看看别的手：坠落就在它们所有之中。</tspan></text><text y="610.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1">然而有一位，将这坠落无限温柔地托在自己手中。</tspan></text><text y="633.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">句法关系</tspan></text><text y="654.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#8b6041" x="113.175 120.675 128.175 135.675 143.175">非现实比较</tspan></text><text y="661.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#342f2c" x="56 60.65 63.234 66.853 69.178 75.894 80.022 82.606 87.778 90.875 95.003 100.175 162.675 165.772 169.9 174.028 179.2 183.328 185.653 192.886 197.536 201.664 204.761 208.889">als welkten ferne Gärten</tspan></text><text y="678.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="56 61.994 65.678 67.984 72.
