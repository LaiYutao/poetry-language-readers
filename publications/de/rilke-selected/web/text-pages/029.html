67.064 69.37 71.676 73.751 76.057 80.207 84.357">fühlt ihn </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="86.432">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="94.732 96.807 100.957 105.107 111.563 118.019 121.703"> kommen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="125.853 134.153">中的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="142.453 144.759 148.909">ihn</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="153.059 161.359 169.659 177.959 186.259 194.559">为阳性，承接</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="202.859 207.475 211.159 213.923">Park</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="218.073 226.373 234.673 242.973 251.273 259.573">，不能指中性</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="267.873 272.943 275.249 281.243 284.927">Etwas</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="288.157">。</tspan></text><text y="181.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#8b6041" x="80.884 88.384 95.884 103.384">关系宾语</tspan></text><text y="188.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#342f2c" x="56 61.172 63.756 67.884 122.884 128.056 131.153 133.737 141.484 149.231">die Stimme</tspan></text><text y="205.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="56 60.15 62.456 6 .715">03 Es spiegeln</tspan></text><text y="351.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 52.169">Es</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5">只占据句首位置，真正复数主语是</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="207.6 212.65 215.456 219.939 222.464 227.514 231.997 235.36 240.41 243.216 246.022 250.505 255.555 260.038 265.088 269.571 274.621 277.146 283.315 287.798 292.848 297.331 300.137 304.62">die verblichenen Tapeten</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="309.67">；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="319.77 323.701 328.751 331.557 336.04 341.09 345.573 348.379">spiegeln</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="353.429 363.529 373.629 383.729 393.829 403.929 414.029 424.129 434.229 444.329">的复数词形给出证据。</tspan></text><text y="375.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6 59.25 67.495 70.44 75.145 79.85 85.15 91.045 96.345 105.175 111.07">04 Hieronymus</tspan></text><text y="393" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5">可联想到隐修的圣耶罗尼穆斯形象；原文不指定某幅画，注释不替作者指定画作。</tspan></text><text y="416.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5 98">来源与校对</tspan></text><text y="437.9" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="46 54.7 63.4">原集第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="72.1 76.45">58</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="80.8 89.5">页；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="98.2 102.55 104.967 107.384 111.734 115.12 117.537 119.954 122.371 126.721 130.583 132.758 139.041 141.458 145.808 148.225 151.611 155.961 160.311 163.208 167.069 170.931 173.106 177.456 180.353 184.703 187.12 193.403 195.82 200.17 202.587 205.004 211.287 215.637 218.534 222.884 227.234 231.096 237.863 242.213 247.052 251.402 258.169 264.936 268.797 271.694 274.592 278.453 282.803 286.665">https://de.wikisource.org/wiki/Vor_dem_Sommerregen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="291.015 293.19 301.89 310.59"> 据所列</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="319.29 327.501 329.918 334.268 336.685 340.071 344.421 348.771 351.668 355.53">Wikisource</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="359.391 368.091 376.791 385.491 394.191 402.891 411.591 420.291 428.991 437.691 446.391 455.091 463.791 472.491 481.191 489.891 498.591 507.291 515.991 524.691 533.391">校对转录逐字及逐行核对；保留底本历史拼写和</tspan></text><text y="450.9" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="46 54.7 63.4 7
