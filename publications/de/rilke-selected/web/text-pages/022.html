·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="129.146 136.746">复 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="141.147">它</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="148.746">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="151.277 158.877">主 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="163.277">它</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="170.877">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="173.408 181.008">宾 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="185.408 193.008 200.608 208.208 221.819 229.419">温柔地 接纳</tspan></text><text y="424.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="7" fill="#6f7c7b" x="51.5">8</tspan></text><text y="437.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="68">并</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="75.6 78.131 81.504 85.304 89.104 91.635">(and) </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="96.035">它</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="103.635">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="106.166 113.766">主 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="118.166 125.766">自己</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="133.366">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="135.897 143.497">宾 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="147.897 155.497">仿佛</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="163.097 165.628 169.001 171.958 173.858 175.97 178.501 181.032">(as if) </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="185.432 193.032 200.632 205.032">幸福 并</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="212.632 215.162 218.536 222.336 226.136 228.667">(and) </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="241.154 248.754">已逝</tspan></text><text y="453.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="7" fill="#6f7c7b" x="51.5">9</tspan></text><text y="466.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="68 75.6 83.2 90.8">在……下</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="98.4 100.931 104.731 108.531 112.331 115.704 118.235 120.766">(under) </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="125.166">它</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="132.766">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="135.297 142.897">与 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="147.297 154.897 162.497 184.86 192.46 200.06 209.167 216.767 227.556 235.156">退去 水波 接 水波</tspan></text><text y="482.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="7" fill="#6f7c7b" x="48 51.5">10</tspan></text><text y="495.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="73.856">而</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="81.456 83.987 89.475 93.275 95.387 97.499 100.872 103.403">(while) </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="108.318">它</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="115.918">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="118.449 126.049">主 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="137.366 144.966 152.566 160.166 175.806 183.406 191.006 195.406">无限地 安静 并</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="203.006 205.537 208.911 212.711 216.511 219.041">(and) </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="224.85 232.45">安稳</tspan></text><text y="511.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="7" fill="#6f7c7b" x="48 51.5">11</tspan></text><text y="524.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="75.993 83.593 91.193 114.197 121.797 129.397 136.997 149.066">愈发 更自主 并</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="156.666 159.197 162.57 166.37 170.17 172.701">(and) </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="185.337 192.937 200.537 208.137">更王者般</tspan></text><text y="540.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="7" fill="#6f7c7b" x="48 51.5">12</tspan></text><text y="553.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="68">并</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="75.6 78.131 81.504 85.304 89.104 91.635">(and) </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="102.77 110.37 117.971 125.57 135.92 143.52 151.12 158.72 163.12 170.72 178.32 195.433 203.033">更从容 不定式 游行 愿意</tspan></text><text y="583.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">白话译文</tspan></text><text y="606.35" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5">这番艰难——沉重地、仿佛受着束缚，走过尚未完成的事——像天鹅笨拙的步态。</tspan></text><text y="629.65" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349">而死亡，就不再抓住我们每天站立的那片地面，则像它畏怯地落下——</tspan></text><text y="652.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">落入水中，水温柔地接纳它，又仿佛幸福而已成过去，一波接一波，从它身下退去；而它无限安静、安稳，越来</tspan></text><text y="668.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1">越自主、越来越有王者气度，越来越从容地游去。</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 66 69.551 72.215 74.215 78.664 82.215 86.215 91.992 95.543">10 / Der Schwan</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#8b6041" x="540.276 544.776">22</tspan></text></g></svg><button class="hotspot" data-action="play" data-poem="10" style="left:67.02778%;top:4.03853%;width:7.89550%;height:2.13805%" aria-label="播放或暂停第10首" title="播放或暂停第10首"></button><button class="hotspot" data-action="stop" data-poem="10" style="left:75.76323%;top:4.03853%;width:7.22354%;height:2.13805%" aria-label="停止第10首" title="停止第10首"></button><a class="hotspot" href="https://www.youtube.com/watch?v=uM-ddYGCvyU" target="_blank" rel="noopener noreferrer" style="left:83.99471%;top:4.03853%;width:8.23148%;height:2.13805%" aria-label="查看原录音与朗读者" title="查看原录音与朗读者"></a>
