</g><g class="text-block"><text y="72" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="22" fill="#342f2c" x="46 68 90 112 134 156 178 200">怎样使用这份读本</tspan></text><text y="110" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="11" fill="#8b6041" x="46 57 68 79 90 101 112 123">词义与语法辅助色</tspan></text></g><g class="text-block"><text y="131.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="46 56.5 67 77.5 88 98.5 109 119.5 130 140.5 151 161.5 172 182.5 193 203.5 214 224.5 235">词下注释采用本册主色；格标记、复数标记</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.5" fill="#342f2c" x="245.5 248.125"> ·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="251.622 262.122 272.622 283.122 293.622 304.122 314.622 325.122 335.622 346.122 356.622 367.122 377.622 388.122 398.622 409.122 419.622 430.122 440.622 451.122 461.622 472.122 482.622 493.122 503.622 514.122 524.622 535.122 545.622">复、括号英文、可分动词方括号及构词分隔符采用低饱和辅助色。</tspan></text><text y="148.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="46 56.5 67 77.5 88 98.5 109 119.5 130 140.5 151 161.5 172 182.5 193 203.5 214 224.5 235 245.5 256 266.5 277 287.5 298 308.5 319 329.5 340 350.5 361 371.5 382 392.5 403 413.5 424 434.5 445 455.5 466 476.5 487 497.5 508 518.5 529 539.5">主、属、与、宾分别代表四格；词形同形且结构未能确定时才并列可能项。明确的名词复数（含名词化形式）</tspan></text><text y="165.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="46 56.5 67 77.5 88">在词注中标</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.5" fill="#342f2c" x="98.5 101.125"> ·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="104.622 115.122 125.622 136.122 146.622 157.122 167.622 178.122 188.622 199.122 209.622 220.122 230.622 241.122 251.622 262.122 272.622 283.122 293.622 304.122 314.622 325.122 335.622 346.122 356.622 367.122 377.622 388.122 398.622 409.122 419.622 430.122 440.622 451.122 461.622 472.122 482.622">复；单数不标，未标不保证一定是单数。白话不机械添加复数词。颜色不替代文字。</tspan></text><text y="199" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="11" fill="#8b6041" x="46 57 68 79 90 101 112">逐词层与白话层</tspan></text><text y="220.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="46 56.5 67 77.5 88 98.5 109 119.5 130 140.5 151 161.5 172 182.5 193 203.5 214 224.5 235 245.5 256 266.5 277 287.5 298 308.5 319 329.5 340 350.5 361 371.5 382 392.5 403 413.5 424 434.5 445 455.5 466 476.5 487 497.5 508 518.5 529">词注保持简短，不代译相邻词，也不把完整解释塞入词下。英文括注只提示当前构式，并非固定对译。冠词</tspan></text><text y="237.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="46 56.5 67 77.5 88 92.084 102.584 106.91 117.41 127.91 138.411 148.911 159.411 169.911 180.411 190.911 201.411 211.911 222.411 232.911 243.411 253.911 264.411 274.911 285.411 295.911 306.411 316.911 327.411 337.911 348.411 358.911 369.411 379.911 390.411 400.911 411.411 421.911 432.411 442.911 453.411">偶简注为“这”，不要求白话逐个译出。白话层保留从句及插入语关系，句内可作中文疏通。</tspan></text><text y="271" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="11" fill="#8b6041" x="46 57 68 79 90 101 112 123 134">引线、复合词与动词</tspan></text><text y="292.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="46 56.5 67 77.5 88 98.5 109 119.5 130 140.5 151 161.5 172 182.5 193 203.5 214 224.5 235 245.5 256 266.5 277 287.5 298 308.5 319 329.5 340 350.5 361 371.5 382 392.5 403 413.5 424">词下无箭头引线仅标对应；句法关系图的箭头说明方向。构词拆分只在中文需要时加</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.5" fill="#342f2c" x="434.5 437.125"> |</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="439.227 449.727 460.227 470.727 481.227 491.727 502.227 512.727 523.227 533.727">，常规词按整体释义。</tspan></text><text y="309.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="46 56.5 67 77.5 88 98.5 109 119.5 130 140.5 151">可分动词的分离部分可用</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.5" fill="#342f2c" x="161.5 164.125 167.622"> [ </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="170.247">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.5" fill="#342f2c" x="180.747 183.372 186.868"> ] </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="189.493 199.993 210.493 220.993 231.493 241.993 252.493 262.993 273.493 283.993 294.493 304.993 315.493 325.993 336.493 346.993 357.493 367.993 378.493 388.993">标出；单纯跨行拆词不能因此判为可分动词。</tspan></text><text y="343" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="11" fill="#8b6041" x="46 57 68 79 90">分行与续页</tspan></text><text y="364.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="46 56.5 67 77.5 88 98.5 109 119.5 130 140.5 151 155.084 165.584 169.911 180.411 190.911 201.411 211.911 222.411 232.911 243.411 253.911 264.411 274.911 285.411 295.911 306.411 316.911 327.411 337.911 348.411 358.911 369.411 379.911 390.411 400.911 411.411 421.911 432.411 442.911 453.411 463.911 474.411 484.911 495.411 505.911 516.41 526.91 537.41">诗题另作逐词对应，以“题”标识，不计入诗行。行号编号原有诗行；额外空白表示诗节。词注与原文保持短距</tspan></text><text y="381.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="46 56.5 67 77.5 88 98.5 109 119.5 130 140.5 151 161.5 172 182.5 193 203.5 214 224.5 235 245.5 256 266.5 277 287.5 298 308.5 319 329.5 340 350.5 361 371.5 382 392.5 403 413.5 424 434.5 445 455.5">离，详细说明移到后续栏目。较长诗或说明允许续页，不靠压小字号或改变原诗断行凑页。</tspan></text><text y="415" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="11" fill="#8b6041" x="46 57 68 79">语法查阅</tspan></text><text y="436.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="46 56.5 67 77.5 88 98.5 109 119.5 130 140.5 151 161.5 172 182.5 193">共通规则见已有手册：格与名词第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.5" fill="#342f2c" x="203.5">2</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="208.75 219.25 229.75 240.25 250.75">章；代词第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.5" fill="#342f2c" x="261.25">4</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="266.5 277 287.5 298 308.5">章；支配第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.5" fill="#342f2c" x="319">5</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="324.25 334.75 345.25 355.75 366.25 376.75 387.25 397.75">章；动词与语序第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.5" fill="#342f2c" x="408.25">6</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="413.5">—</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.5" fill="#342f2c" x="424">9</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="429.25 439.75 450.25 460.75 471.25 481.75 492.25">章；关系从句第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.5" fill="#342f2c" x="502.75 508">10</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="513.25 523.75 534.25">章；语</tspan></text><text y="453.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="46 56.5">气第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.5" fill="#342f2c" x="67 72.25">12</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="77.5 88 98.5 109 119.5">章；分词第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.5" fill="#342f2c" x="130 135.25">14</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="140.5 151 161.5 172 182.5 193 203.5 214">章；形容词变化第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.5" fill="#342f2c" x="224.5 229.75">15</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="235 245.5 256 266.5 277 287.5">章；名词化第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.5" fill="#342f2c" x="298 303.25">16</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="308.5 319 329.5 340 350.5">章；介词第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.5" fill="#342f2c" x="361 366.25">17</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="371.5 382 392.5 403 413.5">章；构词第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.5" fill="#342f2c" x="424 429.25">18</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="434.5 445 455.5 466 476.5">章；省略第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.5" fill="#342f2c" x="487 492.25">19</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.5" fill="#342f2c" x="497.5 508">章。</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8" fill="#6f7c7b" x="46 54 62">里尔克</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="70 72 74.223"> / </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8" fill="#6f7c7b" x="76.223 84.223 92.223 100.223 108.223 116.223 124.223 132.223">怎样使用这份读本</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#8b6041" x="544.776">3</tspan></text></g></svg>
