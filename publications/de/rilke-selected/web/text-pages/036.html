fill="#82748e" x="224.379 226.91 229.022 232.822 235.353">(to) </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="240.048">我</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="247.648">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="250.178 257.778">宾 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="278.103 285.703">指向</tspan></text><text y="482.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="7" fill="#6f7c7b" x="48 51.5">10</tspan></text><text y="495.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="68 75.6">一个</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="83.2">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="85.731 93.331">主 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="97.731 105.331 112.931 120.531 129.577 137.177">轻轻的 继续</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="144.777">|</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="146.299 153.899 161.499 169.099 176.699 223.16 230.76 238.36 249.941 257.541 265.141">挥手之物 已经 几乎不</tspan></text><text y="511.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="7" fill="#6f7c7b" x="48 51.5">11</tspan></text><text y="524.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="78.231 85.831 93.431 101.031 124.798 132.398 160.645 168.245 175.845 188.506 196.106">可解释 再 也许 一棵</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="203.706">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="206.237 213.837">主 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="242.128 249.728">李树</tspan></text><text y="540.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="7" fill="#6f7c7b" x="48 51.5">12</tspan></text><text y="553.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="68">从</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="75.6 78.131 80.662 83.193 86.993 92.904 95.435">(from) </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="99.835">它</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="107.435">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="109.966 117.566">与 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="121.966 129.566">一只</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="137.166">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="139.697 147.297">主 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="151.697 159.297 166.897 174.497 184.196 191.796 199.395 230.061 237.661">布谷鸟 匆忙 飞离</tspan></text><text y="583.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">白话译文</tspan></text><text y="606.35" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">我多么深切地感受过告别意味着什么。我仍那样清楚：一个黑暗、未能克服、残酷的东西，把美好相连的事物再</tspan></text><text y="621.65" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5">显示一次，递到眼前，又将它撕裂。</tspan></text><text y="644.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">我多么毫无抵御地望着那东西，它在——一边呼唤着我——让我离去时，留在后面，仿佛它是所有的女人，却又</tspan></text><text y="660.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9">小，又白，只是这个：</tspan></text><text y="683.55" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">一个招手，已经不再朝向我；一个轻轻继续挥动的东西——，几乎已经无法解释：也许是一棵李树，一只布谷鸟</tspan></text><text y="698.85" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8">已从那里匆匆飞走。</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 66 70 73.113 76.664 80.664 82.887 86.438">17 / Abschied</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#8b6041" x="540.276 544.776">36</tspan></text></g></svg><button class="hotspot" data-action="play" data-poem="17" style="left:67.02778%;top:4.03853%;width:7.89550%;height:2.13805%" aria-label="播放或暂停第17首" title="播放或暂停第17首"></button><button class="hotspot" data-action="stop" data-poem="17" style="left:75.76323%;top:4.03853%;width:7.22354%;height:2.13805%" aria-label="停止第17首" title="停止第17首"></button><a class="hotspot" href="https://www.youtube.com/watch?v=UgcfkAVsUdw" target="_blank" rel="noopener noreferrer" style="left:83.99471%;top:4.03853%;width:8.23148%;height:2.13805%" aria-label="查看原录音与朗读者" title="查看原录音与朗读者"></a>
