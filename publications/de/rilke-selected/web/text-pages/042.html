7.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">看，你感到已经没有什么再挂在你身上；你的壳在无限之中，强劲的汁液在那里聚立、迫涌。一片光芒从外面帮</tspan></text><text y="644.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2">助它，</tspan></text><text y="668.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2">因为在最上方，你的太阳们饱满而炽热地被翻转。然而在你里面，那超越这些太阳的，已经开始。</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 65.559 69.559 73.559 77.559 81.559 85.109 87.109 89.332 93.332 95.332 99.332 102.883 105.547 107.547 113.324 115.547 119.547 122.211 124.434">20 / Buddha in der Glorie</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#8b6041" x="540.276 544.776">42</tspan></text></g></svg><button class="hotspot" data-action="play" data-poem="20" style="left:67.02778%;top:4.03853%;width:7.89550%;height:2.13805%" aria-label="播放或暂停第20首" title="播放或暂停第20首"></button><button class="hotspot" data-action="stop" data-poem="20" style="left:75.76323%;top:4.03853%;width:7.22354%;height:2.13805%" aria-label="停止第20首" title="停止第20首"></button><a class="hots
