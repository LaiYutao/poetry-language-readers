"ReaderSongLight" font-weight="300" font-size="7.5" fill="#8b6041" x="125.847 133.347">主语</tspan></text><text y="691.45" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#342f2c" x="56 61.172 65.3 67.884 73.056 77.184 79.509 86.225 91.397 96.047 100.175 105.347 160.347 162.931 167.581 171.2 174.819 178.947 184.119">deine Augen lassen </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="9.3" fill="#342f2c" x="186.444">…</tspan><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#342f2c" x="195.744 198.069 200.653 205.303"> los</tspan></text><text y="708.45" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3">末句</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="72.6 75.83 78.136">sie</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="81.82 90.12 98.42 106.72 115.02 123.32 131.62 139.92 148.22 156.52 164.82 173.12 181.42 189.72 192.949 201.249 209.549 212.968">是宾语，回指世界；并非主语“她们”。</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 65.109 67.332 71.332 75.332 78.883 82.883">01 / Eingang</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#8b6041" x="544.776">5</tspan></text></g></svg><button class="hotspot" data-action="play" data-poem="1" style="left:67.02778%;top:4.03853%;width:7.89550%;height:2.13805%" aria-label="播放或暂停第1首" title="播放或暂停第1首"></button><button class="hotspot"
