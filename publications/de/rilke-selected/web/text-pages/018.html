tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="122.297 126.228 129.034">sie</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="133.517">指</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="143.617 153.15 155.956 161.006 166.056">Winde</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="170.539 180.639 190.739 200.839 204.768 214.868 224.968 235.068 245.168 249.329 259.429 269.529 279.629 289.729 299.829 309.929 320.029 330.129 340.229 350.329 360.429 370.529 380.629">；不是“风必须活”，而是我必须将它们亲身活过。</tspan></text><text y="179.9" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">02 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05">共享主语</tspan></text><text y="197.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2">第二节</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="76.3 83.594 88.644 93.694 96.219 101.269 104.632 109.115 111.921 114.727">Und breite</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="119.21">、</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="129.31 132.674 137.156 139.963 142.769">falle</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="147.252">、</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="157.352 164.645 169.128 172.492 175.855">werfe</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="180.338">、</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="190.438 195.488 198.294">bin</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="203.344 213.444 223.544">都承接</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="233.644 237.007 241.49">Ich</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="246.54 256.64 266.74 276.84 286.94 297.04 307.14 317.24 327.34 337.44 347.54 357.64 367.74">；这些行不是对他人的命令。</tspan></text><text y="221.2" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">03 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45">旧拼写</tspan></text><text y="238.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 52.169 57.219 62.269 65.633 70.116">Thüren</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="75.166 85.266 95.366">即现代</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="105.466 111.635 116.685 120.049 124.531">Türen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="129.581 139.681 149.781 159.881 169.981 173.91 184.01 188.172 198.272 208.372 218.472 228.572">；词注释“门”，保留原文</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="238.672 244.841">Th</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="249.891">。</tspan></text><text y="262.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-var
