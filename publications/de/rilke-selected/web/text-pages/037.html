3 217.705 221.833 227.005 231.133 236.305 241.477 244.061 246.645 250.772"> zurückblieb</tspan></text><text y="160.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="56 59.684 63.834 67.064 70.748 74.898 78.582 82.732 86.416">zuschauen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="90.566 98.866 107.166">接与格</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="115.466 119.616 123.3">dem</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="129.756 138.056 146.356 154.656">，后面的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="162.956 167.106 170.79">das</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="174.02 182.32 190.62 198.92 207.22 215.52 223.82 232.12 240.42 248.72 257.02 265.32">关系句说明所观看的对象。</tspan></text><text y="181.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#8b6041" x="117.825 125.325 132.825 140.325">插入分词</tspan></text><text y="188.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#342f2c" x="56 63.747 66.331 70.459 75.631 77.956 82.084 87.256 90.353 94.481 99.653 104.825 159.825 163.953">mich rufend es</tspan></text><text y="205.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 75.829 84.129 87.548 95.848 104.148 112.448 120.748 129.048">呼唤“我”的仍是留下的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="137.348 141.032">es</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="144.262 152.562 160.862 169.162 177.462 185.762 194.062 202.362 210.662 218.962 227.262 235.562 243.862 247.091 255.391 258.811 267.111">；插入语不能改挂到离去的“我”上。</tspan></text><text y="228.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">重点句法</tspan></text><text y="251.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">01 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05 101.65 112.25">代词不要抹平</tspan></text><text y="269.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 51.05 55.533">dem</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="63.389">、</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="73.489 78.539 83.022">das</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="86.952">、</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="97.052 101.535">es</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="105.466 115.566 125.666 135.766 145.866 155.966 166.066 176.166 186.266 196.366 206.466 216.566">依次构成回指链；第三节以</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="226.666 232.835 235.641 240.691 243.216 252.749 255.555 260.605 265.655 270.138">Ein Winken</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="275.188 285.288">展开</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="295.388 300.438 303.244 307.727">dies</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="311.658 321.758 331.858 341.958 352.058 362.158 366.087 376.187 386.287 396.387 400.548 410.648 414.577 424.677 428.838 438.938 449.038 459.138 469.238 479.338 489.438 499.538 509.638 519.738 529.838">。译文保留“那东西”与“它”，避免提前替换为具体女</tspan></text><text y="284.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1">人。</tspan></text><text y="308.2" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">02 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05 101.65 112.25">虚拟式与省略</tspan></text><text y="325.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 53.294 57.777 61.14 65.623">wären</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="70.673">’</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="73.38">s</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="77.31 87.41">等于</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="97.51 104.804 109.287 112.65 117.133 122.183 124.708 129.191">wären es</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="133.122 143.222 153.322">；末句</tspan><tspan font-family=
