><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="143.504">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="146.035 153.635">属 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="158.035 165.635">肢体</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="173.235">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#82748e" x="175.766 183.366">复 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="198.516 206.116 213.716 221.316 248.016 255.616">紧绷的 寂静</tspan></text><text y="593.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="7" fill="#6f7c7b" x="48 51.5">12</tspan></text><text y="606.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="68">并</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="75.6 78.131 81.504 85.304 89.104 91.635 96.035">(and) [</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="98.566 106.166 110.566 118.166">停 在这</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="125.766 128.297 130.408 134.208 136.739">(in) </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="141.139 148.739 163.831">心 止</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#82748e" x="171.431 173.962">] </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b6041" x="178.362 185.962 193.562 201.162 205.562 213.162">不定式 存在</tspan></text><text y="636.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">白话译文</tspan></text><text y="659.35" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">它的目光，被不断掠过的栏杆磨得如此疲倦，已经再也容不下什么。它觉得，仿佛有千根栏杆，而千根栏杆后没</tspan></text><text y="674.65" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3">有世界。</tspan></text><text y="697.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">柔韧而有力的脚步所呈现的柔软步态，在极小的圆圈里旋转，像力量围绕一个中心起舞，其中一个巨大的意志麻</tspan></text><text y="713.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4">木地站立。</tspan></text><text y="736.55" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6">只是有时，瞳孔的帘幕无声地推开——。于是一个图像进入，穿过肢体紧绷的寂静——便在心中停止存在。</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 66 69.551 72.215 74.215 78.664 82.215 86.215 88.438 92.438 95.988">09 / Der Panther</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#8b6041" x="540.276 544.776">20</tspan></text></g></svg><button class="hotspot" data-action="play" data-poem="9" style="left:67.02778%;top:4.03853%;width:7.89550%;height:2.13805%" aria-label="播放或暂停第9首" title="播放或暂停第9首"></button><button class="hotspot" data-action="stop" data-poem="9" style="left:75.76323%;top:4.03853%;width:7.22354%;height:2.13805%" aria-label="停止第9首" title="停止第9首"></button><a class="hotspot" href="https://www.youtube.com/watch?v=I7AliPH_fYA" target="_blank" rel="noopener noreferrer" style="left:83.99471%;top:4.03853%;width:8.23148%;height:2.13805%" aria-label="查看原录音与朗读者" title="查看原录音与朗读者"></a>
