</g><g class="text-block"><text y="47" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.5" fill="#8b6041" x="532.276 540.776">续页</tspan></text><text y="48" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10" fill="#8b6041" x="46 52.67 59.892 63.222 70.443 76.552 83.222 85.722 94.613 101.835 108.505 111.835 119.057 121.557 128.227 131.557 137.665 144.887 150.995 153.495 156.273 158.773 163.773">RAINER MARIA RILKE / 14</tspan></text><text y="84" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="19" fill="#342f2c" x="46 58.673 68.173 82.952 88.23 95.625 104.058 113.558 121.991 126.741 137.308 146.808 156.308 161.586 170.02 179.52">Römische Fontäne</tspan></text></g><g class="text-block"><text y="115.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">白话译文</tspan></text><text y="138.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">两个水盆，一个高过另一个，从古老的圆形大理石边缘立起；水从上面的盆中轻轻倾下，流向下面等候着的水。</tspan></text><text y="161.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">下面的水以沉默回应那轻轻说话的水，又秘密地、仿佛在拢起的掌心，将绿与暗背后的天空展示给它，如同一件</tspan></text><text y="176.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5">陌生的物品；</tspan></text><text y="200" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7">在美丽的盆中平静地铺展自身，不带乡愁，一圈接一圈；只是偶尔，梦幻般一滴一滴，</tspan></text><text y="223.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4">沿着垂挂的苔藓降向最后的镜面，镜面借水的流转，从下方使它的盆轻轻微笑。</tspan></text><text y="247" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">句法关系</tspan></text><text y="268" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#8b6041" x="144.939 152.439 159.939 167.439">与格对象</tspan></text><text y="274.8" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#342f2c" x="56 61.172 65.3 73.047 75.372 77.956 82.084 84.667 88.287 92.414 94.739 98.867 102.995 108.167 112.295 117.467 122.639 126.767 131.939 186.939 191.067 196.239 199.336 203.986 208.114 212.764 216.892 222.064 225.683 229.811 234.983 241.7 245.827 248.411 253.061 257.189 262.361">dem leise redenden entgegenschweigend</tspan></text><text y="291.8" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 80.9 89.2 97.5 105.8 114.1 122.4 130.7 139 147.3 155.6 163.9 172.2 180.5 188.8 197.1 205.4 213.7 222 230.3 238.6 246.9 255.2">下方等候的水回应上方轻声说话的水，回应者保持沉默。</tspan></text><text y="313" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#8b6041" x="82.428 89.928 97.428 104.928">关系主语</tspan></text><text y="319.8" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#342f2c" x="56 61.172 65.3 69.428 124.428 129.6 134.772 137.356 141.484 146.134 150.262">der Spiegel</tspan></text><text y="336.8" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3">末句</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="72.6 76.75 80.434">der</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="83.198">指</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="91.498 96.114 100.264 102.57 106.254 110.404 114.088">Spiegel</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="116.394 124.694">，使</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="132.994 136.224 139.908 142.214 146.364 148.439 153.975 157.659 161.343 165.493 169.177">sein Becken</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="173.327 181.627 189.927">微笑。</tspan></text><text y="360" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">重点句法</tspan></text><text y="383.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">01 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85 133.45 144.05">没有总括的限定谓语</tspan></text><text y="400.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 52.169 59.463 63.946 66.752 69.277 76.014 80.497 84.98 90.03 94.513">Zwei Becken</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="99.563 109.663 119.763 129.863 139.963 150.063 160.163 170.263 180.363 190.463 200.563 210.663 220.763 230.863">之后主要用现在分词铺开场景；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="240.963 244.893 247.699 252.182 257.232">stand</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="262.282">与</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="272.382 280.238 284.721 289.204 294.254">macht</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="297.06 307.16 317.26 327.36 337.46 347.56 357.66 367.76 377.86 387.96 398.06 408.16 418.26 428.36 438.46 448.56 458.66 468.76 478.86 488.96 499.06 509.16">属于嵌入关系句，不把全诗强改成一个完整主句。</tspan></text><text y="424.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">02 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85">水流的指代转换</tspan></text><text y="441.9" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6">本册采用下方水回应上方水的读法：第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="217.7">3</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="222.75">行</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="232.85 237.333 242.383 246.313 248.838 253.888 258.371 266.227 268.752 273.802 278.852 283.335 286.699 291.181">aus dem oberen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="296.231 306.331">省略</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="316.431 323.168 327.651 332.134 337.184 341.667">Becken</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="346.717">，</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="356.817 366.35 370.832 374.763 378.693 383.176">Wasser</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="386.54">为</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="396.64 400.57 403.376 407.859 412.909 415.434 420.484 424.967 427.773 432.823 437.306 442.356">sich neigend</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="447.406 457.506 467.606 477.706 487.806 497.906">的承担者；第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="508.006">4</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="513.056 523.156 533.256">行转向</tspan></text><text y="457.2" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7">下方等候的水，第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="126.8">5</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="131.85">—</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="141.95">7</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248">行承接它的沉默与展示。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="258.1 263.15 267.633 275.489 278.014 280.82 285.303 288.109 292.04 296.522 299.047 302.411 306.894 311.944 316.427 321.477 326.527 331.009">dem leise redenden</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="336.059 346.159 356.259 366.359 376.459 386.559 396.659 406.759 416.859 426.959">指上方轻声说话的水，</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="437.059 439.865 444.915">ihm</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="452.772 462.872 472.972 483.072 493.172 503.272 513.372 523.472 533.572 543.672">继续指这一展示对象。</tspan></text><text y="472.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 282.229 292.329 302.429 312.529 322.629 326.79 336.89 346.99 357.09 367.19 377.29 387.39 397.49 407.59 417.69 427.79 437.89 447.99 458.09 468.19">诗以连续分词而非明说的新主语转换视角；白话补出“下面的水”以免把说话者与回应者颠倒。参看</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="478.29 485.584 488.39 493.44 497.923">Divay</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="502.973 513.073 523.173 533.273">的逐层分</tspan></text><text y="487.8" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="46 56.1">析。</tspan></text><text y="511.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">03 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45">原副题</tspan></text><text y="529.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 52.737 60.031 66.767 74.061 81.355 87.524 93.142">BORGHESE</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="99.311 109.411 119.511 129.611 139.711 149.811 159.911 170.011 180.111 190.211 200.311 210.411 220.511 230.611">指博尔盖塞这一地点提示。诗中</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="240.711 250.244 254.727 258.657 262.588 267.071">Wasser</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="270.434 280.534 290.634 300.734 310.834 320.934 331.034 341.134 351.234 361.334 371.434 381.534 391.634 401.734 411.834 421.934 432.034 442.134 452.234 462.334 472.434 482.534 492.634">既是物质名词，也成为展示、等待、沉默的承担者。</tspan></text><text y="552.8" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5 98">来源与校对</tspan></text><text y="574" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="46 54.7 63.4">原集第</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="72.1 76.45">71</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="80.8 89.5">页；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="98.2 102.55 104.967 107.384 111.734 115.12 117.537 119.954 122.371 126.721 130.583 132.758 139.041 141.458 145.808 148.225 151.611 155.961 160.311 163.208 167.069 170.931 173.106 177.456 180.353 184.703 187.12 193.403 195.82 200.17 202.587 205.004 210.807 218.054 223.857 228.207 235.454 241.257 245.607 252.374 254.792 258.177 262.039 266.389 270.25 274.6 279.439 283.789 288.139 290.556 297.803 303.606 307.956 315.203 321.486 325.836 330.186">https://de.wikisource.org/wiki/R%C3%B6mische_Font%C3%A4ne</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="334.047 336.222 344.922 353.622"> 据所列</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="362.322 370.534 372.951 377.301 379.718 383.104 387.454 391.804 394.701 398.562">Wikisource</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="402.424 411.124 419.824 428.524 437.224 445.924 454.624 463.324 472.024 480.724 489.424 498.124 506.824 515.524 524.224 532.924">校对转录逐字及逐行核对；保留底本</tspan></text><text y="587" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="46 54.7 63.4 72.1 80.8 89.5 98.2 106.9 115.6 124.3 133 141.7 150.4 159.1 167.8 176.5 185.2 193.9 202.6 211.3 220 228.7 237.4 246.1 254.8 263.5">历史拼写和分节。未声称逐页独立复核全部扫描影像。副题</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="272.2 278.003 284.286 290.089 296.371 302.654 307.969 312.807">BORGHESE</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="318.121 326.821 335.521 344.221 352.921 361.621 370.321 379.021 387.721 396.421 405.121 413.821 422.521 431.221 439.921">另作题下注明；不混入正文诗行。</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 65.559 69.559 75.781 78.004 81.117 84.668 88.668 92.219 94.219 98.668 102.668 106.668 108.891 112.441 116.441">14 / Römische Fontäne</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#8b6041" x="540.276 544.776">31</tspan></text></g></svg>
