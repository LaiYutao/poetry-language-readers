one;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="56 58.306 62.456 64.531 68.681 72.365">in dem</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="78.821">中</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="87.121 91.271 94.955">dem</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="101.411 109.711 118.011 126.311 134.611 142.911 151.211 159.511 167.811 176.111 184.411">承接烛台这一比喻形象，</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="192.711 197.327 201.011 205.161 208.845 212.995 216.679">Schauen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="220.829">为</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="229.129 233.279 236.963 239.269">hält</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="241.575">和</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="249.875 254.025 256.331 260.015 264.165 267.849">glänzt</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="270.155 278.455 286.755 295.055">的主语。</tspan></text><text y="181.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#8b6041" x="90.711 98.211 105.711 113.211 120.711">反事实推论</tspan></text><text y="188.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#342f2c" x="56 61.172 65.822 70.994 74.614 77.711 140.211 145.383 150.033 155.205 160.377 163.474 167.602 169.927 172.511 174.836 178.455 181.552 186.724 191.896 197.069 201.196 203.521 206.105 208.43 213.602 217.73 222.38 226.508 231.68">Sonst könnte / stünde / bräche</tspan></text><text y="205.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 80.9 89.2 97.5 105.8 114.1 122.4 130.7 139 147.3 155.6 163.9 172.2 180.5 188.8 197.1 205.4 213.7 222">若凝视已不在，后述光辉与观看就不可能发生。</tspan></text><text y="228.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#8b6041" x="56 66.5 77 87.5">重点句法</tspan></text><text y="251.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">01 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05">属格前置</tspan></text><text y="269.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 51.05 56.1 58.906 63.389 66.752 69.277 74.327 78.81 82.174 84.699 90.316 94.799 99.849 104.899 107.705 110.511 114.994 118.357 123.407 125.932 130.982 136.032 139.395 143.878 148.928 152.859 155.665 160.148 165.198 168.004 170.81 175.86 180.343 188.199 190.724 196.341 199.147 204.197 207.561">unter der Schultern durchsichtigem Sturz</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="212.043">：</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="222.143 227.193 231.676 235.04 237.565 243.182 247.665 252.715 257.765 260.571 263.377 267.86 271.223">der Schultern</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="276.273 286.373">修饰</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="296.473 302.09 304.896 309.946 313.31">Sturz</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="317.793 327.893 337.993 348.093 358.193 368.293 378.393 388.493">，整个名词短语由</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="398.593 403.643 408.693 411.499 415.982">unter</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="419.345 429.445 439.545 449.645 459.745 469.845">支配为与格。</tspan></text><text y="292.9" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#342f2c" x="46 51.3 56.6">02 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#342f2c" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85">没有一处不看你</tspan></text><text y="310.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="46 51.05 55.533 58.339 63.389 67.872 70.397 76.014 78.82 83.303 86.109 88.915 93.398 95.923 98.448 103.498 106.304 110.787 113.312 118.362 121.168 125.651 130.701 133.226 138.276 141.082 145.565 150.615 153.421 155.946 159.877 162.683 167.165 172.215">keine Stelle, die dich nicht sieht</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#342f2c" x="175.022 185.122 195.222 205.322 215.422 225.522 235.622 245.722 255.822 265.922 276.022 286.122 296.222 306.322 316.422 326.522 336.622 346.722 356.822 366.922 377.022 387.122">用主句否定加关系句否定表达处处观看；勿漏一个</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#342f2c" x="397.222 402.272 405.078 409.561 414.611">nicht</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill
