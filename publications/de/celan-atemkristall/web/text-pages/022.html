</g><g class="text-block"><text y="47" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.5" fill="#2a7775" x="506.776 515.276 523.776 532.276 540.776">句法与校对</tspan></text><text y="48" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="11" fill="#2a7775" x="46 53.944 60.663 67.382 77.163 85.107 92.444 96.107 102.225 108.944 116.888 123.607 130.326 133.076 136.132 138.882 144.382">ATEMKRISTALL / 10</tspan></text><text y="80" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="19" fill="#24383b" x="46 62.894 68.173 73.452 78.202 86.635 92.962 102.462 116.183 124.616 130.943 136.222 143.616 148.366 157.866 166.299 173.693 183.193 192.693 202.193 210.626 220.126 228.56 238.06 242.81 259.704 268.137 275.531 280.81 289.243">Mit erdwärts gesungenen Masten</tspan></text></g><g class="text-block"><text y="115.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#2a7775" x="56 66.5 77 87.5">重点句法</tspan></text><text y="138.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6">01 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85 133.45 144.05 154.65 165.25 175.85">倒装只改变位置，不改变格</tspan></text><text y="156.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 54.981 57.787 60.593">Mit </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="63.118">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="73.218 75.743 84.723 89.206 93.137 95.943 100.426 105.476"> Masten </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="108.001 118.101 128.201 138.301">占前场，</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="148.401 151.764 156.247 161.297 164.66 169.143 174.193">fahren </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="176.718 186.818 196.918 207.018 217.118 227.218 237.318 247.418 257.518 267.618 277.718">为复数限定动词，后面的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="287.818 290.343 295.393 298.199 302.682 305.207 312.501 315.307 323.163 331.019 335.502 338.308 345.602 348.965 353.448 357.931 362.981 366.912"> die Himmelwracks </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="369.437 379.537 389.637 399.737">是主语。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="409.837 417.693 420.499 423.305">mit </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="425.83 435.93 446.03 456.13 466.23 476.33 486.43">支配与格复数；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="496.53 501.58 506.063 509.993 515.043 520.093 525.143 529.626 534.676 539.159 544.209">gesungenen </tspan></text><text y="171.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1">为第二分词作定语，无冠词时在与格复数用强变化</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="268.2 270.725 274.088 278.571"> -en</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="283.621">。</tspan></text><text y="194.2" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6 59.25 64.55 69.255 73.38 79.275 85.17 90.47 95.175 101.07 105.775 111.67">02 gesungenen </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="114.32 124.92">不是</tspan><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="135.52 138.17 143.47 148.175 152.3 158.195 164.091 169.986 174.691 180.586 185.291"> gesunkenen</tspan></text><text y="211.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2">原文是</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="76.3 78.825 82.756 85.562 90.612 95.662 100.144 105.194"> singen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="107.719 117.819 127.919 138.019 148.119">的第二分词</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="158.219 160.744 165.794 170.277 174.208 179.258 184.308 189.358 193.841"> gesungen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="198.891 208.991 219.091 229.191 239.291 249.391 259.491 269.591">，加定语词尾后成</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="279.691 282.216 287.266 291.749 295.679 300.729 305.779 310.829 315.312 320.362 324.845"> gesungenen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="329.895 339.995 350.095 360.195 370.295 380.395 384.324 394.424 398.585 408.685 418.785 428.885 438.985 442.914 453.014 463.114 473.214 483.314 493.414 497.575 507.675 517.775 527.875 537.975">，意思涉及“唱”。不能因“桅杆、残船”的语境而擅</tspan></text><text y="227" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1">改为</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="66.2 68.725 72.656 75.462 80.512 85.562 90.044 95.094"> sinken </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="97.619">的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="107.719 110.244 115.294 119.777 123.708 128.758 133.808 138.858 143.341 148.391 152.874"> gesunkenen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="157.924 168.024 178.124 188.224 198.324 208.424">（沉下的）。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="218.524 223.006 226.37 231.42 238.714 243.197 246.56 249.366 253.297">erdwärts </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="255.822 265.922 276.022 286.122 296.222 306.322 316.422 326.522 336.622">是不变的方向副词。</tspan></text><text y="249.8" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6">03 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85 133.45 144.05 154.65 165.25">反身与可分动词同时出现</tspan></text><text y="267.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 49.931 52.737 57.219 62.269 64.794 68.158 72.641 76.571 79.377 84.427 88.91 91.716 96.766 101.249">sich festbeißen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="106.299">：</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="116.399 121.449 125.932 128.738 133.788 136.594">beißt </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="139.119 149.219 159.319 169.419 179.519 189.619 199.719 209.819">是第二人称单数，</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="219.919 223.283 227.765 231.696 234.502">fest </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="237.027 247.127 257.227 267.327 277.427 287.527">位于右句框；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="297.627 302.677 305.483 309.966 315.016">dich </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="317.541 327.641 337.741 347.841 357.941 368.041 378.141 388.241">是宾格反身形式。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="398.341 401.147 406.197 408.722 413.772 416.578 421.061 424.992 429.475 433.405 435.93 443.224 448.274 451.08 455.563 458.369 461.175 465.658 470.708">in dieses Holzlied </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="473.233 483.333 493.433 503.533 513.633 523.733 533.833">表示咬入、紧附</tspan></text><text y="282.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3">的目标；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="86.4 94.256 97.062 99.868 102.393 107.443 111.926 116.976 119.501 125.671 130.154
