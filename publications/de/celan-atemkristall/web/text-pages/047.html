ill="#000000" x="46 50.267 55.154 60.536 65.585 68.494 73.382 75.992 85.411 90.298 92.909 100.786 103.868 107.376 113.517 116.127 120.348 126.638 132.503 140.38">regale me with snow:</tspan></text><text y="179.635" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderMinion" font-weight="400" font-size="11.5" fill="#000000" x="46 51.048 55.269 57.88 63.745 67.148 70.656 75.543 81.834 84.445 89.493 93.713 96.324 100.245 102.856 107.077 110.584 114.85 120.715 126.787 131.675 134.286 137.793 143.934 148.2 154.065 160.172 165.554 171.695 174.305 178.526 184.632 194.051 203.469 208.357">as often as I strode through summer</tspan></text><text y="194.035" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderMinion" font-weight="400" font-size="11.5" fill="#000000" x="46 50.221 56.361 62.227 68.333 71.243 77.315 82.202 86.469 89.079 92.587 98.452 101.062 105.283 111.424 117.289 123.395 126.305 132.377 137.264 141.531 144.141 152.019 155.101 158.608 164.749 167.359 170.867 177.008 181.895 184.506 193.924 200.031 202.94 208.782 213.67 217.936 222.203 227.482 230.092 233.6 237.866 242.754 247.641">shoulder to shoulder with the mulberry tree,</tspan></text><text y="208.435" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderMinion" font-weight="400" font-size="11.5" fill="#000000" x="46 49.082 52.59 56.81 59.42 64.699 70.564 76.671 82.961 88.343 93.231 97.451 100.959 103.569 106.478 111.366 116.415">its youngest leaf</tspan></text><text y="222.835" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderMinion" font-weight="400" font-size="11.5" fill="#000000" x="46 50.221 56.361 60.628 63.71 68.597 74.302 79.189 85.261">shrieked.</tspan></text><text y="259.235" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderMinion" font-weight="400" font-size="11.5" fill="#000000" x="46 51.52">02</tspan></text><text y="277.069" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderMinion" font-weight="400" font-size="11.5" fill="#000000" x="46 52.762 60.053 62.663 69.759 78.568 85.1 87.71 96.174 104.719 113.172 120.313 126.845 134.791 145.038 152.133 154.744 159.632 163.139 168.004 174.144 179.032 185.104">BY THE UNDREAMT etched,</tspan></text><text y="291.469" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderMinion" font-weight="400" font-size="11.5" fill="#000000" x="46 49.508 55.648 60.536 63.147 67.367 70.276 75.164 80.052 86.078 88.987 93.875 98.095 102.316 105.225 110.504 113.114 120.992 126.04 132.331 138.403 143.29 147.556 152.444 158.516 162.61 166.118 172.258 176.525 182.39 188.497 193.879 200.02 202.63 208.472 212.739 217.626 222.675 228.747 231.656 236.705 242.995">the sleeplessly wandered-through breadland</tspan></text><text y="305.869" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderMinion" font-weight="400" font-size="11.5" fill="#000000" x="46 50.864 55.913 60.133 63.641 67.862 70.472 76.579 82.605 85.215 88.722 94.864 99.751 102.362 105.271 108.353 111.757 116.645 120.739 130.157 136.022 142.128 148.419 151.926 156.975 160.057 166.347">casts up the life-mountain.</tspan></text><text y="331.769" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderMinion" font-weight="400" font-size="11.5" fill="#000000" x="46 52.084 56.35 62.215 71.633 74.244 77.326 80.834 85.054 87.665 92.529 96.796 102.902 112.32">From its crumb</tspan></text><text y="346.169" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderMinion" font-weight="400" font-size="11.5" fill="#000000" x="46 51.279 57.144 63.25 65.861 71.565 77.855 82.743 87.791 93.863 96.474 101.522 107.812 112.7 120.578 123.188 129.053 135.159 139.426 142.036 148.327 153.375 162.794 167.681 171.902">you knead anew our names,</tspan></text><text y="360.569" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderMinion" font-weight="400" font-size="11.5" fill="#000000" x="46 53.877 60.019 63.1 67.965 74.106 76.716 80.638 83.26 85.871 90.919 97.21 99.82 104.708 109.986">which I, an eye</tspan></text><text y="374.969" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderMinion" font-weight="400" font-size="11.5" fill="#000000" x="46 50.221 53.303 62.721 65.803 68.713 73.761">similar</tspan></text><text y="389.369" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderMinion" font-weight="400" font-size="11.5" fill="#000000" x="46 49.508 55.373 57.983 63.261 69.126 75.233 79.499 83.72 86.331 92.196 98.486 101.097 105.984 111.033 115.897 122.038 124.649 128.053 131.135 137.425 142.807 147.695 151.961">to yours on each finger,</tspan></text><text y="403.769" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderMinion" font-weight="400" font-size="11.5" fill="#000000" x="46 52.026 56.293 62.157 67.999 72.887 75.498 78.901 84.767">probe for</tspan></text><text y="418.169" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderMinion" font-weight="400" font-size="11.5" fill="#000000" x="46 51.048 53.659 59.685 62.594 67.643 72.507 77.395 80.017 82.627 86.135 92.276 96.542 102.407 108.514 113.896 120.037 122.648 130.525 136.666 139.748 144.613 150.754 153.364">a place, through which I</tspan></text><text y="432.569" xml:s
