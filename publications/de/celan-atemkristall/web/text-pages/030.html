8 107.784 110.309 115.359 120.409 125.459 127.984 133.034 137.516 145.373 147.898 157.43 161.913 166.396 171.446 175.929">vom Wachen = von dem Wachen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="180.979">；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="191.079 200.612 205.095 209.578 214.628 219.11 224.16">Wachen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="226.685">是</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="236.785 239.31 246.604 251.087 255.57 260.62 265.103 270.153"> wachen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="272.678 282.778 292.878 302.978 313.078 323.178 333.278 343.378 353.478 363.578 373.678 383.778 393.878 403.978">的名词化不定式，为中性名词。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="414.078 418.008 420.815 425.865 430.915 433.721 438.771 443.254 446.617">stößiger </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="449.142 459.242 469.342 479.442 489.542 499.642">修饰阳性主格</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="509.742 512.267 518.436 521.8 526.283 531.333"> Traum</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="539.189">，</tspan></text><text y="171.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3 86.4">在无词尾的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="96.5 99.025 106.319 110.802 113.608 118.658"> Dein </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="121.183 131.283 141.38
