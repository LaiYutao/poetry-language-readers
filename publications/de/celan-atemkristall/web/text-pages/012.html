7 126.573 129.098 133.581 136.387 139.193 143.676 146.482 151.532 156.582 161.065 166.115 171.165 175.648 179.011 181.817 185.748 190.231">allein-/gängerisch = alleingängerisch</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="195.281">；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="205.381 210.431 215.481 218.844 221.65 226.7 231.183 234.546 239.596 244.646 248.01 250.816 253.341 259.037 261.562 266.612 271.662 276.712 281.195 284.558 289.608 294.658 298.022">un-/berührt = unberührt</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="300.828 310.928 321.028 331.128 341.228 351.328 361.428 371.528 381.628 391.728 401.828 411.928 422.028 432.128 442.228 452.328 462.428 472.528 482.628 492.728 502.828 512.928 523.028 533.128">。后一个词的否定前缀跨行，却始终属于同一个词；不</tspan></text><text y="171.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2">能先把</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="76.3 78.825 83.875 88.358 91.721 96.771 101.821 105.185 107.991"> berührt </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="110.516 120.616 130.716 140.816 150.916 161.016 171.116 181.216">读成肯定再补救。</tspan></text><text y="194.2" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6">02 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="59.25 69.85 80.45">为什么</tspan><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="91.05 93.7 99 104.3 109.005"> vor </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="111.655 122.255 132.855">用宾格</tspan></text><text y="211.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 51.05 56.1 59.463 61.988 67.038 71.521 74.327 79.377 81.902 85.833 90.883 95.366 98.172 102.655 106.585 109.11 116.404 120.887 124.817 127.624 132.106 137.156 139.963">vor dein spätes Gesicht </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="142.488 152.588 162.688 172.788 182.888 192.988 203.088 213.188 223.288 233.388 243.488 253.588 263.688 273.788 283.888 293.988">是来到并停驻的目标，因而是宾格。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="304.088 308.57 313.62 316.145 320.076 322.882 327.365 332.415 336.898 341.948 344.473 349.523 354.573 362.429 370.285 374.768 379.818">zu stehen kommen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="382.343 392.443 402.543 406.472 416.572 426.672 436.772 446.872 456.972 467.072 477.172 487.272 497.372 501.533 511.633 521.733 531.833">表示“来到某处站定／停住”，并不是</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="541.933"> </tspan></text><text y="227" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 51.05 56.1 63.956 71.812 76.295 81.345">kommen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="83.87 93.97 104.07 114.17 124.27 134.37 144.47 154.57 164.67 174.77 184.87 194.97 205.07">后面任意附加一个目的从句。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="215.17 219.653 222.459 229.753 234.236 238.166">etwas </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="240.691 250.791 260.891 270.991">是主语，</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="281.091 286.141 290.624 298.48">kam </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="301.005 311.105 321.205 331.305 341.405">是过去时；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="351.505 355.436 358.242 362.725 367.775 372.825">stehn </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="375.35">是</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="385.45 387.975 391.905 394.711 399.194 404.244 408.727 413.777"> stehen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="416.302 426.402 436.502 446.602 456.702 466.802">的缩短形式。</tspan></text><text y="249.8" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6">03 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85 133.45 144.05">分词还有自己的宾语</tspan></text><text y="267.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 50.483 57.777 60.583 64.513 68.996 74.046 78.529 83.579">zwischen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="86.104">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="96.204 98.729 106.023 110.506 114.989 120.039 122.845 127.328 132.378"> Nächten </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="134.903 145.003 155.103 165.203 175.303 185.403">是与格复数。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="195.503 200.553 205.036 208.399 215.693 220.176 225.226 230.276 234.759 237.565 242.615 247.665 252.148 257.198">verwandelnden </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="259.723 269.823 279.923 290.023 300.123 310.223 320.323 330.423 340.523 350.623 360.723 370.823 380.923 391.023 401.123 411.223">是现在分词作定语，内部带宾格宾语</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="421.323 423.848 431.704 434.51 438.993"> mich</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="444.043">：</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="454.143 459.193 461.999 466.482 469.007 476.3 480.783 485.266 490.316 493.122 497.605">die Nächte </tspan></text><text y="282.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 51.05 55.533 58.896 66.19 70.673 75.723 80.773 85.256 88.062 93.112 95.637 100.12 105.17 109.653 114.703 117.228 125.084 127.89 132.373">verwandeln auch mich</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="137.423">。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="147.523 152.006 157.056 161.538 166.588">auch </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="169.113 179.213 189.313 199.413 209.513 219.613">的自然焦点是</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="229.713 232.238 240.095 242.901 247.384"> mich</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="252.434 262.534 272.634 282.734 292.834 302.934 313.034 316.962 327.062 337.162 347.262 357.362 361.524">，即这些夜晚“也改变我”。</tspan></text><text y="305.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6">04 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85 133.45 144.05">哪些关系仍有开放性</tspan></text><text y="322.9" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 51.05 55.533 59.463">das </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="61.988 72.088">回指</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="82.188 84.713 89.196 92.002 99.296 103.779"> etwas</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="107.71 117.81">，在</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="127.91 130.435 135.485 139.967 143.898"> das </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="146.423">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="156.523 159.048 166.342 170.825 174.188"> war </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="176.713 186.813 196.913 207.013 217.113">里作主语；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="227.213 232.263 236.746 239.552 242.077 247.127 252.177 256.108">bei uns </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="258.633 268.733 278.833 288.933">是与格。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="299.033 303.515 306.322 309.128 313.611 316.417 321.467 326.517 331 336.05 341.1 345.582 348.946 351.752 355.682 360.165 365.215">alleingängerisch </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="367.74 377.84 387.94 398.04 408.14 418.24 428.34 438.44 448.54 458.64 462.569 472.669 482.769 486.93 490.859 500.959 511.059 515.22 525.32 535.42">以及后续描写怎样在“面容”“某物”和整段</tspan></text><text y="338.2" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 292.329 302.429 312.529 322.629 332.729 336.89 346.99 357.09 367.19 377.29 387.39 397.49 407.59 417.69 427.79 437.89 447.99 458.09 468.19 478.29 488.39 498.49 508.59 518.69">景象间分配，是压缩诗句的解释难点。白话译文选择了“某物独行”这一读法，不声称词形已经排除其他关联。</tspan></text><text y="361.9" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#2a7775" x="56 66.5 77 87.5">校对记录</tspan></text><text y="383.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="46 54.7 63.4 72.1 80.8 89.5 98.2 106.9 115.6 124.3 133 141.7 150.4 159.1 167.8 176.5 185.2 193.9">据底本影像保留诗行、分节及历史拼写。</tspan></text><text y="402.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8" fill="#6f7c7b" x="46 54 62">对读：</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="70 72.664 77.113 81.113">[S1]</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8" fill="#6f7c7b" x="83.777 91.777 99.777">，刊页</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="107.777 109.777 113.777"> 20</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8" fill="#6f7c7b" x="117.777 125.777 133.777 141.777 149.777 157.777 165.777 173.777 181.777 189.777">；出处与链接见文末。</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 66 70 72.664 74.664 78.664 82.215 84.438 88.438 90.438 93.551 97.551 101.102 103.324 106.875 109.988 111.988 117.766 121.316 124.43 126.652 130.203 134.203">05 / Vor dein spätes Gesicht</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#2a7775" x="540.276 544.776">12</tspan></text></g></svg>
