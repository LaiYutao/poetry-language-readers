 y="156.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 51.05 53.856 58.339 60.864 66.481 70.964 76.014 83.308 87.791 91.154 99.01 104.06 106.866 110.797 114.727 119.21 124.26 129.31 133.793 136.599 139.405 143.888 148.938 151.463 156.513 159.319 164.369 169.419 174.469 177.833 182.315 187.365">die Schwermutsschnellen hindurch </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="189.89 199.99 210.09 220.19 230.29 240.39">是路径短语，</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="250.49 255.54 258.347 263.397 268.447 273.497 276.86 281.343 286.393">hindurch </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="288.918 299.018 309.118 319.218 329.318 339.418 349.518 359.618 369.718 379.818 389.918 400.018 410.118 420.218 430.318 440.418 450.518 460.618 470.718 480.818 490.918">后置，相关名词短语用宾格。真正主语是后面的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="501.018 503.543 508.593 511.399 515.882 518.407 523.457 526.263 530.746 534.109 538.592 541.398 546.448"> die vierzig </tspan></text><text y="171.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 50.483 55.533 58.339 61.702 64.508 69.558 74.608 79.091 81.897 86.38 91.43 93.955 100.125 104.608 109.658 114.14 119.19 123.121 128.171 132.654 137.704 145.56">entrindeten Lebensbäume</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="150.043 160.143 170.243 180.343 190.443 200.543">，主格复数与</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="210.643 213.168 220.462 224.945 228.308 233.358 237.841 242.891"> werden </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="245.416 255.516 265.616">对应。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="275.716 280.766 283.572 288.055">die </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="290.58 300.68 310.78 320.88 330.98 341.08 351.18 361.28 371.38 381.48 391.58">的复数主格与宾格同形。</tspan></text><text y="194.2" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6 59.25 66.905 71.61 76.315 82.21 86.915 92.81">02 werden </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="95.46 106.06 116.66 127.26 137.86 148.46 159.06 169.66">在这里不是将来时</tspan></text><text y="211.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 53.294 57.777 61.14 66.19 70.673 75.723">werden </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="78.248">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="88.348 90.873 95.923 100.406 103.769 106.575 111.625 116.675 119.481"> geflößt </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="122.006 132.106 142.206 152.306 162.406 172.506 182.606 192.706 202.806">是现在时动作被动：</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="212.906 220.2 224.683 228.047 233.097 237.579 242.629 245.154 250.85">werden + </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="253.375 263.475 273.575 283.675 293.775 303.875 313.975 324.075 334.175 344.275 354.375">第二分词。将来时通常是</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="364.475 367 374.294 378.777 382.141 387.191 391.673 396.723 399.248 404.945"> werden + </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="407.47 417.57 427.67 437.77 447.87 457.97">不定式，例如</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="468.07 470.595 477.888 482.371 485.735 490.785 495.268 500.318 502.843 506.206 509.012 514.062 519.112 523.595"> werden flößen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="528.645">。</tspan></text><text y="227" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 51.05 55.533 58.896 61.702 66.752 71.802 74.608">geflößt </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="77.133 87.233">来自</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="97.333 99.858 103.222 106.028 111.078 116.128 120.611"> flößen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="125.661 135.761 145.861 155.961 166.061 176.161 186.261 196.361 206.461 216.561 226.661 236.761">，意为使木材等随水漂运。</tspan></text><text y="249.8" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6">03 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85">不同的路径表达</tspan></text><text y="267.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 50.483 58.339">am </tspan><tspan fon  x="238.452 242.935 250.791">am </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="253.316">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="263.416 265.941 270.991 276.041 279.405 284.455 288.938 291.744"> vorbei </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="294.269 304.369 314.469 324.569 334.669 344.769 354.869 364.969 375.069 385.169 395.269">整体表示从旁而过，对应</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="405.369 407.894 412.944 417.427 421.357"> past</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="424.163 434.263 444.363 454.463 464.563 474.663 484.763 488.692 498.792 508.892 513.053 523.153 533.253 543.353">；不另添一个“经过”的谓语。</tspan></text><text y="305.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6">04 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85 133.45">称呼、主语和宾语</tspan></text><text y="322.9" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 52.169 54.976 60.026 64.508 67.315 72.365 76.847 79.372 86.666 91.149 96.199 100.682 105.732 109.663 114.145 119.195 126.489 129.295 137.152 145.008 149.49 152.854 155.66 160.71">Einzige Gegenschwimmerin </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="163.235 173.335">是对</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="183.435 185.96 191.01 196.06"> du </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fil
