eaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="110.475 116.37 121.075 126.97">den </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="129.62 140.22 150.82 161.42">各做什么</tspan></text><text y="211.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2">主干是</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="76.3 78.825 81.631 86.114 91.164 93.689 100.983 106.033 111.083 113.889 116.414 124.27 127.076 130.44 132.965 138.015 142.497 147.547 150.072 155.69 160.172 165.222 169.705"> ich wühl mir den Segen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="174.755">：</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="184.855 187.661 192.144 197.194">ich </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="199.719 209.819 219.919 230.019 240.119">主格主语，</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="250.219 258.075 260.881 264.245">mir </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="266.77 276.87 286.97 297.07 307.17 317.27">与格受益者，</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="327.37 332.42 336.903 341.953 344.478 350.095 354.578 359.628 364.111 369.161">den Segen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="371.686 381.786 391.886 401.986 412.086">宾格对象。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="422.186 430.042 432.848 436.211">mir </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="438.736 448.836">指回</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="458.936 461.461 464.267 468.75"> ich</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="473.8 483.9 494 504.1 514.2 524.3">，却不意味着</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="534.4"> </tspan></text><text y="227" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 53.294 58.344 63.394 66.2 70.683 75.733">wühlen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="78.258 88.358 98.458 108.558 118.658 128.758 138.858 148.958 159.058 169.158 179.258 189.358 199.458 209.558 219.658 229.758 239.858">在词典中只能作为反身动词出现。英语</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="249.958 252.483 257.533 260.339 265.389 267.914 271.844 276.894 284.751 289.233 292.04 297.09 299.896 304.946 309.996 312.521 317.571 322.621 325.427 327.952 331.315 336.365 339.729 342.254 350.11 355.16 359.09 363.573 366.379 369.742"> dig something out for myself </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="372.267 382.367 392.467 402.567 412.667 422.767 432.867 442.967 453.067 463.167">可帮助理解这一与格。</tspan></text><text y="249.8" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6">03 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="59.25 69.85 80.45 91.05 101.65">为什么不是</tspan><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="112.25 114.9 120.2 126.095 130.22 132.87 138.766 141.711"> aus die</tspan></text><text y="267.3" xml:space="preserve" style t-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="500.988 511.088 521.188 531.288">后用弱变</tspan></text><text y="282.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46">化</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="56.1 58.625 61.988 66.471"> -en</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="71.521 81.621 91.721 101.821">。它来自</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="111.921 114.446 119.496 123.979 127.342 131.273 134.079 138.562 141.368 146.418 150.901 154.264 159.314"> versteinern </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="161.839 171.939 182.039 192.139 202.239 212.339 222.439 232.539 242.639 252.739 262.839 272.939 283.039 293.139">的第二分词，意思是石化了的。</tspan></text><text y="305.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6">04 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85 133.45 144.05 154.65 165.25 175.85 186.45">复合词要拆，也要重新合起来</tspan></text><text y="322.9" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 53.294 56.1 60.583 63.946 67.31 72.927 75.733 80.783 85.833 90.316 93.679 97.042 102.66 107.71 111.073 115.556 120.606 125.089">Vier-Finger-Furche </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="127.614 137.714 141.643 151.743 161.843 171.943 182.043 186.204 196.304 200.233 210.333 2
