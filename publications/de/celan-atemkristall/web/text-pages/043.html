</g><g class="text-block"><text y="47" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.5" fill="#2a7775" x="506.776 515.276 523.776 532.276 540.776">句法与校对</tspan></text><text y="48" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="11" fill="#2a7775" x="46 53.944 60.663 67.382 77.163 85.107 92.444 96.107 102.225 108.944 116.888 123.607 130.326 133.076 136.132 138.882 144.382">ATEMKRISTALL / 21</tspan></text><text y="80" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="19" fill="#24383b" x="46 63.933 72.366 81.866 91.366 99.799 109.299 117.732 123.011 131.444 136.723 141.473 150.973 160.473 175.252 180.002 190.569 195.848 202.175 210.608 220.108 225.387 233.82 243.32 257.041 262.32 271.82">Weggebeizt vom Strahlenwind</tspan></text></g><g class="text-block"><text y="115.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#2a7775" x="56 66.5 77 87.5">白话译文</tspan></text><text y="138.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 453.929 464.029 474.129 478.29">被你的语言的射线之风蚀去的，是那附着而来的经历的斑斓空谈——那百舌的伪誓之诗，那“否诗”。</tspan></text><text y="161.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" fon
