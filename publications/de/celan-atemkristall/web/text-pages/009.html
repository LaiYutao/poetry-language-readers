458 108.558 118.658 128.758 138.858 148.958 159.058 169.158 179.258 189.358 199.458 209.558 219.658 229.758 239.858">是宾格复数，表示把词压进沟槽：</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="249.958 257.252 262.302 264.827 269.877 273.24 277.723 282.773 285.579 288.104 293.154 297.637 301.567 304.092 313.625 318.675 322.039 324.845 327.37 330.176 335.226 337.751 342.801 345.607 350.09 352.615 359.352 362.158 364.964 367.77 372.253">Du preßt das Wort in die Rillen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="377.303 387.403 397.503 407.603 417.703 427.803">。底本影像的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="437.903 440.428 445.478 449.961 455.011 457.536 464.272 467.078 469.884 472.69 477.173 482.223"> den Rillen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="484.748 494.848 504.948 515.048 525.148 535.248 545.348">若按语法分析，</tspan></text><text y="171.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1">则是位置与格，只说明挤压发生在沟槽中；两者不等义。本页依对读刊本采用更符合目标关系的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="470.2 472.725 480.019 483.382"> DIE</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="489.552 499.652 509.752 519.852 529.952">，底本影像</tspan></text><text y="186.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46">的  441.505 451.605">是主语，</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="461.705 466.755 471.238 479.094">dem </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="481.619 491.719 501.819">是回指</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="511.919 514.444 523.977 529.027 532.39 535.196"> Wort </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="537.721">的</tspan></text><text y="242.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 150.929 161.029 171.129 181.229 191.329 201.429 211.529 221.629 225.79">与格关系代词；白话取“我从它那里展开”。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="235.89 239.821 244.871 248.234 251.04 254.971">Joris </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="257.496">译</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="267.596 270.121 273.484 276.847 281.897 289.753 292.278 299.572 304.622 307.428 311.911 316.961 319.486 322.85 325.375 328.738 333.788 336.594 339.4 343.883"> from which I rolled</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="348.933 359.033 369.133 379.233 389.333 399.433 409.533 419.633 429.733 439.833 449.933 460.033 470.133 480.233 490.333 500.433 510.533 520.633 530.733">，保留了卷动与脱离的意象。这里是诗性用</tspan></text><text y="257.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147">法，不把这处与格概括为</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="157.1 159.625 164.108 169.158 171.964 175.327 180.377 183.183 185.99 190.472 195.522"> entrollen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="198.047 208.147 218.247 228.347 238.447 248.547 258.647 268.747">的一般支配规则。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="278.847 282.211 287.828 292.878">[S11</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="297.928">、</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="308.028 313.645 318.695 323.745 327.108">S17] </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="329.633 339.733 349.833">后面的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="359.933 362.458 366.941 369.747 373.678"> als </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="376.203 386.303 396.403 400.332 410.432 420.532 430.632 440.732 444.893 454.993 465.093 475.193 485.293 495.393 505.493 515.593 525.693 535.793">引导“当……时”的时间从句，说明展开</tspan></text><text y="272.9" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 140.829 150.929 161.029 165.19 175.29 185.39 195.49 205.59 215.69 225.79 235.89 245.99 256.09 266.19 276.29 286.39 296.49 306.59 316.69 326.79 336.89 346.99 357.09 367.19 377.29 387.39 397.49 407.59 417.69 427.79 437.89 447.99 458.09 468.19 478.29 488.39 498.49 508.59 518.69 528.79 532.719">发生之时；不是表示“那时”的独立时间副词。译文保留关系从句后接时间从句的次序，只在时间从句内部前移“为</tspan></text><text y="288.2" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3 80.461 90.561 100.661 110.761 120.861 130.961 141.061 151.161 161.261 165.19 175.29 185.39 195.49 205.59 209.751 219.851 229.951 240.051 250.151 260.251">了……”短语，以明确中文“当……时”的完整框架。</tspan></text><text y="311" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6">03 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85">动词末位与后场</tspan></text><text y="328.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 50.483 53.289 57.219">als </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="59.744 69.844 79.944 90.044 100.144 110.244">从句的核心是</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="120.344 122.869 125.676 130.158 135.208"> ich </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="137.733">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="147.833 150.358 155.408 159.891 163.822 166.347 173.641 178.124 182.606 187.656"> das Dach </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="190.181">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="200.281 202.806 207.289 212.339 215.145 218.509 223.559"> abtrug</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="228.609">；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="238.709 243.192 248.242 251.048 254.411 259.461 264.511">abtrug </tspan><tspan fo
