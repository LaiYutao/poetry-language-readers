ve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#2a7775" x="105.744 113.244 120.744 128.244 135.744">带与格补语</tspan></text><text y="608.45" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#24383b" x="56 60.65 64.778 69.95 74.6 78.728 82.347 86.997 94.744 155.244 160.416 164.544 169.716">gehorsam den </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="9.3" fill="#24383b" x="172.041">…</tspan><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#24383b" x="181.341 183.666 190.382 195.032 199.682 203.81 211.557 216.729 220.857 224.985 228.604 231.701 235.829 239.957 245.129 249.257"> Novembersternen</tspan></text><text y="623.45" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 80.9 89.2 97.5 105.8 114.1 122.4 130.7 139 147.3 155.6 163.9 167.129 175.429 183.729 192.029 200.329 208.629 216.929 225.229 233.529 241.829 245.248">形容词也能支配格：这里表示“顺从那些十一月星辰”。</tspan></text><text y="641.65" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#2a7775" x="136.753 144.253">回指</tspan></text><text y="648.45" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#24383b" x="56 61.172 65.3">der</tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="9.3" fill="#24383b" x="69.428">（</tspan><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#24383b" x="78.728 83.378 88.028 93.2 95.525 100.697 104.825">von der</tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="9.3" fill="#24383b" x="108.953 118.253">） </tspan><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#24383b" x="171.253 175.381 177.964 183.137 187.264 189.589 194.762 198.889 204.062 209.234">eine Sehne</tspan></text><text y="663.45" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="56 60.15 64.3 68.45">von </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="70.525">使</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.3" fill="#6f7c7b" x="78.825 80.9 85.05 88.734 91.498"> der </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="93.573 101.873 110.173 118.473 126.773 135.073 143.373 151.673 159.973 168.273 176.573 184.873 193.173 201.473 209.773 218.073 226.373 234.673 242.973 251.273 259.573 267.873">用与格；整个短语说明箭之文字从哪里飞鸣而出。</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 65.559 69.109 71.332 77.555 79.555 85.332 88.883 92.883 96.434 98.656 102.656 106.656 109.32">12 / Beim Hagelkorn</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#2a7775" x="540.276 544.776">25</tspan></text></g></svg><button class="hotspot" data-action="play" data-poem="12" style="left:67.02778%;top:4.03853%;width:7.89550%;height:2.13805%" aria-label="播放或暂停第12首" title="播放或暂停第12首"></button><button class="hotspot" data-action="stop" data-poem="12" style="left:75.76323%;top:4.03853%;width:7.22354%;height:2.13805%" aria-label="停止第12首" title="停止第12首"></button><a
