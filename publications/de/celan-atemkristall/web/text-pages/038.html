mes" font-weight="400" font-size="10.1" fill="#24383b" x="46 53.294 57.777 61.14 66.19 68.996 72.927 77.41 82.46 86.39 89.196 92.56 95.366 99.849 107.705 112.188 117.238">Harnischstriemen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="119.763 129.863 139.963 150.063 160.163 170.263 180.363 190.463 200.563 210.663 220.763 230.863 240.963">指断层面上运动造成的擦痕；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="251.063 256.68 261.163 263.969 266.775 271.258 276.308 280.79 285.273 290.323 294.254 298.737 303.787">Faltenachsen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="306.312 316.412 326.512 336.612 346.712">为褶皱轴。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="356.812 364.106 366.912 371.962 375.325 378.131 381.495 386.545 390.475 394.958">Kluftrose </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="397.483 407.583 417.683 427.783 437.883 447.983 458.083 468.183 478.283 488.383 498.483 508.583 518.683 528.783 538.883">指表现裂隙方向分布的玫瑰图，并</tspan></text><text y="227" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3 80.229 90.329 100.429 110.529 120.629 130.729 140.829 150.929 155.09 165.19 175.29 185.39 195.49 205.59 215.69 225.79 235.89 245.99 256.09 266.19 276.29 286.39 296.49 306.59 316.69 326.79 336.89 346.99 357.09 367.19 377.29 387.39 397.49 407.59 417.69">非单纯“一朵裂开的玫瑰”。诗可同时利用词面的形象，但基础释义应先保留地质语境。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="427.79 430.315 433.678 439.296"> [S6</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="444.346">、</tspan><tspan font-family="ReaderTimes" font-weight="400" font-si /tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="398.331 408.431 418.531 428.631 438.731 448.831 458.931 469.031 479.131 489.231 499.331 509.431">已标记与格复数；不能因为</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="519.531 522.056 527.106 531.589 534.952"> der </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="537.477">形</tspan></text><text y="282.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9">式常见于与格，就不看它在内部的所属关系。</tspan></text><text y="305.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6 59.25 64.55 69.255 74.555 79.26 85.155 88.685 93.389 96.919 101.624 105.749">04 geächtetes </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="108.399 118.999 129.599 140.199 150.799">与两个新词</tspan></text><text y="322.9" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 51.05 55.533 60.016 64.499 69.549 72.355 76.838 79.644 84.127 88.057">geächtetes </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="90.582 100.682">来自</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="110.782 113.307 117.79 122.273 127.323 130.129 134.612 139.662"> ächten </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="142.187 152.287 162.387 172.487 182.587 192.687 202.787 212.887 222.987
