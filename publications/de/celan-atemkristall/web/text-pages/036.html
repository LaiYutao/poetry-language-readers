885">是</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="84.985 87.51 90.873 95.356 100.406 103.769 108.252 113.302"> fahren </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="115.827 125.927 136.027 146.127 156.227 166.327 176.427 186.527 196.627">的过去时复数。这里</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="206.727 209.252 213.183 215.989 220.472"> sie </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="222.997 233.097 243.197 253.297 257.225 267.325 277.425 281.587">为主格“他们”，</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="291.687 296.737 299.543 304.026 309.076">dich </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="311.601 321.701 331.801 341.901 345.83 355.93 360.091 370.191 380.291 390.391 394.32 404.42 414.52 424.62 434.72 444.82 448.981 459.081 469.181 479.281 483.21 493.31 503.41 513.51 523.61 533.71 537.871">为宾格“你”：不是“你自己行驶”，而是“他们载送你”。</tspan></text><text y="171.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6">德语动词是否及物，要看本句用法，不能只记一个汉语释义。</tspan></text><text y="194.2" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6">02 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85 133.45 144.05">三种介词，三种结构</tspan></text><text y="211.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 48.806 56.662 59.187 64.804 69.287 74.337 77.143 81.626 86.676 91.726 96.209 101.259 108.553 113.036 118.086 122.569 127.619">im Schlangenwagen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="130.144 140.244 150.344 160.444 170.544 180.644 190.744 200.844 210.944 221.044 231.144">为位置／乘坐场景与格；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="241.244 245.727 250.777 253.302 258.352 262.834 266.198">an der </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="268.723">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="278.823 281.348 287.517 292.567 297.617 300.981 305.463 309.394 313.325 317.807 320.332 325.382 330.432 333.796 338.846 343.329 346.135"> Zypresse vorbei </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="348.66 358.76 368.86 378.96 389.06 399.16 409.26 419.36 429.46 439.56 449.66">为从旁经过的与格结构；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="459.76 464.81 469.86 473.223 477.706 482.756 485.281 490.331 493.137 497.62 500.145 505.762 508.568 513.618 516.424">durch die Flut </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="518.949 529.049 539.149">固定用</tspan></text><text y="227" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248">宾格。三者都可以伴随运动，却并不都用宾格。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="258.1 260.625 265.108 270.158"> an </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="272.683">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="282.783 285.308 290.358 295.408 298.771 303.821 308.304 311.11"> vorbei </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="313.635 323.735 333.835 343.935 354.035 364.135 374.235 384.335">整体表从旁而过；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="394.435 398.918 406.774">am </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="409.299">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="419.399 421.924 426.974 429.78 434.83 442.686 450.542 454.473 457.279"> klommst </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="459.804 469.904 480.004 490.104 500.204 510.304 520.404 530.504">则表沿着攀升，英</tspan></text><text y="242.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46">语</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="56.1 58.625 63.675 68.725"> up </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="71.25 81.35 91.45 101.55 111.65 121.75 131.85 141.95">只提示这一语境。</tspan></text><text y="265.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6">03 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85 133.45 144.05 154.65">两个过去时，两个主语</tspan></text><text y="282.6" xml:space="preserve" style="white-space:pre;font-ke
