</g><g class="text-block"><text y="72" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="22" fill="#24383b" x="46 68 90 112 134 156 178 200">怎样使用这份读本</tspan></text><text y="111.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="11.5" fill="#2a7775" x="46 57.5 69 80.5 92 103.5">如何读这一页</tspan></text></g><g class="text-block"><text y="132.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="46 56.7 67.4 78.1 88.8 99.5 110.2 120.9 131.6 142.3 153 163.7 174.4 185.1 195.8 206.5 217.2 227.9 238.6 249.3 260 270.7 281.4 292.1 302.8 313.5 324.2 334.9 345.6 356.3 367 377.7 388.4 399.1 409.8 420.5 431.2 441.9 452.6 463.3 474 484.7 495.4 506.1 516.8 527.5 538.2">先按行号读德语，再沿词下引线看中文。词注取符合语境的基本词义，尽量不代译相邻词；白话译文再疏通</tspan></text><text y="149.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="46 56.7 67.4 78.1 88.8 99.5 110.2 120.9 131.6 142.3 153 163.7 174.4 185.1 195.8 206.5 217.2 227.9 238.6">语义。词注另行紧排，不撑开德语词间距。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="249.3">[</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="252.863 263.563 274.263 284.963">掀……起</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="295.663 299.226">] </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="301.901 312.601 323.301 334.001 344.701 355.401 366.101 376.801 387.501 398.201 408.901 419.601 430.301 441.001 451.701 462.401 473.101 483.801 494.501 505.201 515.901 526.601 537.301">连接句中分开的可分动词；仅因诗行断开的词不据此</tspan></text><text y="166.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="46 56.7 67.4 78.1 88.8 99.5 110.2 120.9 131.6 142.3 153 163.7 174.4 185.1 195.8">标记。方括号、格标记、复数标记</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="206.5 209.175"> ·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="212.738 223.438 234.138 244.838 255.538 266.238 276.938 287.638 298.338 309.038 319.738 330.438 341.138">复、括号英文及复合词分隔符</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="351.838 354.513 356.655"> | </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="359.33 370.03 380.73 391.43 402.13 412.83 423.53 434.23 444.93 455.63 466.33 477.03 487.73 498.43 509.13 519.83 530.53">统一用淡紫色；中文词义仍用青绿色。</tspan></text><text y="183.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="46 56.7 67.4 78.1 88.8 99.5 110.2 120.9 131.6 142.3 153 163.7 174.4 185.1 195.8 206.5 217.2 227.9 238.6 249.3">明确的名词复数（含名词化形式）在词注中标</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="260 262.675"> ·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="266.238 276.938 287.638 298.338 309.038 319.738 330.438 341.138 351.838 362.538 373.238 383.938 394.638 405.338 416.038 426.738 437.438 448.138 458.838 469.538 480.238 490.938 501.638 512.338 523.038 533.738">复；单数不标，未标不保证一定是单数。白话不机械添加复</tspan></text><text y="200.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="46 56.7 67.4 78.1 88.8 99.5 110.2 120.9 131.6 142.3 153 163.7 174.4 185.1 195.8 206.5 217.2 227.9 238.6 249.3 260">数词。底部关系图说明支配、回指和动词框架。</tspan></text><text y="233.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="11.5" fill="#2a7775" x="46 57.5 69 80.5 92 103.5 115 126.5">冠词与物主词的格</tspan></text><text y="254.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="46 56.7 67.4 78.1 88.8 99.5 110.2 120.9 131.6 142.3">逐词层为辨认结构，把</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="153 155.675 161.025 165.774 169.337 172.012 174.985 177.66 183.01 185.983 190.732 193.407 196.38 199.055 204.405 209.154 213.318"> der / die / das </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="215.993 226.693 237.393 248.093 258.793 269.493 273.655 284.355 288.764 299.464 310.164 320.864 331.564 342.264 352.964 363.664 374.364 385.064 395.764 406.464 417.164 427.864 438.564 449.264 453.426 464.126 474.826 485.526 496.226 506.926 517.626 528.326 532.735">等常简注为“这”；顺畅的中文通常不用译出冠词。“主、属、与、宾”依</tspan></text><text y="271.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="46 56.7 67.4 78.1 88.8 99.5 110.2 120.9 131.6 142.3 153 163.7 174.4 185.1 195.8 206.5 217.2 227.9 238.6 249.3 260 270.7 281.4 292.1 302.8 313.5 324.2 334.9 345.6 356.3 367">次指主格、属格、与格、宾格。物主词的格随其所在名词短语确定，如</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="377.7 380.375 384.539 389.288 392.261 397.611 400.286 403.259 408.609 413.959 419.309 423.473 426.446 431.195 435.359 438.034 445.171 448.143 452.893 455.865 458.838"> sein jüngstes Blatt </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="461.513">中</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="472.213 474.888 479.052 483.801 486.774 492.124"> sein </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="494.799 505.499 516.199 526.899 537.599">为主格，不</tspan></text><text y="288.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="46 56.7 67.4 78.1 88.8 99.5 103.662 114.362 125.062 129.471 140.171 150.871 161.571 172.271 182.971 193.671 197.833">能因汉语译“它的”就认作属格。“主</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="208.533">/</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="211.506 222.206 226.614 237.314 248.014 258.714 269.414 280.114 290.814 301.514 312.214 322.914 333.614 344.314 355.014 365.714 376.414 387.114 397.814 408.514 419.214 429.914 440.614 451.314 462.014 472.714 483.414 494.114 504.814 515.514">宾”表示两格同形且此处句法未强判；能由句法确定时仍标单一格。</tspan></text><text y="321.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="11.5" fill="#2a7775" x="46 57.5 69 80.5 92 103.5 115 126.5">跨行拆词怎样处理</tspan></text><text y="342.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="46 56.7 67.4 78.1 88.8 99.5 110.2 120.9 131.6 142.3 153 163.7 174.4 185.1 195.8 206.5 217.2 227.9 238.6 249.3 260 270.7 281.4 292.1 302.8 313.5 324.2 334.9 345.6 356.3 367 377.7 388.4 399.1 409.8 420.5 431.2 441.9 452.6 463.3 474 484.7 495.4 506.1 516.8 527.5 538.2 548.9">德语保留原有断行，节间另留明显空白，行末短横线仍留在原处。中文有时也拆成两段，只为保持视觉对应；</tspan></text><text y="359.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="46 56.7 67.4 78.1 88.8 99.5 110.2 120.9 131.6 142.3 153 163.7 174.4 185.1">真正理解时须合成完整词。例如</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="195.8 198.475 206.202 211.552 216.902 220.465 225.215 228.778 232.341 235.314 239.478 244.227 249.577 252.55 260.873 269.195 273.944 277.508 280.183 286.217 288.892 296.619 301.969 307.319 310.882 315.632 319.195 323.359 328.108 333.458 336.431 344.754 353.076 357.826"> Kupfer-/schimmer = Kupferschimmer</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="361.389 372.089 382.789 393.489 404.189 414.889 425.589 436.289 446.989 457.689 468.389 479.089 489.789 500.489 511.189 521.889 532.589">。复合词的德语原文不添加拆分符号。</tspan></text><text y="376.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="46 56.7 67.4 78.1 88.8 99.5 110.2 120.9 131.6 142.3">常规词按整体释义，如</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="153 155.675 165.189 169.938 175.288 178.261 183.611 188.36 193.109 196.673 202.023 206.772 212.122 220.444"> Maulbeerbaum </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="223.119 233.819 237.982 248.682 259.382 263.79">译“桑树”、</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="274.49 278.654 284.004 288.753 294.103 299.453 304.203 307.175 312.525">Jochbein </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="315.2 325.9 330.063 340.763 351.463 355.871 366.571 377.271 387.971 398.671 409.371 420.071 430.771 441.471 452.171 462.871 473.571 484.271 494.971 505.671 516.371 527.071 537.771">译“颧骨”；只对有助于理解诗性构词的中文注释加</tspan></text><text y="393.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="46 56.7 67.4">半角“</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="71.562">|</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="73.704 78.113 88.813">”，如</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="99.513 102.188 108.724 113.473 118.823 123.572 128.922 133.086 138.436 143.185 146.748 152.098"> Lebensberg </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="154.773 165.473 169.636 180.336">译“生命</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="191.036">|</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="193.178 203.878 208.286 218.986 229.686 240.386 251.086 261.786 272.486 283.186 293.886 304.586 315.286 325.986 336.686">山”。原作已有的连字符仍保留。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="347.386 353.922 358.671 364.021 368.771 374.121 378.285 383.635 388.384 391.947 397.297">Lebensberg </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="399.972 410.672 421.372 432.072 442.772 453.472">中的连接成分</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="464.172 466.847 471.011"> s </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="473.686 484.386 495.086 505.786 516.486 527.186">不单独译义。</tspan></text><text y="426.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="11.5" fill="#2a7775" x="46 57.5 69 80.5 92 103.5 115">诗行不等于句子</tspan></text><text y="447.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="46 56.7 67.4 78.1 88.8 99.5 110.2 120.9 131.6 142.3 153 163.7 174.4 185.1 195.8 206.5 217.2 227.9 238.6 249.3 260 270.7 281.4 292.1 302.8 313.5 324.2 334.9 345.6 356.3 367 377.7 388.4 399.1 409.8 420.5 431.2 441.9 452.6 463.3 474 484.7 495.4 506.1 516.8 527.5 538.2">左侧数字只编号原有诗行。德语按原有诗行断行；中文较长时，注释可横向错开，用引线追踪对应关系。没</tspan></text><text y="464.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="46 56.7 67.4 78.1 88.8 99.5 110.2 120.9 131.6 142.3 153 163.7 174.4 185.1 195.8 206.5 217.2 227.9 238.6 249.3 260 270.7 281.4 292.1 302.8 313.5 324.2 334.9 345.6 356.3 367 377.7 388.4 399.1 409.8 420.5 431.2 441.9 452.6">有限定动词的片段不强补唯一主语；现在分词、过去分词、名词化与变位动词分别说明。</tspan></text><text y="497.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="11.5" fill="#2a7775" x="46 57.5 69 80.5 92 103.5 115 126.5">译文的顺序与提示</tspan></text><text y="518.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="46 56.7 67.4 78.1 88.8 99.5 110.2 120.9 131.6 142.3 153 163.7 174.4 185.1 195.8 206.5 217.2 227.9 238.6 249.3 260 270.7 281.4 292.1 302.8 313.5 324.2 334.9 345.6 356.3 367 377.7 388.4 399.1 409.8 420.5 431.2 441.9 452.6 463.3 474 484.7 495.4 506.1 516.8 527.5 538.2 548.9">白话译文按自然中文疏通语序与可分动词，保持修饰关系和语气。短的后置关系从句可前置合并为中文定语；</tspan></text><text y="535.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="46 56.7 67.4 78.1 88.8 99.5 110.2 120.9 131.6 142.3 153 163.7 174.4 185.1 195.8 206.5 217.2 227.9 238.6 249.3 260 270.7 281.4 292.1 302.8 313.5 317.662 328.362 339.062 349.762 360.462 371.162 375.571 386.271 396.971 407.671 418.371 429.071 439.771 450.471 461.171 471.871 482.571 493.271 503.971 514.671 525.371 536.071">较长从句及有表达作用的插入语可保留展开次序。灰紫色“（指……）”是编者补充的回指提示，并非原诗文</tspan></text><text y="552.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="46 56.7 67.4 78.1 88.8 99.5 110.2 120.9 131.6 142.3 153 163.7 174.4 185.1 195.8 206.5 217.2 227.9 238.6 249.3 260 270.7 281.4 292.1 302.8 313.5 324.2 334.9 345.6 356.3 367 377.7 388.4 399.1 409.8 420.5 431.2 441.9 452.6 463.3 474 484.7 495.4 506.1 516.8 527.5 538.2">字；原文本身开放的关系不强行指定。省略尽量保留，译义选择不冒充唯一解释。括号英文仅提示结构，如</tspan></text><text y="569.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="46 48.675 53.424 58.774"> an </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="61.449">的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="72.149 74.824 77.797"> to</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="83.147">、</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="93.847 99.197 107.52">um </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.7" fill="#24383b" x="110.195">的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.7" fill="#24383b" x="120.895 123.57 128.319 131.882 134.855 139.604"> after</tspan><tspan font-family="ReaderSongLight" font-w
