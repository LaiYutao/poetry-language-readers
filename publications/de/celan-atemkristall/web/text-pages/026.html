an></text><text y="194.2" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6">02 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85 133.45">形容词也能支配格</tspan></text><text y="211.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 48.806 53.289 61.145 65.628 70.678 75.728 80.211 88.067 90.592 95.642 100.125 105.175 110.225 113.588 117.519 122.002">jemandem gehorsam</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="129.858">：</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="139.958 145.008 149.49 154.54 159.59 162.954 166.884 171.367 179.223">gehorsam </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="181.748 191.848 201.948 212.048 222.148 232.248 242.348">要求与格，所以</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="252.448 254.973 260.023 264.506 269.556 272.081 276.012 281.062 285.545 288.351 292.834 297.884 300.409 302.934 307.984 312.466 317.516 320.041 325.091 329.574 332.938 335.744 340.227 345.277 347.802 355.096 360.146 365.196 369.678 377.534 382.584 387.067 390.431 394.361 397.167 401.65 405.014 410.064 414.546 419.596"> den späten, den harten Novembersternen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="422.121 432.221 442.321 452.421 462.521 472.621 482.721 492.821 502.921">是与格复数。这里的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="513.021 515.546 520.596 525.079 530.129"> den </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="532.654">不</tspan></text><text y="227" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9">是宾格阳性单数，因为中心词为复数且有与格</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="248 250.525 253.888"> -n</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="258.938">。</tspan></text><text y="249.8" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6">03 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85 133.45">结果方向与格同形</tspan></text><text y="267.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 48.806 53.856 56.381 61.431 65.914 70.964 73.489 80.783 85.266 88.629 93.112 96.475 100.958 106.008 110.491 115.541">in den Herzfaden </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="118.066 128.166 138.266 148.366 158.466 168.566 178.666 188.766 198.866 208.966">是系入的目标，中心词</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="219.066 221.591 227.208 231.691 236.741 241.224 246.274"> Faden </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="248.799 258.899 268.999 279.099">为阳性，</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="289.199 294.249 298.732 303.782">den </tspan><tspan font-family="Reader
