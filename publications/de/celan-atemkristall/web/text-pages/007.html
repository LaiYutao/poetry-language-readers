</g><g class="text-block"><text y="47" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.5" fill="#2a7775" x="506.776 515.276 523.776 532.276 540.776">句法与校对</tspan></text><text y="48" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="11" fill="#2a7775" x="46 53.944 60.663 67.382 77.163 85.107 92.444 96.107 102.225 108.944 116.888 123.607 130.326 133.076 136.132 138.882 144.382">ATEMKRISTALL / 02</tspan></text><text y="80" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="19" fill="#24383b" x="46 59.721 69.221 78.721 83.471 97.192 106.692 116.192 124.625 129.904 136.231 144.665 154.165 168.943 174.222 182.655 197.434 202.184 211.684 220.117 228.55 233.829 242.262">Von Ungeträumtem geätzt</tspan></text></g><g class="text-block"><text y="115.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#2a7775" x="56 66.5 77 87.5">重点句法</tspan></text><text y="138.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6">01 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="59.25 69.85 80.45 91.05 101.65">主句与分词</tspan></text><text y="156.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 51.05 55.533 59.463">das </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="61.988">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="72.088 74.613 81.35 84.713 89.763 92.569 95.376 99.858 104.908 109.958"> Brotland </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="112.483 122.583 132.683 142.783 152.883 162.983">是主格主语，</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="173.083 180.377 183.183 186.547 189.91 192.716">wirft </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="195.241">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="205.341 207.866 212.349 217.399 220.763"> auf </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="223.288 233.388 243.488 253.588 263.688">是可分动词</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="273.788 276.313 280.795 285.845 289.209 296.503 300.986 304.349 307.712 312.195"> aufwerfen</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="317.245">，</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="327.345 332.395 336.878 341.928 344.453 350.623 355.105 360.155 364.638 369.688 373.619 378.669 383.152 386.515 391.565">den Lebensberg </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="394.09 404.19 414.29 424.39 434.49 444.59">是宾格。开头</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="454.69 457.215 462.265 466.748 471.231 474.037 478.52 481.326"> geätzt </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="483.851 493.951 504.051 514.151 524.251 534.351">是第二分词，</tspan></text><text y="171.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9">修饰主语所处的状态；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="147 152.05 157.1 162.15 164.675 171.969 177.019 182.069 186.552 189.358 192.721 197.204 202.254 210.11 212.916 217.399 225.255">von Ungeträumtem </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="227.78 237.88 247.98 258.08 268.18 278.28 288.38">中，名词化分词</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="298.48 301.005 308.299 313.349 318.399 322.882 325.688 329.052 333.534 338.584 346.44 349.247 353.729 361.586"> Ungeträumtem </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="364.111 374.211 384.311 394.411 404.511 414.611 424.711 434.811 444.911 455.011 465.111 475.211 485.311">是中性单数与格，采用强变化</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="495.411 497.936 501.299 505.782"> -em</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="513.638">。</tspan></text><text y="194.2" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6">02 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85 133.45 144.05">名字是被摸索的对象</tspan></text><text y="211.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 51.05 56.1 60.583 63.389 67.872 71.802 74.608">knetest </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="77.133 87.233 97.333 107.433">的主语是</tspan><tspan font-family="Reade
