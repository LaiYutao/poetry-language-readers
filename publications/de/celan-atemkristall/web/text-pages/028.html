</g><g class="text-block"><text y="47" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.5" fill="#2a7775" x="506.776 515.276 523.776 532.276 540.776">句法与校对</tspan></text><text y="48" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="11" fill="#2a7775" x="46 53.944 60.663 67.382 77.163 85.107 92.444 96.107 102.225 108.944 116.888 123.607 130.326 133.076 136.132 138.882 144.382">ATEMKRISTALL / 13</tspan></text><text y="80" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="19" fill="#24383b" x="46 56.567 61.846 70.279 79.779 88.212 97.712 102.462 107.212 112.491 127.27 132.02 142.586 151.02 160.52 168.953 174.231 179.51 187.943">Stehen, im Schatten</tspan></text></g><g class="text-block"><text y="115.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#2a7775" x="56 66.5 77 87.5">重点句法</tspan></text><text y="138.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6 59.25 65.145 68.675 73.38 79.275 83.98 89.875">01 Stehen </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="92.525 103.125 113.725 124.325 134.925 145.525 156.125 160.407 171.007 181.607 192.207">不是变位后的“我站着”</tspan></text><text y="156.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 51.617 54.423 58.906 63.956 68.439 73.489">Stehen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="76.014 86.114 96.214 106.314 116.414 126.514 136.614 146.714 156.814 166.914 177.014 187.114 197.214 207.314 217.414 227.514 237.614 247.714 257.814 267.914 278.014 288.114 298.214 308.314 318.414 328.514 338.614 348.714 358.814 368.914 379.014 389.114 399.214 409.314 419.414 429.514 439.614 449.714 459.814 469.914 480.014 490.114 500.214 510.314 520.414 530.514">在此为不定式形式，可作独立的不定式／名词性片段阅读；句首大写本身不足以证明一定已经名词化。第</tspan></text><text y="171.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2">二节的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="76.3 78.825 84.442 89.492 92.856 96.219 101.269 104.075 108.558 116.414 120.897 125.947 130.997 134.36 139.41 144.46 149.51 152.874 157.924 160.73 165.213 170.263 173.069 176.999 180.363 185.98 188.786 193.269 198.319 202.802 207.852"> Für-niemand-und-nichts-Stehen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="210.377 220.477 230.577 240.677 250.777 260.877 270.977 281.077 291.177 301.277 311.377 321.477 331.577 341.677 351.777 361.877">则把整组表达连成一个名词性单位。</tspan></text><text y="194.2" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6">02 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="59.25 69.85 80.45 91.05 101.65 112.25">三层名词关系</tspan></text><text y="211.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 48.806 56.662 59.187 64.804 69.287 74.337 78.82 81.626 84.432 88.915 93.965 96.49 99.854 104.904 109.386 113.317 115.842 125.375 130.425 135.475 140.525 145.008 150.058 157.914 162.397 165.203 169.133 172.497 175.022 178.385 181.191 186.241 188.766 193.816 198.299 201.662 204.187 210.357 215.407 218.77 221.576">im Schatten [des Wundenmals] [in der Luft]</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="224.94">：</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="235.04 237.846 245.702">im </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="248.227">使</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="258.327 260.852 266.469 270.952 276.002 280.485 283.291 286.097 290.58 295.63"> Schatten </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="298.155 308.255 318.355 328.455">用与格；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="338.555 343.605 348.088 352.018 354.543 364.076 369.126 374.176 379.226 383.709 388.759 396.615 401.098 403.904 407.834">des Wundenmals </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="410.359 420.459 430.559 440.659">是属格；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="450.759 453.566 458.616 461.141 466.191 470.673 474.037 476.562 482.731 487.781 491.145 493.951">in der Luft </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="496.476 506.576 516.676 526.776 536.876 546.976">为位置与格。</tspan></text><text y="227" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 48.806 53.856 56.381 61.431 65.914 69.277 71.802 77.972 83.022 86.385 89.191">in der Luft </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="91.716 101.816 105.745 115.845 125.945 130.106 140.206 150.306 160.406 170.506 180.606 190.706 200.806 210.906 221.006 231.106 241.206 251.306 261.406 271.506 281.606 291.706 301.806 311.906 322.006 332.106 342.206 352.306 362.406 372.506 382.606 392.706 402.806 412.906 423.006 433.106 443.206">与“伤痕”的自然联系来自结构与语义共同判断，不能把所有相邻名词都改成属格。</tspan></text><text y="249.8" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="46 51.3 56.6 59.25 62.78 68.675 73.38">03 für </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="76.03">与</tspan><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#24383b" x="86.63 89.28 94.58 100.475 106.37 111.075"> ohne </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#24383b" x="113.725 124.325 134.925 145.525 156.125">都支配宾格</tspan></text><text y="267.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="46 49.363 54.413 57.777 60.302 65.352 68.158 72.641 77.691">für dich </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="80.216">的</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="90.316 92.841 97.891 100.697 105.18 110.23"> dich </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="112.755 122.855 132.955 143.055">为宾格；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#24383b" x="153.155 158.205 163.255 168.305 172.788 175.313 180.93 185.98 189.343 193.826 198.309 203.359 207.842">ohne Sprache </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="210.367">中</tspan><tspan fo
