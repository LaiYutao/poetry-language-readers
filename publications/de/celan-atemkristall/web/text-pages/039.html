t="300" font-size="7.6" fill="#2a7775" x="77.813 85.413">诞生</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#8b7d99" x="93.013">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#8b7d99" x="95.544">复</tspan></text><text y="631.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#2a7775" x="56 66.5 77 87.5">白话译文</tspan></text><text y="654.35" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4">词的堆积，火山般，被海声漫过。</tspan></text><text y="677.65" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3">上方，涌动的反向造物群氓：它</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#7b7087" x="187.4 197.5 207.6 211.529 221.629 231.729 235.89 245.99 256.09 266.19 276.29">（指“群氓”这一整体）</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="286.39 296.49 306.59 316.69 326.79 336.89 346.99 357.09 367.19 377.29 387.39 397.49 407.59 417.69 427.79 437.89 447.99 458.09 468.19 478.29 488.39 498.49 508.59 518.69 528.79">曾挂起旗帜——摹像与后像徒然交错航行，沿时间而去。</tspan></text><text y="700.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1">直到你把词之月抛出，从它</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#7b7087" x="167.2 177.3 187.4 191.329 201.429 211.529 221.629 225.79">（指“词之月”）</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="235.89 245.99 256.09 266.19 276.29 286.39 296.49 306.59 316.69 326.79 336.89 346.99 357.09 367.19 377.29 387.39 397.49 407.59 417.69 427.79 437.89 447.99 458.09 468.19 478.29 488.39 498.49 508.59 518.69 528.79 538.89">那里，退潮这一奇迹发生，而心形的火山口赤裸着为那些开端作证——</tspan></text><text y="716.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#24383b" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8">即那些王者的诞生。</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 67.773 71.773 74.438 76.66 80.211 84.211 86.875 89.988 93.539 97.539 101.539 103.762 105.984 109.984 113.984">19 / Wortaufschüttung</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#2a7775" x="540.276 544.776">39</tspan></text></g></svg><button class="hotspot" data-action="play" data-poem="19" style="left:67.02778%;top:4.03853%;width:7.89550%;height:2.13805%" aria-label="播放或暂停第19首" title="播放或暂停第19首"></button><button class="hotspot" data-action="stop" data-poem="19" style="left:75.76323%;top:4.03853%;width:7.22354%;height:2.13805%" aria-label="停止第19首" title="停止第19首"></button><a class="hotspot" href="https://www.youtube.com/watch?v=nB7XF5Nli1g" target="_blank" rel="noopener noreferrer" style="left:83.99471%;top:4.03853%;width:8.23148%;height:2.13805%" aria-label="查看原录音与朗读者" title="查看原录音与朗读者"></a>
