332 240.703 244.732 249.441 254.812 260.862 266.912 270.273">Entlang an Gärten, herbstlich, rotversengt:</tspan></text><text y="206.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 80.1 85.471 89.5 92.525 97.896 103.266 106.628 112.678 116.04 119.065 122.426 131.838 134.863 141.593 144.954 148.316 151.678 155.04 160.41 166.46 169.485 174.194 177.556 182.926 188.976 192.001 197.372 200.734 206.784 209.809 213.17 219.22 224.591 230.641 234.003 237.365 243.415 246.44 253.831 259.201 265.251 270.622 276.672">Hier zeigt im Stillen sich ein tüchtig Leben.</tspan></text><text y="235.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.109 86.818 89.843 100.601 105.972 112.022 116.731 122.101 128.151 133.522 139.572 142.597 151.335 156.706 162.756 168.806 174.176 177.201 180.563 184.592 189.963 196.013 201.384 207.434 210.459 216.509 220.538 225.909 231.959 238.009 243.379 246.404 254.475 259.845 265.895 271.266 277.316">Des Menschen Hände tragen braune Reben,</tspan></text><text y="264.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 72.029 78.079 84.129 89.5 94.209 97.234 103.284 108.654 112.684 115.709 120.418 125.788 131.838 135.867 139.229 144.6 147.625 154.354 159.725 165.775 175.187 180.557 184.587 189.957 192.982 196.344 205.756 208.781 216.851 220.213 223.575 228.945 234.995 238.02 242.729 246.091 251.462 257.512 260.536 265.245 270.616 276.666 282.716 286.078">Indes der sanfte Schmerz im Blick sich senkt.</tspan></text><text y="314.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 86.15 89.175 97.913 103.963 109.334 115.384 121.434 124.796 127.821 134.55 139.921 145.971 150 153.362 156.724 160.085 165.456 168.481 174.531 179.901 185.951 192.001 195.026 201.076 207.126 211.156 216.526 222.576 225.601 230.31 235.681 241.731 250.469 255.839 259.869 265.239 270.61 275.319 278.344 285.735 291.106 297.156">Am Abend: Schritte gehn durch schwarzes Land</tspan></text><text y="343.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 75.391 79.421 84.129 89.5 95.55 100.921 104.282 110.332 115.703 121.753 127.803 133.173 137.203 140.228 143.59 149.64 152.665 156.694 162.744 166.106 171.476 175.506 178.531 186.601 192.651 198.022 204.072 209.442 215.492 218.517 225.247 230.617 236.667 245.406 250.776 254.138 260.188 265.559 271.609">Erscheinender in roter Buchen Schweigen.</tspan></text><text y="372.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 75.391 78.753 84.803 87.828 93.878 97.24 102.61 108.66 114.031 118.74 121.765 129.156 132.518 137.888 141.917 144.942 153.681 157.042 160.404 163.766 166.791 171.5 174.862 180.232 186.282 189.307 195.357 201.407 205.437 214.848 217.873 225.265 231.315 237.365 240.39 246.44 251.81 255.84 261.89 267.26 270.622 276.672 282.042">Ein blaues Tier will sich vorm Tod verneigen</tspan></text><text y="401.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 88.838 91.863 97.913 101.943 107.313 113.363 118.734 124.784 130.834 136.884 140.246 143.607 146.632 152.682 158.053 162.082 166.112 171.482 174.844 178.206 181.568 184.593 189.963 193.325 199.375 20 ce:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">安宁之物在酒馆前嬉戏，一张脸沉醉地陷进草中。接骨木果，轻柔而醉的笛声，木犀草的香气环绕着女性之物。</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 66 70.887 76.223 83.773 89.551 95.328 101.105 105.992 111.77 117.547">11 / VERWANDLUNG</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#355570" x="540.276 544.776">23</tspan></text></g></svg><button class="hotspot" data-action="play" data-poem="11" style="left:67.02778%;top:4.03853%;width:7.89550%;height:2.13805%" aria-label="播放或暂停第11首" title="播放或暂停第11首"></button><button class="hotspot" data-action="stop" data-poem="11" style="left:75.76323%;top:4.03853%;width:7.22354%;height:2.13805%" aria-label="停止第11首" title="停止第11首"></button><a class="hotspot" href="https://librivox.org/gedichte-by-georg-trakl/" target="_blank" rel="noopener noreferrer" style="left:83.99471%;top:4.03853%;width:8.23148%;height:2.13805%" aria-label="查看原录音与朗读者" title="查看原录音与朗读者"></a>
