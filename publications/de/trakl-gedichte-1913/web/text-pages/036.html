</g><g class="text-block"><text y="47" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.5" fill="#355570" x="532.276 540.776">续页</tspan></text><text y="48" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10" fill="#355570" x="46 53.222 59.33 66.552 73.222 80.443 82.943 89.052 95.722 102.943 110.165 116.273 118.773 121.552 124.052 129.052">GEORG TRAKL / 17</tspan></text><text y="84" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="19" fill="#283541" x="46 59.721 71.327 84 94.567 108.288 119.894">VERFALL</tspan></text></g><g class="text-block"><text y="115.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#355570" x="56 66.5 77 87.5">白话译文</tspan></text><text y="138.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">傍晚，当钟声鸣响和平，我追随鸟群奇妙的飞行，它们排成悠长的队列，如虔敬的朝圣队伍，消失在秋日清澈的</tspan></text><text y="153.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2">远方。</tspan></text><text y="176.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">漫步穿过暮色弥漫的花园，我梦想追随它们更明亮的命运，几乎感觉不到时针继续移动。于是，我跟着它们越过</tspan></text><text y="192" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5">云层的旅程。</tspan></text><text y="215.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450">这时，一缕衰败的气息使我战栗。黑鹂在落尽叶子的枝条里哀叫。红葡萄藤在锈栅栏上摇晃，</tspan></text><text y="238.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3">而蓝色紫菀在风中瑟缩着低垂，围着风化的暗井沿，像苍白孩子的死亡轮舞。</tspan></text><text y="262.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#355570" x="56 66.5 77 87.5">句法关系</tspan></text><text y="283.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#355570" x="107.481 114.981 122.481 129.981">属格修饰</tspan></text><text y="290.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#283541" x="56 61.172 65.3 69.428 71.753 78.469 83.119 87.769 91.897 94.481 149.481 155.161 157.745 162.917 167.567 171.695">der Vögel Flügen</tspan></text><text y="307.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 80.9">鸟的飞行</tspan></text><text y="328.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#355570" x="119.891 127.391 134.891 142.391">从句主语</tspan></text><text y="335.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#283541" x="56 61.172 63.756 68.406 73.578 77.706 80.031 86.747 90.366 93.463 97.591 101.719 106.891 161.891 165.51 168.094 172.222 177.394">blaue Astern sich </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="9.3" fill="#283541" x="179.719">…</tspan><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#283541" x="189.019 191.344 196.516 200.644 203.228 207.878 212.006"> neigen</tspan></text><text y="352.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 80.9">紫菀低垂</tspan></text><text y="375.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#355570" x="56 66.5 77 87.5">重点句法</tspan></text><text y="398.4" xml:space="preser
