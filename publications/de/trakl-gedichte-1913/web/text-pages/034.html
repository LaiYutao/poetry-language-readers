</g><g class="text-block"><text y="47" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.5" fill="#355570" x="532.276 540.776">续页</tspan></text><text y="48" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10" fill="#355570" x="46 53.222 59.33 66.552 73.222 80.443 82.943 89.052 95.722 102.943 110.165 116.273 118.773 121.552 124.052 129.052">GEORG TRAKL / 16</tspan></text><text y="84" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="19" fill="#283541" x="46 52.327 66.048 70.798 84.52 96.125 109.847 114.597 128.318 142.039 154.712 168.433 185.327 191.654 203.26 214.866 228.587 242.309 247.059 260.78 272.386 282.953 294.559 308.28 318.847 330.453 342.059 354.731">IN DEN NACHMITTAG GEFLÜSTERT</tspan></text></g><g class="text-block"><text y="115.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#355570" x="56 66.5 77 87.5">白话译文</tspan></text><text y="138.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450">太阳，秋日般稀薄而怯弱；果实从树上落下，寂静住在蓝色的空间里，整整一个漫长的下午。</tspan></text><text y="161.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4">金属发出的死亡之声；一只白兽倒下。棕肤少女的粗哑歌声，已在落叶中吹散。</tspan></text><text y="184.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6">额头梦见上帝的色彩，感到疯狂温柔的翅膀。影子在山丘上转动，被腐烂镶上黑边。</tspan></text><text y="208" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2">暮色充满宁静与酒；悲伤的吉他流淌。你像在梦里，回到屋内温和的灯旁。</tspan></text><text y="231.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#355570" x="56 66.5 77 87.5">句法关系</tspan></text><text y="252.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#355570" x="133.581 141.081">宾语</tspan></text><text y="259.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#283541" x="56 63.234 67.884 70.981 74.078 78.206 81.825 84.15 89.831 94.481 98.608 103.781 107.908 113.081 168.081 171.178 175.305 179.955 185.128 192.875">Gottes Farben träumt</tspan></text><text y="276.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 80.9 89.2 97.5 105.8">额头梦见的色彩</tspan></text><text y="297.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#355570" x="142.106 149.606 157.106 164.606">属格修饰</tspan></text><text y="304.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#283541" x="56 62.203 66.331 70.981 76.153 81.325 85.453 89.581 91.906 100.684 105.334 110.506 114.634 119.806 123.934 129.106 184.106 190.309 192.893 197.02 202.193 206.32">Brauner Mädchen Lieder</tspan></text><text y="321.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 80.9 89.2 97.5">棕肤少女的歌</tspan></text><text y="344.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#355570" x="56 66.5 77 87.5">重点句法</tspan></text><text y="367.8" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#283541" x="46 51.3 56.6">01 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#283541" x="59.25 69.85 80.45 91.05">时间宾格</tspan></text><text y="385.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="46 52.169 54.976 60.026 64.508 69.558 72.083 74.89 79.372 84.422 89.472 93.955 99.005 101.53 108.824 113.307 117.79 122.84 130.696 133.502 136.308 139.114 143.597 148.647">Einen langen Nachmittag </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="151.172 161.272 171.372 181.472 191.572 201.672 211.772 221.872 231.972 242.072 252.172 262.272 272.372 282.472 292.572 302.672 312.772 322.872 332.972 343.072 353.172 363.272 373.372 383.472 393.572 403.672 407.601 417.701 421.862 431.962 442.062 452.162 462.262 472.362">是时间延续的宾格，接前面的居住与寂静场景，不能当作“住”的直接对象。</tspan></text><text y="409.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#283541" x="46 51.3 56.6">02 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#283541" x="59.25 69.85 80.45 91.05 101.65 112.25 122.85 133.45 144.05 154.65">倒置属格与无冠词主语</tspan></text><text y="426.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="46 52.737 56.1 60.583 65.633 70.683 75.166 78.529 81.054 90.035 94.517 99.567 104.05 109.1 113.583 118.633">Brauner Mädchen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="121.158 131.258 141.358 151.458 161.558 171.658 181.758">为复数属格修饰</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="191.858 194.383 200.553 203.359 207.842 212.892 217.375"> Lieder</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="220.738">；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="230.838 236.455 239.261 242.067 245.431 250.481 254.963">Stirne </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="257.488 267.588 277.688 287.788 297.888 307.988 318.088 328.188 338.288">是无冠词单数主语，</tspan><tspan font-family="ReaderTim
