ext y="191.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 88.159 92.188 95.213 101.263 106.634 112.684 115.709 124.447 129.817 133.179 139.229 144.6 150.65 153.675 165.095 170.466 173.828 179.878 185.248">Über den weißen Weiher</tspan></text><text y="220.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 74.729 78.091 84.141 90.191 93.216 99.266 102.628 107.999 111.023 119.762 123.124 126.485 132.535 137.906 143.956 146.981 155.719 161.769 167.819 173.19 176.551 179.576 183.606 189.656 193.685 197.047 203.097 208.468 213.838 219.888 225.938 231.309 237.359">Sind die wilden Vögel fortgezogen.</tspan></text><text y="249.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 86.15 89.175 97.913 103.963 109.334 115.384 121.434 124.459 133.197 138.568 144.618 147.979 151.004 157.054 163.104 169.154 172.179 178.229 184.279 188.988 194.359 198.388 203.759 209.809 212.834 219.563 222.925 228.295 232.325 238.375 243.745 249.795 252.82 258.191 261.553 267.603 270.628 275.998 279.36 284.069 287.431 293.481 298.851 302.881 305.906 317.326 320.688 326.738 332.788">Am Abend weht von unseren Sternen ein eisiger Wind.</tspan></text><text y="299.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 88.159 92.188 95.213 101.263 107.313 112.022 117.393 121.422 126.793 129.817 138.556 142.585 147.956 154.006 159.376">Über unsere Gräber</tspan></text><text y="328.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-
