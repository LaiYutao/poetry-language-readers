.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 88.838 91.863 95.225 101.275 104.637 107.999 111.36 116.731 122.781 128.151 134.201 137.226 148.647 154.018 158.047 162.076 167.447 173.497 176.522 179.547 185.597 188.959 194.329 197.354 203.404 209.454 212.816 218.866 224.916 230.287 236.337 239.362 246.753 252.803 258.173 264.223 269.594">Von tötlichen Waffen, die goldnen Ebenen</tspan></text><text y="235.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 88.838 91.863 97.913 101.275 106.646 112.696 118.066 124.116 127.141 133.871 139.241 144.612 150.662 153.687 156.712 162.762 168.132 172.162 178.212 184.262 189.632 193.662 196.687 202.737 206.098 211.469 214.494 221.223 227.273 233.323 239.373">Und blauen Seen, darüber die Sonne</tspan></text><text y="264.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 87.497 90.859 96.229 100.259 103.284 109.334 112.696 118.746 122.775 128.825 132.187 135.548 138.91 142.272 145.297 151.347 160.759 164.788 170.159 176.209 182.259 185.62 188.645 194.696 198.057 203.428 206.453 215.191 220.562 225.932 231.982">Düster hinrollt; umfängt die Nacht</tspan></text><text y="293.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 74.729 78.091 83.462 87.491 93.541 98.912 104.962 111.012 116.382 119.407 128.146 132.175 135.537 140.907 146.957 152.328 156.357 159.382 162.407 168.457 171.819 177.19 180.214 188.953 192.314 195.676 201.726 207.097 210.122 218.86 222.222 227.592 233.642">Sterbende Krieger, die wilde Klage</tspan></text><text y="322.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 72.029 78.079 82.109 87.479 91.509 94.534 99.904 105.275 109.304 115.354 119.384 125.434 130.804 136.854 142.225 148.275 153.645 159.695 162.72 173.479 179.529 185.579 191.629 197 201.029">Ihrer zerbrochenen Münder.</tspan></text><text y="351.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 88.159 94.209 97.234 101.943 105.304 108.666 112.028 115.39 120.76 123.785 128.494 133.865 143.276 152.688 158.059 161.421 164.782 167.807 171.169 180.581 183.606 195.026 200.397 203.759 209.809 215.179 221.229 227.279 231.309 237.359 243.409">Doch stille sammelt im Weidengrund</tspan></text><text y="380.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.071 82.121 85.482 90.853 95.562 98.587 107.325 112.696 121.434 127.484 130.846 136.896 139.921 142.946 148.996 154.366 158.396 161.757 167.807 170.832 176.203 179.565 185.615 188.64 194.01 200.06 204.09 210.14 215.51 221.56 227.61 232.981 237.01 240.035 248.773 254.823 258.185 261.547 264.572 273.31 279.36 285.41 291.46 294.822">Rotes Gewölk, darin ein zürnender Gott wohnt,</tspan></text><text y="409.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.109 86.818 89.843 95.893 101.263 105.293 111.343 117.393 122.101 126.81 132.86 138.231 141.256 149.326 152.688 158.738 162.1 165.125 169.834 173.196 178.566 184.616 187.641 190.666 200.078 206.128 212.178 218.228 224.278 229.648 232.673 241.412 247.462 253.512 256.873 262.244">Das vergossne Blut sich, mondne Kühle;</tspan></text><text y="438.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 80.1 83.462 88.832 91.857 98.587 101.949 105.978 111.348 117.398 122.769 128.819 131.844 141.256 147.306 153.356 159.406 164.776 170.826 173.851 177.213 183.263 186.288 190.997 196.367 202.417 211.156 216.526 220.556 225.926 231.297 234.322 243.06 248.431 252.46 261.198 266.569 271.278 277.328 283.378 289.428">Alle Straßen münden in schwarze Verwesung.</tspan></text><text y="467.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 86.15 91.521 95.55 98.575 104.625 110.675 114.037 120.087 126.137 131.507 140.919 143.944 152.682 158.053 163.423 172.162 177.532 180.894 186.944 189.969 196.019 201.389 205.419 208.444 217.182 222.553 227.923 233.973 237.335 240.36 246.41 252.46 258.51 261.535 268.264 271.626 276.997 281.026 287.076 292.447">Unter goldnem Gezweig der Nacht und Sternen</tspan></text><text y="496.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 75.391 80.1 83.125 87.834 93.204 99.254 107.993 113.363 119.413 125.463 128.825 131.85 137.9 143.271 147.3 150.325 157.054 162.425 168.475 177.213 182.584 187.293 190.654 196.025 200.054 203.079 209.809 215.179 221.229 226.6 229.962 233.323 238.694 244.744 247.769 253.819 259.869 263.898 269.269 275.319 278.344 284.394 289.764 295.814 298.839 303.548 308.919 314.969 323.707 329.078 332.439 338.489 343.86 349.91 355.96 361.33 367.38 370.406 379.144 384.514 387.876 393.926">Es schwankt der Schwester Schatten durch den schweigenden Hain,</tspan></text><text y="525.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 75.391 81.441 84.466 90.516 94.546 100.596 106.646 112.016 118.066 121.091 127.141 130.503 135.873 138.898 147.637 153.007 156.369 161.078 164.44 169.81 173.84 176.865 182.915 188.285 192.315 195.339 204.078 209.448 212.81 218.86 224.231 230.281 233.306 236.331 242.381 245.742 251.113 254.138 260.188 263.55 269.6 272.961 278.332 284.382 290.432 295.803 301.853 304.878 313.616 318.986 325.036 331.086 334.448 339.819 343.848">Zu grüßen die Geister der Helden, die blutenden Häupter;</tspan></text><text y="554.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 88.838 91.863 95.225 100.596 103.957 108.666 114.037 117.062 120.423 126.473 132.523 137.894 143.944 146.969 150.331 159.743 162.768 170.838 176.888 182.938 186.968 189.993 196.043 199.404 204.775 207.8 213.85 219.9 225.95 232 237.37 240.732 246.782 249.807 256.537 259.898 265.948 269.31 274.681 280.731 283.756 289.806 295.176 299.885 302.91 311.648 317.019 321.048 327.098 331.807 335.169 340.54 345.248">Und leise tönen im Rohr die dunkeln Flöten des Herbstes.</tspan></text><text y="583.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 79.763 84.472 87.834 93.884 97.246 102.616 107.987 112.016 117.387 120.412 127.803 131.832 137.203 143.253 148.623 152.653 156.682 159.707 163.069 169.119 173.148 176.173 181.544 187.594 192.964 196.994 203.044 208.414 214.464 217.489 226.228 229.589 232.951 238.322 242.351 247.722">O stolzere Trauer! ihr ehernen Altäre,</tspan></text><text y="612.25" xml:space="preserve" style="whi weight="300" font-size="7.6" fill="#89798d" x="169.534 177.134">属 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="189.569 197.169 204.769 222.835 230.435 238.035 251.392 258.992 266.592 273.645">精神 滋养 今天 一</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="281.245">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#89798d" x="283.775 291.375">主 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="307.058 314.659 322.258 329.858 362.094 369.694">巨大的 痛苦</tspan></text><text y="643.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="7" fill="#6f7c7b" x="48 51.5">17</tspan></text><text y="656.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="68 75.6">这些</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="83.2">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#89798d" x="85.731 93.331">主 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="101.656 109.256 116.856 124.456 132.056 151.4 159">未出生的 子孙</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="166.6">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#89798d" x="169.131">复</tspan></text><text y="686.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#355570" x="56 66.5 77 87.5">白话译文</tspan></text><text y="709.35" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">傍晚，秋天的森林因致命武器而鸣响，金色的平原与蓝色的湖泊也鸣响，太阳在它们上方阴暗地滚过；夜拥住垂</tspan></text><text y="724.65" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">死的战士，拥住他们破碎嘴唇的狂野哀诉。然而在柳树洼地里，红云静静聚集，其中住着一位愤怒的神——那洒</tspan></text><text y="739.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8 540.9">出的血，月亮的清凉；所有道路汇入黑色的腐烂。夜的金色枝丫与星辰之下，姐妹的影子摇晃着穿过沉默的树林，</tspan></text><text y="755.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">去向英雄的灵魂、向流血的头颅致意；芦苇中，秋日的暗笛轻轻鸣响。啊，更骄傲的悲哀！你们这些青铜祭坛，</tspan></text><text y="770.55" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8">巨大的痛苦如今滋养着精神炽热的火焰——那些尚未出生的子孙。</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 66 71.336 77.113 82.891 87.777">23 / GRODEK</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#355570" x="540.276 544.776">47</tspan></text></g></svg><button class="hotspot" data-action="play" data-poem="23" style="left:67.02778%;top:4.03853%;width:7.89550%;height:2.13805%" aria-label="播放或暂停第23首" title="播放或暂停第23首"></button><button class="hotspot" data-action="stop" data-poem="23" style="left:75.76323%;top:4.03853%;width:7.22354%;height:2.13805%" aria-label="停止第23首" title="停止第23首"></button><a class="hotspot" href="https://www.youtube.com/watch?v=Zd9Wj8oejzE" target="_blank" rel="noopener noreferrer" style="left:83.99471%;top:4.03853%;width:8.23148%;height:2.13805%" aria-label="查看原录音与朗读者" title="查看原录音与朗读者"></a>
