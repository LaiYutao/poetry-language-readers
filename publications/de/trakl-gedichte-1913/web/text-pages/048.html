3.549 343.649 353.749 363.849 373.949 384.049 394.149 404.249 414.349 424.449 434.549">可读为它的前置同位意象。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="444.649 449.699 454.182 457.545 460.352 465.402">darin </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="467.927">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="478.027 480.552 487.845 492.895 497.945 502.995 505.802"> wohnt </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="508.327 518.427 528.527 538.627">是插入的</tspan></text><text y="341" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4">关系说明，白话仍置于红云之后；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="197.5 205.356 210.406 215.456 220.506 225.556 230.039 232.564 239.858 244.908 249.958 252.764 257.247">mondne Kühle </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="259.772 269.872 279.972 290.072 300.172 310.272 320.372 330.472 340.572 350.672 360.772 370.872 380.972 391.072 401.172 411.272 421.372 431.472 441.572">的附着保留诗性开放，不指定为神的动作。</tspan></text><text y="364.8" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#283541" x="46 51.3 56.6">03 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#283541" x="59.25 69.85 80.45 91.05 101.65 112.25">末句宾语前置</tspan></text><text y="382.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill
