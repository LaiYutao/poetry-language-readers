" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="7" fill="#6f7c7b" x="48 51.5">10</tspan></text><text y="495.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="72.364 79.964">云层</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="87.564">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#89798d" x="90.095 97.695">复 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="102.095 109.695">自己</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="117.295">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#89798d" x="119.826 127.426">宾 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="131.826 139.426">在这</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="147.026 149.557 152.93 155.042 157.572">(at)·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#89798d" x="160.103 167.703">与 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="172.103 179.703 187.303 199.979 207.579">晚上 显现</tspan></text><text y="511.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="7" fill="#6f7c7b" x="48 51.5">11</tspan></text><text y="524.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="68">这</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="75.6">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#89798d" x="78.131 85.731">主 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="93.797 101.397 108.997 125.144 132.744 138.809">灵魂 也 在</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="146.409 148.94 151.051 154.851 157.382">(in) </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="170.525 178.125 185.725 193.325 200.925 239.106 246.706">天使般的 沉默</tspan></text><text y="540.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="7" fill="#6f7c7b" x="48 51.5">12</tspan></text><text y="553.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="88.987 96.587 104.187 111.787 142.484 150.084">易逝的 形象</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="157.684">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#89798d" x="160.215 167.815">复 </tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="186.706">[</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="189.237 196.837 218.12">消 没</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="225.72">]</tspan></text><text y="583.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#355570" x="56 66.5 77 87.5">白话译文</tspan></text><text y="606.35" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8 540.9">衰败，轻柔地把树叶笼暗，它广大的沉默住在森林里。不久，一座村庄仿佛幽灵般倾斜。姐妹的嘴在黑枝间低语。</tspan></text><text y="629.65" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4">孤独者不久将逸去，也许是黑暗小径上的一个牧人。一只兽轻轻走出树的拱廊，而眼睑面对神性睁大。</tspan></text><text y="652.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9">蓝色的河美丽地向下流淌，云层在傍晚显现；灵魂也在天使般的沉默中。易逝的形象沉没。</tspan></text><text y="676.65" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#355570" x="56 66.5 77 87.5">句法关系</tspan></text><text y="697.65" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#355570" x="92.003 99.503">回指</tspan></text><text y="704.45" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="7
