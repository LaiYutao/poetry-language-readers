 177.544 182.253 187.623 193.673">Gewaltig endet so das Jahr</tspan></text><text y="206.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 78.759 82.121 85.482 88.507 94.557 100.607 103.969 110.019 116.069 121.44 130.851 133.876 145.297 150.668 154.029 160.079 163.104 169.154 175.204 181.254 184.279 191.009 195.038 201.088 206.459 212.509 215.87 218.895 224.946 230.316 234.345 237.37 246.109 251.479 255.509 258.87 264.241 270.291">Mit goldnem Wein und Frucht der Gärten.</tspan></text><text y="235.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.071 82.121 88.171 94.221 97.246 101.954 107.325 113.375 122.113 127.484 130.846 136.896 142.266 148.316 151.341 162.762 168.132 171.494 177.544 182.915 186.944 189.969 198.707 204.757 210.807 216.857 222.228 226.257 232.307 237.678">Rund schweigen Wälder wunderbar</tspan></text><text y="264.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 88.838 91.863 96.572 99.934 105.984 112.034 115.059 121.109 126.479 131.188 134.213 141.604 144.966 151.016 155.725 161.096 170.507 175.878 181.928 184.953 193.691 199.062 203.091 208.462 214.512 218.541 221.903 227.273 233.323">Und sind des Einsamen Gefährten.</tspan></text><text y="314.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.109 85.134 89.843 95.213 101.263 104.625 107.65 113.7 119.071 123.1 126.125 133.516 138.887 144.937 150.987 160.398 165.769 171.819 177.869 181.231 184.256 191.647 196.356 199.381 202.742 207.451 210.813 213.838 219.888 225.938 229.3">Da sagt der Landmann: Es ist gut.</tspan></text><text y="343.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 72.029 78.079 82.109 85.134 93.872 99.922 105.293 111.343 117.393 123.443 126.804 132.854 138.225 144.275 149.645 155.695 158.72 162.082 167.453 173.503 179.553 182.578 188.628 194.678 200.728 203.753 207.115 212.485 215.847 220.556">Ihr Abendglocken lang und leise</tspan></text><text y="372.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.109 88.159 91.521 94.546 100.596 106.646 112.016 118.066 121.091 126.462 132.512 141.923 144.948 152.34 158.39 164.44 169.81 172.835 176.865 180.894 186.944 192.994 198.365 204.415 207.44 218.198 224.248 227.61">Gebt noch zum Ende frohen Mut.</tspan></text><text y="401.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 75.391 78.753 84.803 87.828 96.566 102.616 108.666 114.037 117.398 122.769 128.819 134.869 137.894 143.944 147.973 154.023 160.073 163.435 166.46 171.831 177.881 181.91 184.935 190.985 196.356 200.385 203.41 211.481 216.851 220.213 224.922 230.292">Ein Vogelzug grüßt auf der Reise.</tspan></text><text y="451.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 75.391 80.1 83.125 86.487 91.196 94.557 97.582 103.632 109.003 113.032 116.057 123.448 126.81 132.181 138.231 143.601 146.626 156.038 159.4 162.762 168.812 174.182 177.207 184.598 189.969 193.331 196.692">Es ist der Liebe milde Zeit.</tspan></text><text y="480.25" xml:space="preserve" styl tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="75.943">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#89798d" x="78.474 86.074">主 </tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="92.396">[</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="94.927 102.527 106.927">沉 在</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="114.527 117.058 119.17 122.97 125.5">(in) </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="129.9 137.5 145.1 149.5">宁静 和</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="157.1 159.631 163.005 166.805 170.605 173.135">(and) </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="189.253 196.853 204.453 235.301">沉默 没</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="242.901">]</tspan></text><text y="583.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#355570" x="56 66.5 77 87.5">白话译文</tspan></text><text y="606.35" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3">一年就这样盛大地结束，带着金色的酒和园中的果实。树林在四周奇妙地沉默，成为孤独者的伙伴。</tspan></text><text y="629.65" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6">这时，农人说：很好。你们这些晚钟，悠长而轻柔，在结束之际再给人欢快的勇气。一群鸟在旅途中致意。</tspan></text><text y="652.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6">这是爱的温和时光。乘小舟顺着蓝河而下，画面接着小画面，排列得多么美好——这一切沉入宁静与沉默。</tspan></text><text y="676.65" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#355570" x="56 66.5 77 87.5">句法关系</tspan></text><text y="697.65" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#355570" x="148.589 156.089">呼语</tspan></text><text y="704.45" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#283541" x="56 59.619 64.791 68.919 71.244 77.96 83.133 87.26 92.433 97.605 102.255 104.839 109.489 113.616 118.789 122.916 128.089 183.089 190.322 194.45 199.622">Ihr Abendglocken Gebt</tspan></text><text y="721.45" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 80.9 89.2 97.5 105.8 114.1">对晚钟发出的请求</tspan></text><text y="742.65" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#355570" x="93.043 100.543">接续</tspan></text><text y="749.45" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#283541" x="56 62.203 64.787 67.371 72.543 127.543 132.193 137.365 139.69 145.893 148.477 151.061 156.233 160.361 165.533 169.661">Bild an Bildchen</tspan></text><text y="766.45" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 80.9 89.2">一幅接一幅</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 66 70.887 76.223 82 86.887 92.664 98 102.887 107.773 113.109 115.109 120.887 125.773 131.109 136.445 140.895">08 / VERKLÄRTER HERBST</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#355570" x="540.276 544.776">17</tspan></text></g></svg><button class="hotspot" data-action="play" data-poem="8" style="left:67.02778%;top:4.03853%;width:7.89550%;height:2.13805%" aria-label="播放或暂停第8首" title="播放或暂停第8首"></button><button class="hotspot" data-action="stop" data-poem="8" style="left:75.76323%;top:4.03853%;width:7.22354%;height:2.13805%" aria-label="停止第8首" title="停止第8首"></button><a class="hotspot" href="https://librivox.org/gedichte-by-georg-trakl/" target="_blank" rel="noopener noreferrer" style="left:83.99471%;top:4.03853%;width:8.23148%;height:2.13805%" aria-label="查看原录音与朗读者" title="查看原录音与朗读者"></a>
