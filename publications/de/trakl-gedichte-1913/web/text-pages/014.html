 233.358 238.408 242.891 247.941 252.991 257.474">die kleine Schenke </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="259.999">是</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="270.099 272.624 277.107 280.47 284.4 288.883 293.933 298.416 301.222 306.272 309.078"> erscheint </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="311.603 321.703 331.803 341.903 352.003 362.103 372.203 382.303 392.403 396.332 406.432 416.532 426.632 436.732 440.893 450.993 461.093 471.193 481.293 491.393 501.493 505.422 515.522 525.622 535.722 545.822">的主语。中文可说“行人看见”，但此处保留“酒馆呈现”</tspan></text><text y="656.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3">的视角。</tspan></text><text y="680.05" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#283541" x="46 51.3 56.6">02 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#283541" x="59.25 69.85 80.45 91.05 101.65">不定式片段</tspan></text><text y="697.55" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="46 53.294 57.777 61.14 64.504 67.31 70.116 74.599 79.649 82.455">Herrlich: </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="84.98 95.08 105.18 115.28 125.38 135.48 145.58">后省略系词，用</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="155.68 158.205 162.688 167.738 170.263 173.069 177.552 182.602 190.458 194.94 197.747 202.797"> zu taumeln </tspan><tspan font-family="ReaderSongLight" font-weight="300
