.135 258.185 264.235 270.285">In Hof scheint weiß der herbstliche Mond.</tspan></text><text y="206.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 92.2 95.225 103.963 109.334 114.704 120.754 124.784 130.154 136.204 142.254 145.279 149.309 154.679 158.041 161.403 166.773 172.823 175.848 181.898 187.948 193.319 199.369 202.731 208.101 212.81 216.172 219.534 224.242 229.613 235.663 241.034 244.059 250.788 256.159 262.209 267.579 270.941 274.303 279.673 285.723">Vom Dachrand fallen phantastische Schatten.</tspan></text><text y="235.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 75.391 78.753 84.803 87.828 94.557 99.928 105.978 114.716 120.087 123.448 129.498 134.869 140.919 143.944 147.306 153.356 156.381 159.743 165.113 170.484 174.513 179.884 185.934 188.959 195.688 201.059 207.109 211.817 215.179 220.55 224.579 230.629 233.654 242.392 248.442 254.492 260.542 263.904">Ein Schweigen in leeren Fenstern wohnt;</tspan></text><text y="264.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.109 85.134 88.496 93.866 99.916 105.287 111.337 116.707 122.757 125.782 129.144 134.515 137.876 142.585 147.956 150.981 157.031 162.401 166.431 171.801 177.851 181.881 184.906 190.956 194.317 199.688 202.713 210.784 216.154 219.516 222.878 228.248">Da tauchen leise herauf die Ratten</tspan></text><text y="314.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 88.838 91.863 97.913 103.963 108.672 114.043 120.093 125.463 131.513 134.538 140.588 144.618 149.988 153.35 157.379 162.75 168.8 174.85 177.875 183.925 187.287 192.657 196.687 199.712 205.762 211.812 217.862 220.887 226.937 232.987 237.016">Und huschen pfeifend hier und dort</tspan></text><text y="343.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 88.838 91.863 97.234 100.596 106.646 109.671 115.721 119.75 125.121 131.171 134.532 137.894 143.265 149.315 154.685 158.715 161.74 170.478 176.528 182.578 187.287 190.648 196.698 202.069 208.119 213.49 219.54 222.565 231.303 234.665 238.026 241.388 246.759 250.788">Und ein gräulicher Dunsthauch wittert</tspan></text><text y="372.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 72.029 78.079 84.129 89.5 95.55 98.575 104.625 109.996 115.366 121.416 124.441 129.812 135.862 140.57 143.595 149.645 155.016 164.428 167.453 176.191 182.241 188.291 192.32 195.682">Ihnen nach aus dem Abort,</tspan></text><text y="401.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.109 88.159 91.184 97.234 102.604 105.966 110.675 114.037 119.407 123.437 129.487 134.857 138.887 142.248 145.273 151.323 156.694 160.723 163.748 174.507 180.557 186.607 192.657 197.366 202.737 208.787 214.157 217.519 223.569 226.594 232.644 238.694 242.723 248.094 254.144 259.514 262.876 266.238 269.6 274.97 279">Den geisterhaft der Mondschein durchzittert</tspan></text><text y="451.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 88.838 91.863 96.572 99.934 105.304 108.329 114.379 119.75 123.112 127.141 132.512 138.562 141.587 147.637 153.687 157.716 160.741 169.479 172.841 178.212 182.241 185.266 194.004 197.366 202.737 205.762 209.123 215.173 218.535">Und sie keifen vor Gier wie toll</tspan></text><text y="480.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 88.838 91.863 97.234 101.263 105.293 111.343 114.704 118.066 123.437 129.487 132.512 141.25 146.62 152.67 157.379 160.404 166.454 172.504 178.554 181.579 188.309 193.679 199.729 205.1 211.15 217.2 222.57 228.62">Und erfüllen Haus und Scheunen,</tspan></text><text y="509.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 80.1 85.471 88.496 94.546 100.596 106.646 109.671 118.409 124.459 128.488 134.538 137.563 143.613 149.663 155.713 158.738 165.468 169.497 175.547 180.918 186.968 190.329 195.7 201.75 204.775 210.825 216.875 220.237 223.598">Die von Korn und Früchten voll.</tspan></text><text y="538.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 75.391 78.753 83.462 86.824 92.874 98.244 101.269 112.69 116.051 122.101 128.151 133.522 136.547 139.909 149.321 152.345 161.084 167.134 173.184 179.234 184.604 187.966 190.991 197.041 201.07 206.441 209.803 215.853 221.223 227.273">Eisige Winde im Dunkel greinen.</tspan></text></g><g class="text-block"><text y="115.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#355570" x="56 66.5">原文</tspan><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.5" fill="#355570" x="77 79.625
