#355570" x="56 66.5 77 87.5">白话译文</tspan></text><text y="569.35" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4">你总是重新归来，忧郁啊，孤独灵魂的温柔。一个金色的日子灼亮着走向终点。</tspan></text><text y="592.65" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4">忍耐者谦卑地向痛苦屈身，鸣响着和谐的音调和轻柔的疯狂。看，天已经暗了。</tspan></text><text y="615.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3">夜又归来，一个有死之物哀诉，另一个与它一同受苦。</tspan></text><text y="639.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6">在秋星下战栗，头颅一年年垂得更低。</tspan></text><text y="662.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#355570" x="56 66.5 77 87.5">句法关系</tspan></text><text y="683.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#355570" x="133.077 140.577">主语</tspan></text><text y="690.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#283541" x="56 61.172 65.3 69.428 71.753 78.987 83.114 88.287 93.459 96.043 101.215 103.799 108.449 112.577 167.577 172.749 176.877 182.049 186.699 189.796 192.121 195.74 198.324 202.452">der Geduldige beugt sich</tspan></text><text y="707.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 80.9 89.2 97.5 105.8 114.1">忍耐者向痛苦屈身</tspan></text><text y="728.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#355570" x="118.07 125.57 133.07 140.57">可分动词</tspan></text><text y="735.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#283541" x="56 58.584 62.712 65.295 70.468 74.595 77.692">leidet </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="9.3" fill="#283541" x="80.017">…</tspan><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#283541" x="89.317 91.642 99.389 101.973 105.07 160.07 164.198 166.782 171.954 174.279 178.929 184.101 189.273 193.401 197.529 201.657"> mit ein anderes</tspan></text><text y="752.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 80.9 89.2 97.5 105.8">另一个共同受苦</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 62.887 68.664 70.664 75.551 78.215 83.992 85.992 91.77 96.656 101.543 106.43 110.879 112.879 117.328 122.215 127.992 135.105 142.219 147.555 153.332 158.668">10 / IN EIN ALTES STAMMBUCH</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#355570" x="540.276 544.776">21</tspan></text></g></svg><button class="hotspot" data-action="play" data-poem="10" style="left:67.02778%;top:4.03853%;width:7.89550%;height:2.13805%" aria-label="播放或暂停第10首" title="播放或暂停第10首"></button><button class="hotspot" data-action="stop" data-poem="10" style="left:75.76323%;top:4.03853%;width:7.22354%;height:2.13805%" aria-label="停止第10首" title="停止第10首"></button><a class="hotspot" href="https://librivox.org/gedichte-by-georg-trakl/" target="_blank" rel="noopener noreferrer" style="left:83.99471%;top:4.03853%;width:8.23148%;height:2.13805%" aria-label="查看原录音与朗读者" title="查看原录音与朗读者"></a>
