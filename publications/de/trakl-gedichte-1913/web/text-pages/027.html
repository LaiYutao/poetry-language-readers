8.816 214.187 217.548 223.598 226.623 231.332 236.703 242.753 251.491 256.862 260.891 266.262 271.632 275.661 278.687 286.757 292.128 298.178 303.548 309.598 312.623 316.653 322.023 325.385 328.747 332.108">Es ist ein Stoppelfeld, in das ein schwarzer Regen fällt.</tspan></text><text y="206.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 75.391 80.1 83.125 86.487 91.196 94.557 97.582 102.953 106.315 112.365 115.39 121.44 125.469 130.84 136.89 142.94 148.31 152.34 155.365 163.435 168.806 174.856 184.268 187.293 190.317 196.368 201.738 205.767 208.792 214.163 217.525 223.575 228.284 233.654 243.066 246.091 252.141 257.512 262.22 265.582 270.953 277.003 280.364">Es ist ein brauner Baum, der einsam dasteht.</tspan></text><text y="235.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 75.391 80.1 83.125 86.487 91.196 94.557 97.582 102.953 106.315 112.365 115.39 122.781 126.143 130.851 136.222 142.272 147.643 151.004 159.743 163.104 169.154 175.204 178.229 181.254 187.304 192.675 196.704 199.729 203.091 208.462 213.832 217.862 223.232 226.257 234.995 241.045 244.407 247.769 253.139 259.189 262.214 268.264 277.676 283.726 287.756 293.126 296.488 301.197">Es ist ein Zischelwind, der leere Hütten umkreist</tspan></text><text y="264.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 79.421 82.782 88.153 91.178 94.54 98.569 103.94 109.99 114.019 117.381 123.431 126.456 132.506 135.868 141.238 145.947 151.318 155.347 158.372 167.11 173.16 178.531 184.581 190.631">Wie traurig dieser Abend.</tspan></text><text y="314.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 86.15 89.175 100.596 105.966 109.328 112.69 118.06 122.09 125.115 131.165 137.215 141.244 147.294 152.665">Am Weiler vorbei</tspan></text><text y="343.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 74.729 80.1 89.512 98.924 104.294 107.656 111.018 114.043 120.093 123.454 128.825 131.85 136.559 141.929 147.979 152.009 155.371 160.741 163.766 175.187 180.557 183.919 188.628 193.998 197.023 203.073 209.123 214.494 220.544 223.569 228.278 234.328 239.698 243.728 247.089 250.451 255.822 261.872 267.242 270.267 279.006 285.056 289.085 294.455 300.505 303.531 308.901 312.263 318.313">Sammelt die sanfte Waise noch spärliche Ähren ein.</tspan></text><text y="372.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 72.029 78.079 82.109 87.479 90.504 99.243 105.293 111.343 116.713 122.763 125.788 134.526 139.897 143.259 149.309 154.679 160.729 163.754 167.784 173.834 179.884 185.934 188.959 195.009 201.059 207.109 210.134 216.184 222.234 225.595 231.645 235.007 241.057 244.082 247.444 253.494 256.519 262.569 267.939 271.969 274.994 283.732 289.103 298.514 307.926 313.297 317.326 323.376 329.426">Ihre Augen weiden rund und goldig in der Dämmerung</tspan></text><text y="401.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 88.838 91.863 95.225 101.275 105.304 108.329 115.059 120.429 126.479 132.529 138.579 141.604 147.654 153.025 157.054 161.084 164.446 167.47 173.52 178.891 183.6 186.625 192.675 196.037 205.448 214.86 218.222 221.584 226.293 231.663
