</g><g class="text-block"><text y="47" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.5" fill="#355570" x="532.276 540.776">续页</tspan></text><text y="48" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10" fill="#355570" x="46 53.222 59.33 66.552 73.222 80.443 82.943 89.052 95.722 102.943 110.165 116.273 118.773 121.552 124.052 129.052">GEORG TRAKL / 10</tspan></text><text y="84" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="19" fill="#283541" x="46 52.327 66.048 70.798 82.404 88.731 102.453 107.203 120.924 132.53 144.136 155.742 166.309 171.059 181.625 193.231 206.953 223.847 240.741 253.414 267.135 279.808">IN EIN ALTES STAMMBUCH</tspan></text></g><g class="text-block"><text y="115.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#355570" x="56 66.5 77 87.5">重点句法</tspan></text><text y="138.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#283541" x="46 51.3 56.6">01 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#283541" x="59.25 69.85 80.45 91.05 101.65">呼语与省略</tspan></text><text y="156.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="46 51.05 56.1">du </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="58.625">与</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#
