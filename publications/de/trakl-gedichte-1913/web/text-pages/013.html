541" x="165.508 169.439 172.245 176.728 181.778 184.303 187.666 191.03 196.08 201.13 203.655 208.705 213.755 218.805 221.33 224.136 226.942 231.992 237.042 239.567 244.05 248.533 251.339 256.389 260.872 265.922">sich froh und lind zeigen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="268.447 278.547 288.647 298.747 308.847 318.947 329.047 339.147">为显得快乐温柔。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="349.247 353.177 355.983 360.466 365.516">sich </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="368.041 378.141 388.241 398.341 408.441 418.541 428.641 438.741 448.841 458.941 469.041 472.97 483.07 493.17 497.331">不都需要在白话中译成“自己”。</tspan></text><text y="179.9" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#283541" x="46 51.3 56.6">02 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#283541" x="59.25 69.85 80.45 91.05 101.65">倒装与状态</tspan></text><text y="197.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="46 55.533 60.016 62.822 65.628 68.153 73.203 76.566 79.93 84.413 89.463 91.988 97.038 99.844 104.327 106.852 113.021 118.071 120.877 125.36 130.41 135.46 139.943 147.799 155.655 160.138 163.501 168.551 171.076 175.007 177.813 182.863 187.913">Weit offen die Totenkammern sind </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="190.438">将</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="200.538 203.063 206.993 209.8 214.85 219.9"> sind </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="222.425 232.525 242.625">后置；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="252.725 257.775 262.257 270.113 274.596 277.402 280.209">bemalt </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="282.734">与</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="292.834 295.359 300.409 303.772 307.135 311.618 316.668"> offen </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="319.193 329.293 339.393 349.493 359.593 369.693 379.793 389.893 399.993 410.093 420.193 430.293">并列，描述停尸室的状态。</tspan></text><text y="221.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#355570" x="56 66.5 77 87.5 98">来源与校对</tspan></text><text y="242.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="46">《</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="54.7 60.983 64.844 69.194 71.611 75.473 79.823 82.24">Gedichte</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="86.102">》</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="94.802 97.699 102.049 106.399 110.749 115.099">(1913)</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="117.996 126.696 135.396 144.096 152.796">，原集章节</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="8.7" fill="#6f7c7b" x="161.496 163.671 167.532 171.882 174.78 179.13"> ch-17</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.7" fill="#6f7c7b" x="183.48 192.18 200.88 209.58 218.28 226.98 235.68">；电子文本锚点</tspan><tspan font-family="ReaderTimes" font-weight="400" fon
