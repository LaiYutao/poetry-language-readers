2 217.868 223.238 228.609 231.97 238.02 241.382 244.407 247.769 257.181 260.206 266.935 272.306 278.356 282.385 287.756 291.117 294.479 299.85">Das braune Dorf. Ein Dunkles zeigt im Schreiten</tspan></text><text y="206.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 74.729 78.091 83.462 89.512 92.537 98.587 102.616 105.978 109.003 114.373 120.423 123.448 134.207 139.578 145.628 150.998 155.028 161.078 164.103 167.128 173.178 176.54 181.91 184.935 188.297 197.709 200.734 209.472 214.842 218.872 224.922 229.631 232.992 238.363 241.388 246.097 249.459 254.829 260.879 266.929">Sich oft an Mauern, die im Herbste stehn,</tspan></text><text y="235.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.109 86.818 90.179 95.55 98.912 102.273 107.644 113.694 117.056 120.081 130.84 136.21 142.26 148.31 151.335 160.073 163.435 168.806 171.831 183.251 188.622 191.984 198.034 201.059 204.084 212.822 218.192 222.222 226.931 230.292 236.342 240.372 246.422 251.792 257.842 263.213 266.238 272.288 277.658 283.708">Gestalten: Mann wie Weib, Verstorbene gehn</tspan></text><text y="264.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 72.029 78.079 81.104 87.154 93.204 99.254 102.616 107.987 114.037 117.062 123.791 127.153 133.203 139.253 144.623 150.673 153.698 157.06 162.431 168.481 173.851 177.881 180.906 188.976 194.347 197.709 201.07 204.095 210.145 215.516 219.545 224.916 228.278 231.64 237.01 243.06">In kühlen Stuben jener Bett bereiten.</tspan></text><text y="314.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 80.1 85.471 89.5 92.525 97.234 103.284 106.646 112.016 115.378 120.748 126.798 129.823 138.562 144.612 149.982 156.032 161.403 167.453 170.478 173.503 180.232 185.603 191.653 200.391 205.762 209.791 215.162 218.186 224.916 230.286 236.337 241.707 245.069 248.431 253.801 259.851 262.876 268.926 272.956 278.326 281.688 285.05 290.42">Hier spielen Knaben. Schwere Schatten breiten</tspan></text><text y="343.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 74.729 78.091 83.462 89.512 92.537 98.587 104.637 110.007 114.037 117.062 123.112 127.141 132.512 138.562 144.612 149.982 153.007 157.716 163.087 169.137 174.507 180.557 185.928 188.953 191.978 202.737 208.107 214.157 220.207 225.578 228.603 234.653 240.023 246.073">Sich über braune Jauche. Mägde gehn</tspan></text><text y="372.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 86.818 92.188 98.238 101.263 105.293 110.663 116.713 122.084 128.134 131.495 136.866 139.891 147.962 151.323 156.694 162.744 168.114 171.139 177.19 183.239 189.29 192.315 198.365 201.726 206.435 215.173 220.544 223.906 227.267 232.638 238.688 241.713 246.422 251.792 257.842">Durch feuchte Bläue und bisweilen sehn</tspan></text><text y="401.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 87.497 90.522 99.26 105.31 111.36 116.731 122.781 125.806 130.515 133.877 139.247 142.272 145.297 150.668 154.697 158.726 164.776 168.138 171.5 174.862 177.887 183.937 189.987 196.037 199.062 207.8 213.17 218.541 224.591 227.953 234.003 239.373 242.735 248.106 254.156 257.517 262.888 268.938">Aus Augen sie, erfüllt von Nachtgeläuten.</tspan></text><text y="451.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 74.729 80.779 84.809 87.834 95.225 98.587 104.637 109.346 114.716 124.128 129.498 134.207 137.232 140.594 145.303 148.665 151.69 157.06 160.422 166.472 171.843 174.868 181.597 186.968 193.018 198.388 204.438 210.488 215.859 218.884 224.934 230.304">Für Einsames ist eine Schenke da;</tspan></text><text y="480.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.109 86.818 89.843 94.551 99.922 105.972 115.384 118.746 121.771 127.821 133.191 139.241 145.291 148.653 154.703 158.065 164.115 167.14 173.19 179.24 182.601 187.972 192.001 195.026 201.076 207.126 213.176 219.226 222.588 227.959 234.009 237.034 245.104 251.154 257.204 262.575 268.625">Das säumt geduldig unter dunklen Bogen,</tspan></text><text y="509.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 88.838 91.863 97.913 103.963 107.325 113.375 118.746 124.796 130.166 139.578 142.603 149.994 155.365 161.415 166.785 172.835 177.544 183.594 188.965 197.703 203.753 207.115 213.165 216.19 222.24 231.651 237.022 243.072 249.122 254.492 260.542">Von goldenem Tabaksgewölk umzogen.</tspan></text><text y="559.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 88.159 94.209 97.234 100.596 110.007 119.419 124.79 128.819 131.844 135.206 139.915 143.276 146.301 152.351 157.722 162.431 165.456 172.847 176.209 182.259 188. xt y="603.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="68.004">这</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="75.604">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#89798d" x="78.135 85.735">主 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="101.859 109.459 117.059">醉者 </tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="135.418">[</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="137.949 145.549 149.949 157.549">思 在这</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="165.149 167.679 169.791 173.591 176.122">(in)·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#89798d" x="178.653 186.253">与 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="190.653 198.253 205.853 219.372 226.972 234.572 242.172 247.674 255.274">影子 古老的 拱门</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="262.874">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#89798d" x="265.405">复</tspan></text><text y="619.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="7" fill="#6f7c7b" x="48 51.5">14</tspan></text><text y="632.015" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="68 75.6">这些</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="83.2">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#89798d" x="85.731 93.331">与 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="97.731 105.331 112.931 120.531 135.886">野生的 鸟</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="143.486">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#89798d" x="146.017 153.617">复 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="173.454">索</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="181.054 183.585">] </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="189.203 196.803">它们</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="7.6" fill="#89798d" x="204.403">·</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#89798d" x="206.934 214.534">主 </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.6" fill="#355570" x="232.293 239.893 247.493">远飞了</tspan></text><text y="662.75" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#355570" x="56 66.5 77 87.5">白话译文</tspan></text><text y="685.35" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">棕色的村庄。某种黑暗之物在行走中显现，常在秋日矗立的墙边；一些形象，男人和女人，死去的人在清冷房间</tspan></text><text y="700.65" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2">里走着，为那些人准备床铺。</tspan></text><text y="723.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8 540.9">男孩们在这里玩耍。沉重的影子铺在棕色粪水上。女仆们穿过湿润的蓝色，有时从充满夜间钟声的眼睛里向外望。</tspan></text><text y="747.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4">有一间酒馆为孤独之物存在；它耐心地停留在黑暗拱门下，被金色烟草云包围。</tspan></text><text y="770.55" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8">然而，属于自己的总是黑而近。醉者在古老拱门的阴影里，追想着那些已经远飞的野鸟。</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 65.109 67.773 73.551 75.551 81.328 86.215 91.551 96.887 101.336 106.223 112 117.336 122.223 128">19 / EIN HERBSTABEND</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#355570" x="540.276 544.776">39</tspan></text></g></svg><button class="hotspot" data-action="play" data-poem="19" style="left:67.02778%;top:4.03853%;width:7.89550%;height:2.13805%" aria-label="播放或暂停第19首" title="播放或暂停第19首"></button><button class="hotspot" data-action="stop" data-poem="19" style="left:75.76323%;top:4.03853%;width:7.22354%;height:2.13805%" aria-label="停止第19首" title="停止第19首"></button><a class="hotspot" href="https://librivox.org/gedichte-by-georg-trakl/" target="_blank" rel="noopener noreferrer" style="left:83.99471%;top:4.03853%;width:8.23148%;height:2.13805%" aria-label="查看原录音与朗读者" title="查看原录音与朗读者"></a>
