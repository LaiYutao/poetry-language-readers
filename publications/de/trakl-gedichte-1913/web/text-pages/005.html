</g><g class="text-block"><text y="46" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongUI" font-weight="400" font-size="8" fill="#355570" x="418.5 426.5 434.5 470.5 478.5 486.5 516.5 524.5">播放 停止 来源</tspan></text><text y="47" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8.2" fill="#283541" x="372.322 376.882 380.982 385.082 387.36">Sonia</tspan></text><text y="48" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10" fill="#355570" x="46 53.222 59.33 66.552 73.222 80.443 82.943 89.052 95.722 102.943 110.165 116.273 118.773 121.552 124.052 129.052">GEORG TRAKL / 01</tspan></text><text y="84" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="19" fill="#283541" x="46 59.721 66.048 77.654 82.404 95.077 108.798 121.471 133.077">DIE RABEN</tspan></text></g><g class="verse"><text y="138.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 80.768 88.159 91.184 99.254 107.993 116.063 123.454">DIE RABEN</tspan></text><text y="177.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 88.159 92.188 95.213 101.263 106.634 112.684 115.709 120.418 125.788 131.838 140.576 145.947 149.976 155.347 160.717 166.767 169.792 181.213 184.575 190.625 196.675 202.045 205.407 208.432 214.482 219.853 224.561 227.923 233.294">Über den schwarzen Winkel hasten</tspan></text><text y="206.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 86.15 89.175 99.934 103.296 106.657 110.019 115.39 121.44 124.465 130.515 133.876 139.247 142.272 150.343 155.713 161.763 167.134 173.184 176.209 185.62 188.982 192.344 195.369 201.419 206.79 210.819 214.181 219.551 228.963 231.988 238.718 244.088 250.138 254.167 259.538 262.9">Am Mittag die Raben mit hartem Schrei.</tspan></text><text y="235.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 72.029 78.079 82.109 85.134 91.863 97.234 103.284 108.654 112.016 115.378 120.748 126.798 129.823 134.532 137.894 141.923 147.294 150.656 154.685 158.047 161.072 166.442 172.492 175.518 181.568 186.938 190.967 193.992 202.731 206.092 210.122 214.831 220.201 226.251 232.301 238.351 244.401 247.426 253.476 259.526 263.556 269.606 274.976">Ihr Schatten streift an der Hirschkuh vorbei</tspan></text><text y="264.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 82.788 88.838 91.863 101.275 106.646 112.696 118.066 124.116 133.528 138.898 142.26 145.285 149.994 153.356 158.726 164.776 168.138 171.163 180.575 185.945 191.995 195.02 199.729 203.091 208.462 211.487 220.898 226.948 230.978 235.007 238.369 243.078 248.448 254.498 257.523 261.553 266.923 271.632 274.994 280.364 286.414">Und manchmal sieht man sie mürrisch rasten.</tspan></text><text y="314.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="12.1" fill="#283541" x="68 76.738 79.763 88.501 91.863 97.234 100.259 104.968 108.329 113.7 116.725 122.775 126.137 131.507 134.532 140.582 144.612 149.982 156.032 162.082 167.453 <text y="644.95" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1">叫，</tspan></text><text y="668.25" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7">围着一具它们在某处嗅出的腐尸；忽然，它们把飞行转向北方，像送葬的行列消失在因欲乐而颤抖的空气中。</tspan></text><text y="820.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="8" fill="#6f7c7b" x="46 50 54 56 58.223 60.223 66 68.664 73.551 75.551 80.887 86.664 92 96.887">01 / DIE RABEN</tspan></text><text y="821.89" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="9" fill="#355570" x="544.776">5</tspan></text></g></svg><button class="hotspot" data-action="play" data-poem="1" style="left:67.02778%;top:4.03853%;width:7.89550%;height:2.13805%" aria-label="播放或暂停第1首" title="播放或暂停第1首"></button><button class="hotspot" data-action="stop" data-poem="1" style="left:75.76323%;top:4.03853%;width:7.22354%;height:2.13805%" aria-label="停止第1首" title="停止第1首"></button><a class="hotspot" href="https://librivox.org/gedichte-by-georg-trakl/" target="_blank" rel="noopener noreferrer" style="left:83.99471%;top:4.03853%;width:8.23148%;height:2.13805%" aria-label="查看原录音与朗读者" title="查看原录音与朗读者"></a>
