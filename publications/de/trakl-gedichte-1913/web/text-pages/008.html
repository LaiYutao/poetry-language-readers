</g><g class="text-block"><text y="47" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.5" fill="#355570" x="532.276 540.776">续页</tspan></text><text y="48" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10" fill="#355570" x="46 53.222 59.33 66.552 73.222 80.443 82.943 89.052 95.722 102.943 110.165 116.273 118.773 121.552 124.052 129.052">GEORG TRAKL / 02</tspan></text><text y="84" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="19" fill="#283541" x="46 62.894 76.615 87.182 93.509 107.23 111.98 118.308 135.202 139.952 156.846 163.173 175.846 189.567 202.24 213.846 225.452">MUSIK IM MIRABELL</tspan></text></g><g class="text-block"><text y="115.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#355570" x="56 66.5 77 87.5">白话译文</tspan></text><text y="138.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5 510.6 520.7 530.8">一眼喷泉在歌唱。云朵站在清澈的蓝色中，那些白而娇柔的云。安静的人们沉稳地走着，傍晚穿过古老的花园。</tspan></text><text y="161.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450">祖先的大理石已经灰白。一群鸟掠向远方。一个长着死寂眼睛的法翁，望向滑入黑暗的影子。</tspan></text><text y="184.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9">红叶从老树落下，旋转着穿过敞开的窗口。一道火光在室内亮起，描画出阴郁的恐惧幽灵。</tspan></text><text y="208" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="46 56.1 66.2 76.3 86.4 96.5 106.6 116.7 126.8 136.9 147 157.1 167.2 177.3 187.4 197.5 207.6 217.7 227.8 237.9 248 258.1 268.2 278.3 288.4 298.5 308.6 318.7 328.8 338.9 349 359.1 369.2 379.3 389.4 399.5 409.6 419.7 429.8 439.9 450 460.1 470.2 480.3 490.4 500.5">一个白色的异乡人走进房屋。一条狗冲过破败的走廊。女仆熄灭一盏灯，耳朵在夜里听见奏鸣曲的声音。</tspan></text><text y="231.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#355570" x="56 66.5 77 87.5">句法关系</tspan></text><text y="252.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#355570" x="112.657 120.157 127.657 135.157">属格修饰</tspan></text><text y="259.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#283541" x="56 62.716 66.844 70.972 73.297 80.013 85.185 90.357 94.485 99.657 154.657 163.435 168.085 172.213 179.96 184.61">Der Ahnen Marmor</tspan></text><text y="276.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 80.9 89.2 97.5">祖先的大理石</tspan></text><text y="297.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="7.5" fill="#355570" x="88.384 95.884">回指</tspan></text><text y="304.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="9.3" fill="#283541" x="56 61.172 63.756 67.884 122.884 128.056 132.184 137.356 142.006 145.103 148.2 152.328">die Schatten</tspan></text><text y="321.5" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongLight" font-weight="300" font-size="8.3" fill="#6f7c7b" x="56 64.3 72.6 80.9 89.2 97.5">复数关系从句</tspan></text><text y="344.7" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.5" fill="#355570" x="56 66.5 77 87.5">重点句法</tspan></text><text y="367.8" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#283541" x="46 51.3 56.6">01 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#283541" x="59.25 69.85 80.45 91.05 101.65 112.25">后置同位说明</tspan></text><text y="385.3" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="46 51.05 53.856 58.339 60.864 68.158 72.641 75.447 80.497 84.98 90.03 92.555 95.08 99.563 104.045 107.409 110.215 114.698 119.748">die weißen, zarten </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="122.273 132.373 142.473 152.573">后置补说</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="162.673 165.198 174.731 179.781 182.587 187.637 192.12"> Wolken</tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="197.17 207.27 217.37 227.47 237.57 247.67 257.77 267.87 277.97 288.07 298.17 308.27 318.37 328.47 338.57 348.67 358.77 368.87 378.97 389.07 399.17 409.27 419.37 429.47 439.57 449.67 459.77">，省去名词。中文在原句之后接续，不把它移成首句的定语。</tspan></text><text y="409.1" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#283541" x="46 51.3 56.6">02 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#283541" x="59.25 69.85 80.45 91.05">可分动词</tspan></text><text y="426.6" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="46 51.05 53.856 58.906 63.956 66.762">glüht </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="69.287">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="79.387 81.912 86.395 91.445 94.808"> auf </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="97.333">与</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="107.433 109.958 112.765 117.815 121.745 126.228 131.278 134.084"> löscht </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="136.609">…</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="146.709 149.234 153.717 158.767 162.697"> aus </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="165.222 175.322 185.422 195.522 205.622 215.722 225.822 235.922">各构成一个谓语；</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="246.022 251.072 255.555 258.919 263.402 266.208 271.258">herein </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="273.783 283.883 293.983 304.083 314.183 324.283 334.383 344.483 354.583 364.683 374.783 384.883 394.983 405.083 415.183 425.283 435.383 445.483 455.583 465.683 475.783 485.883 495.983">在此作为完整方向词保留，不在原词中添加分隔符。</tspan></text><text y="450.4" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimesBold" font-weight="700" font-size="10.6" fill="#283541" x="46 51.3 56.6">03 </tspan><tspan font-family="ReaderSongBold" font-weight="700" font-size="10.6" fill="#283541" x="59.25 69.85 80.45 91.05 101.65 112.25">属格与文化词</tspan></text><text y="467.9" xml:space="preserve" style="white-space:pre;font-kerning:none;font-variant-ligatures:none"><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="46 53.294 57.777 61.14 63.665 70.959 76.009 81.059 85.542 90.592 93.117 102.097 106.58 109.944 117.8 122.85 126.213">Der Ahnen Marmor </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="128.738 138.838 142.767 152.867 162.967 173.067 183.167 193.267 203.367 207.528 217.628 227.728 237.828 247.928 258.028 268.128 278.228 288.328 298.428 308.528 318.628 328.728 338.828 348.928 359.028">是“祖先的大理石”，可指雕像等纪念物，原文未点明。</tspan><tspan font-family="ReaderTimes" font-weight="400" font-size="10.1" fill="#283541" x="369.128 374.745 379.228 384.278 389.328">Faun </tspan><tspan font-family="ReaderSongLight" font-weight="300" font-size="10.1" fill="#283541" x="391.853 401.953 412.053 422.153 432.253 442.353 452.453 462.553 472.653 482.753 492.853 502.953 513.053">为
